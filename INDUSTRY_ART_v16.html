/* INDUSTRY ART V16 · estilos
   Tema Oscuro = la paleta de la V15 (azul noche, turquesa, rosa y dorado). Temas: Claro, Época y Alto contraste.
   Botones de 44 px o más y texto de 14 px o más. Vertical: menú abajo. Horizontal y PC: menú lateral y dos columnas. */
:root {
  --fondo: #0b1020; --panel: #151c33; --panel2: #1e2744; --borde: #2c3760; --texto: #e9edf8; --tenue: #a3aecb;
  --acento: #35d0ba; --acento-tx: #06231f; --rosa: #ff4f81; --dorado: #ffc857; --bien: #4ade80; --mal: #ff6b6b;
  --sombra: 0 8px 24px rgba(0, 0, 0, .35); --radio: 16px; --t: 16px; --barra: 56px; --menu: 64px; --lado: 220px;
  --titulos: 'Titulos', Impact, 'Arial Narrow', sans-serif;
  color-scheme: dark;
}
:root[data-tema="claro"] {
  --fondo: #f3f1ea; --panel: #ffffff; --panel2: #ece8dd; --borde: #d6d0c0; --texto: #1b1f2e; --tenue: #555d73;
  --acento: #0f8f7e; --acento-tx: #ffffff; --rosa: #d6265c; --dorado: #9a6b00; --bien: #15803d; --mal: #c2262e;
  --sombra: 0 6px 18px rgba(30, 30, 50, .15); color-scheme: light;
}
:root[data-tema="contraste"] {
  --fondo: #000; --panel: #0c0c0c; --panel2: #1a1a1a; --borde: #ffffff; --texto: #ffffff; --tenue: #e6e6e6;
  --acento: #00ffd5; --acento-tx: #000; --rosa: #ff5c93; --dorado: #ffe14d; --bien: #7dff7d; --mal: #ff7070;
}
:root[data-tema="epoca"][data-epoca="sepia"] {
  --fondo: #1d150c; --panel: #2a1f12; --panel2: #3a2b19; --borde: #5b452a; --texto: #f4e6cc; --tenue: #cdb48a;
  --acento: #e0a95b; --acento-tx: #241708; --rosa: #d9735b; --dorado: #f1cf7a;
}
:root[data-tema="epoca"][data-epoca="neon"] {
  --fondo: #10061f; --panel: #1b0d33; --panel2: #281448; --borde: #4b2a7a; --texto: #f7ecff; --tenue: #c4a8e6;
  --acento: #ff4fd8; --acento-tx: #23001c; --rosa: #4fe3ff; --dorado: #ffe14f;
}
:root[data-tema="epoca"][data-epoca="vidrio"] {
  --fondo: #071a22; --panel: #0d2833; --panel2: #133746; --borde: #24566a; --texto: #e6fbff; --tenue: #9cc7d4;
  --acento: #4ff0c8; --acento-tx: #032018; --rosa: #ff7aa8; --dorado: #ffd36e;
}
:root[data-texto="1"] { --t: 15px; }
:root[data-texto="3"] { --t: 18px; }
:root[data-texto="4"] { --t: 20px; }

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; }
body { background: var(--fondo); color: var(--texto); font: var(--t)/1.45 'Trebuchet MS', 'Segoe UI', system-ui, sans-serif; overflow: hidden; overflow-wrap: break-word; }
/* Nombres largos sin espacios (títulos y nombres de estudio) se cortan en vez de desbordar */
h1, h2, h3, .tarjeta b, .marca b, .col b { overflow-wrap: anywhere; }
.btn, .chip, .pestana, .tabla th, .tabla td { overflow-wrap: normal; }
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3 { font-family: var(--titulos); font-weight: 400; letter-spacing: .04em; margin: .2em 0 .4em; line-height: 1.1; }
h1 { font-size: 2.3em; } h2 { font-size: 1.6em; } h3 { font-size: 1.25em; }
a { color: var(--acento); }
.oculto { display: none !important; }
.tenue { color: var(--tenue); }
.chico { font-size: .9em; }
.bien { color: var(--bien); } .mal { color: var(--mal); } .oro { color: var(--dorado); } .rosa { color: var(--rosa); }
:focus-visible { outline: 3px solid var(--dorado); outline-offset: 2px; }

/* ---------- Estructura ---------- */
#app { position: fixed; inset: 0; display: grid; grid-template-rows: var(--barra) 1fr var(--menu); grid-template-columns: 1fr; grid-template-areas: "barra" "vista" "menu"; padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
#barra { grid-area: barra; display: flex; align-items: center; gap: 6px; padding: 0 8px; background: var(--panel); border-bottom: 1px solid var(--borde); min-width: 0; }
#menu { grid-area: menu; display: flex; background: var(--panel); border-top: 1px solid var(--borde); }
#vista { grid-area: vista; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; padding: 10px 10px 24px; outline: none; }
#app.sin-juego { grid-template-rows: 1fr; grid-template-areas: "vista"; }
#app.sin-juego #barra, #app.sin-juego #menu { display: none; }

/* Menú */
.nav { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 48px; background: none; border: 0; color: var(--tenue); cursor: pointer; font-size: 14px; padding: 4px 2px; }
.nav svg { width: 24px; height: 24px; }
.nav.on { color: var(--acento); box-shadow: inset 0 3px 0 var(--acento); }

/* Barra superior */
.marca { display: flex; align-items: center; gap: 6px; min-width: 0; flex: 0 1 auto; }
.marca canvas { width: 34px; height: 34px; flex: none; }
.marca b { font-family: var(--titulos); font-size: 1.15em; letter-spacing: .05em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 22vw; }
.fecha { display: flex; flex-direction: column; line-height: 1.1; min-width: 0; font-size: 14px; }
.fecha b { font-size: 15px; white-space: nowrap; }
.fecha span { white-space: nowrap; }
.dinero { background: var(--panel2); border: 1px solid var(--borde); border-radius: 12px; padding: 4px 10px; min-height: 44px; display: flex; flex-direction: column; justify-content: center; line-height: 1.05; cursor: pointer; min-width: 0; }
.dinero b { font-size: 16px; white-space: nowrap; }
.dinero span { font-size: 14px; color: var(--tenue); white-space: nowrap; }
.dinero.rojo b { color: var(--mal); }
.espacio { flex: 1; }
.ico { width: 44px; height: 44px; min-width: 44px; display: inline-flex; align-items: center; justify-content: center; border-radius: 12px; border: 1px solid var(--borde); background: var(--panel2); cursor: pointer; padding: 0; }
.ico svg { width: 22px; height: 22px; }
.avanzar { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 44px; min-width: 44px; padding: 0 12px; border-radius: 12px; border: 0; background: var(--acento); color: var(--acento-tx); font-weight: 700; cursor: pointer; white-space: nowrap; }
.avanzar svg { width: 20px; height: 20px; }
.avanzar.auto { background: var(--rosa); color: #fff; }

/* ---------- Componentes ---------- */
.tarjeta { background: var(--panel); border: 1px solid var(--borde); border-radius: var(--radio) var(--radio) var(--radio) 4px; padding: 12px; margin: 0 0 10px; }
.tarjeta.toque { cursor: pointer; }
.tarjeta.toque:active { transform: scale(.99); }
.fila { display: flex; align-items: center; gap: 10px; }
.fila.entre { justify-content: space-between; }
.fila.envolver { flex-wrap: wrap; }
.col { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.crece { flex: 1; min-width: 0; }
.rejilla { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
.dos { display: grid; gap: 10px; grid-template-columns: 1fr; }
.kpis { display: grid; gap: 8px; grid-template-columns: repeat(2, 1fr); }
.kpi { background: var(--panel2); border-radius: 12px; padding: 8px 10px; min-width: 0; }
.kpi span { display: block; color: var(--tenue); font-size: 14px; }
.kpi b { font-size: 1.15em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }
.kpi svg { width: 18px; height: 18px; vertical-align: -3px; }
.btn { min-height: 44px; padding: 10px 16px; border-radius: 12px; border: 1px solid var(--borde); background: var(--panel2); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-align: center; }
.btn.primario { background: var(--acento); color: var(--acento-tx); border: 0; font-weight: 700; }
.btn.peligro { background: var(--mal); color: #fff; border: 0; }
.btn.bloque { width: 100%; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn svg { width: 20px; height: 20px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { min-height: 44px; padding: 8px 12px; border-radius: 22px; border: 1px solid var(--borde); background: var(--panel2); cursor: pointer; }
.chip.on { background: var(--rosa); border-color: var(--rosa); color: #fff; }
.chip:disabled { opacity: .4; }
.pestanas { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 8px; scrollbar-width: thin; }
.pestana { flex: none; min-height: 44px; padding: 8px 14px; border-radius: 22px; border: 1px solid var(--borde); background: var(--panel); cursor: pointer; white-space: nowrap; }
.pestana.on { background: var(--acento); color: var(--acento-tx); border-color: var(--acento); font-weight: 700; }
label.campo { display: flex; flex-direction: column; gap: 4px; margin-bottom: 10px; }
label.campo > span { color: var(--tenue); font-size: 14px; }
input[type=text], input[type=number], input[type=search], select { width: 100%; min-height: 44px; padding: 8px 10px; border-radius: 10px; border: 1px solid var(--borde); background: var(--panel2); }
input[type=range] { width: 100%; accent-color: var(--acento); min-height: 44px; }
input[type=checkbox] { width: 24px; height: 24px; accent-color: var(--acento); }
.interruptor { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 48px; border-bottom: 1px solid var(--borde); }
.barra-p { height: 10px; border-radius: 6px; background: var(--panel2); overflow: hidden; }
.barra-p i { display: block; height: 100%; background: var(--acento); }
.etiqueta { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 14px; background: var(--panel2); border: 1px solid var(--borde); white-space: nowrap; }
.etiqueta.oro { color: var(--dorado); border-color: var(--dorado); }
.etiqueta.bien { color: var(--bien); border-color: var(--bien); }
.etiqueta.mal { color: var(--mal); border-color: var(--mal); }
.tabla { width: 100%; border-collapse: collapse; font-size: 15px; }
.tabla th, .tabla td { padding: 8px 6px; border-bottom: 1px solid var(--borde); text-align: left; vertical-align: top; }
.tabla td.n, .tabla th.n { text-align: right; white-space: nowrap; }
.tabla .chico, .kpi .chico { font-size: 14px; }
.desliza { overflow-x: auto; }
.poster { width: 96px; height: 144px; border-radius: 6px; flex: none; display: block; background: var(--panel2); }
.poster.grande { width: 160px; height: 240px; }
.retrato { width: 56px; height: 56px; flex: none; display: block; }
.retrato.grande { width: 112px; height: 112px; }
.lienzo { width: 100%; height: 160px; display: block; }
.estudio-lienzo { width: 100%; height: 260px; display: block; border-radius: 14px; background: #0b1020; }
.vacio { text-align: center; color: var(--tenue); padding: 24px 10px; }
.ayuda-i { width: 32px; height: 32px; min-width: 32px; border-radius: 50%; border: 1px solid var(--borde); background: var(--panel2); cursor: pointer; font-weight: 700; color: var(--acento); }
.ayuda-i { min-height: 44px; min-width: 44px; }
.titulo-sec { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 6px; }
.lista-obras .tarjeta { display: flex; gap: 10px; align-items: flex-start; }
.nota { font-size: 14px; color: var(--tenue); margin: 4px 0 8px; }
.cifra { font-variant-numeric: tabular-nums; }
.paso-actual { color: var(--acento); }
.encaje { color: var(--dorado); letter-spacing: 2px; }

/* ---------- Ficha deslizable (celular) / panel lateral (PC) ---------- */
#ficha { position: fixed; left: 0; right: 0; bottom: 0; max-height: 88vh; z-index: 30; background: var(--panel); border-top: 1px solid var(--borde); border-radius: 20px 20px 0 0; box-shadow: var(--sombra); transform: translateY(105%); transition: transform .25s ease; overflow-y: auto; padding: 8px 14px calc(18px + env(safe-area-inset-bottom)); }
#ficha.abierta { transform: none; }
#ficha .tirador { width: 48px; height: 5px; border-radius: 3px; background: var(--borde); margin: 4px auto 8px; }
#velo { position: fixed; inset: 0; background: rgba(0, 0, 0, .45); z-index: 25; display: none; }
#velo.on { display: block; }
#modal { position: fixed; inset: 0; z-index: 40; display: none; align-items: center; justify-content: center; padding: 16px; background: rgba(5, 8, 20, .7); }
#modal.on { display: flex; }
#modal .caja { width: 100%; max-width: 560px; max-height: 92vh; overflow-y: auto; background: var(--panel); border: 1px solid var(--borde); border-radius: 18px; padding: 16px; box-shadow: var(--sombra); }

.menu-ritmo button { min-height: 48px; text-align: left; padding: 8px 12px; border: 0; background: none; border-radius: 10px; cursor: pointer; }
.menu-ritmo button.on { background: var(--panel2); color: var(--acento); font-weight: 700; }

/* ---------- Inicio ---------- */
.portada { max-width: 560px; margin: 0 auto; padding: 24px 6px; text-align: center; }
.portada h1 { font-size: 3.2em; margin-top: .3em; }
.portada .btn { width: 100%; margin-bottom: 10px; }
.portada canvas { width: 100%; height: 220px; border-radius: 16px; display: block; }

/* ---------- Horizontal y PC: menú lateral y dos columnas ---------- */
@media (orientation: landscape) and (min-width: 640px), (min-width: 900px) {
  #app { grid-template-rows: var(--barra) 1fr; grid-template-columns: var(--lado) 1fr; grid-template-areas: "barra barra" "menu vista"; }
  #menu { flex-direction: column; border-top: 0; border-right: 1px solid var(--borde); padding: 8px 6px; gap: 4px; }

  .nav.on { box-shadow: none; background: var(--panel2); }
  .dos { grid-template-columns: 1fr 1fr; align-items: start; }
  .kpis { grid-template-columns: repeat(4, 1fr); }
  #ficha { left: auto; top: 0; width: min(440px, 92vw); max-height: none; border-radius: 20px 0 0 20px; border-left: 1px solid var(--borde); border-top: 0; transform: translateX(105%); padding-top: calc(12px + env(safe-area-inset-top)); }
  #ficha.abierta { transform: none; }
  #ficha .tirador { display: none; }
  #avisos { bottom: 16px; }
  .estudio-lienzo { height: 320px; }
}
/* Celular en horizontal: poca altura, menú lateral solo con íconos */
@media (orientation: landscape) and (max-height: 500px) {
  :root { --barra: 52px; --lado: 76px; }
  .nav { flex-direction: column; justify-content: center; gap: 0; padding: 4px; font-size: 14px; }
  .estudio-lienzo { height: 220px; }
  .marca b { display: none; }
  .fecha span { display: none; }
  .totales { position: static !important; }
}
@media (min-width: 1200px) { #vista { padding: 16px 22px 32px; } .dos { gap: 16px; } }
/* Forzar orientación de la interfaz si el jugador lo eligió */
:root[data-orientacion="vertical"] #app { grid-template-rows: var(--barra) 1fr var(--menu); grid-template-columns: 1fr; grid-template-areas: "barra" "vista" "menu"; }
:root[data-orientacion="vertical"] #menu { flex-direction: row; border-right: 0; border-top: 1px solid var(--borde); padding: 0; }
:root[data-orientacion="vertical"] .nav { flex: 1; flex-direction: column; }
/* Pantallas angostas: la barra se compacta */
@media (max-width: 420px) {
  .marca b { display: none; }
  .avanzar span { display: none; }
  .avanzar { padding: 0 10px; }
  .ico.opcional { display: none; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
:root[data-movimiento="menos"] * { transition: none !important; animation: none !important; }

<script>
/* ==== módulo: nucleo ==== */
// Arranque del espacio de nombres, azar con semilla, reloj semanal, mensajes entre módulos y utilidades.
// La partida vive en IA.n.S: un solo objeto de datos, sin funciones adentro.
var IA = {};
IA.VERSION = '16.0';
IA.VERSION_GUARDADO = 16;
// Banderas de edición en un solo lugar (completa o gratuita). Todas en "completa" hasta la V35.
IA.EDICION = { nombre: 'completa', ranurasManuales: 5, autoguardados: 3, bot: true };

IA.n = (function () {
  'use strict';
  const nucleo = { S: null };

  // ---------- Azar con semilla (sfc32) ----------
  // El estado son 4 enteros de 32 bits guardados en S.rng: la misma semilla y las mismas decisiones
  // dan la misma partida, así se repiten los errores y se comparan versiones.
  function semillaDeTexto(texto) {
    let h = 1779033703 ^ texto.length;
    for (let i = 0; i < texto.length; i++) {
      h = Math.imul(h ^ texto.charCodeAt(i), 3432918353);
      h = (h << 13) | (h >>> 19);
    }
    const sal = [];
    for (let k = 0; k < 4; k++) {
      h = Math.imul(h ^ (h >>> 16), 2246822507);
      h = Math.imul(h ^ (h >>> 13), 3266489909);
      h ^= h >>> 16;
      sal.push(h >>> 0);
    }
    return sal;
  }
  function estadoNuevo(semilla) {
    const st = semillaDeTexto(String(semilla));
    // Calentar el generador
    const tmp = { rng: st };
    for (let i = 0; i < 15; i++) paso(tmp.rng);
    return tmp.rng;
  }
  function paso(r) {
    let a = r[0] >>> 0, b = r[1] >>> 0, c = r[2] >>> 0, d = r[3] >>> 0;
    const t = (((a + b) >>> 0) + d) >>> 0;
    d = (d + 1) >>> 0;
    a = b ^ (b >>> 9);
    b = (c + (c << 3)) >>> 0;
    c = (c << 21) | (c >>> 11);
    c = (c + t) >>> 0;
    r[0] = a >>> 0; r[1] = b >>> 0; r[2] = c >>> 0; r[3] = d;
    return t / 4294967296;
  }
  function azar() { return paso(nucleo.S.rng); }
  function entero(a, b) { return a + Math.floor(azar() * (b - a + 1)); }
  function elegir(lista) { return lista[Math.floor(azar() * lista.length)]; }
  function probabilidad(p) { return azar() < p; }
  function normal(media, desvio) {
    // Box-Muller acotado a ±3 desvíos para que nada sea absurdo
    let u = 0, v = 0;
    while (u === 0) u = azar();
    v = azar();
    const z = Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
    return media + desvio * Math.max(-3, Math.min(3, z));
  }
  function ponderado(pesos) {
    let total = 0;
    for (let i = 0; i < pesos.length; i++) total += Math.max(0, pesos[i]);
    let x = azar() * total;
    for (let i = 0; i < pesos.length; i++) {
      x -= Math.max(0, pesos[i]);
      if (x < 0) return i;
    }
    return pesos.length - 1;
  }
  function mezclar(lista) {
    for (let i = lista.length - 1; i > 0; i--) {
      const j = Math.floor(azar() * (i + 1));
      const t = lista[i]; lista[i] = lista[j]; lista[j] = t;
    }
    return lista;
  }
  // Hash determinista (para arte, nombres estables y ruido sin gastar el generador)
  function hash(texto) {
    let h = 2166136261;
    const s = String(texto);
    for (let i = 0; i < s.length; i++) {
      h ^= s.charCodeAt(i);
      h = Math.imul(h, 16777619);
    }
    return h >>> 0;
  }
  function ruido(texto) { return hash(texto) / 4294967296; }

  // ---------- Reloj ----------
  // S.t = semanas desde el inicio. El año tiene 52 semanas; los meses salen del día real de cada semana.
  const DIAS_MES = [31, 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31];
  function anio(t) { const S = nucleo.S; return S.y0 + Math.floor((t === undefined ? S.t : t) / 52); }
  function semana(t) { const S = nucleo.S; return ((t === undefined ? S.t : t) % 52) + 1; }
  function mesDeSemana(sem) {
    let dia = (sem - 1) * 7 + 4; // día del medio de la semana
    for (let m = 0; m < 12; m++) {
      if (dia <= DIAS_MES[m]) return m;
      dia -= DIAS_MES[m];
    }
    return 11;
  }
  function mes(t) { return mesDeSemana(semana(t)); }
  function tDe(anioX, semanaX) { return (anioX - nucleo.S.y0) * 52 + (semanaX - 1); }

  // ---------- Mensajes entre módulos ----------
  const oyentes = {};
  function on(evento, fn) { (oyentes[evento] = oyentes[evento] || []).push(fn); }
  function emit(evento, datos) {
    const l = oyentes[evento];
    if (!l) return;
    for (let i = 0; i < l.length; i++) l[i](datos);
  }

  // ---------- Utilidades ----------
  function limitar(v, a, b) { return v < a ? a : v > b ? b : v; }
  function mezcla(a, b, f) { return a + (b - a) * f; }
  // Interpola una tabla [[x, y], ...] ordenada por x (lineal; fuera del rango usa el extremo)
  function interp(tabla, x) {
    if (x <= tabla[0][0]) return tabla[0][1];
    const n = tabla.length;
    if (x >= tabla[n - 1][0]) return tabla[n - 1][1];
    let i = 1;
    while (tabla[i][0] < x) i++;
    const a = tabla[i - 1], b = tabla[i];
    return a[1] + (b[1] - a[1]) * (x - a[0]) / (b[0] - a[0]);
  }
  // Interpolación geométrica (para poblaciones y precios que crecen en proporción)
  function interpLog(tabla, x) {
    if (x <= tabla[0][0]) return tabla[0][1];
    const n = tabla.length;
    if (x >= tabla[n - 1][0]) return tabla[n - 1][1];
    let i = 1;
    while (tabla[i][0] < x) i++;
    const a = tabla[i - 1], b = tabla[i];
    if (a[1] <= 0 || b[1] <= 0) return a[1] + (b[1] - a[1]) * (x - a[0]) / (b[0] - a[0]);
    return a[1] * Math.pow(b[1] / a[1], (x - a[0]) / (b[0] - a[0]));
  }
  function esc(s) {
    return String(s === undefined || s === null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function sigId() { return ++nucleo.S.sigId; }
  function suma(lista, fn) {
    let s = 0;
    for (let i = 0; i < lista.length; i++) s += fn ? fn(lista[i], i) : lista[i];
    return s;
  }
  function copiar(obj) { return JSON.parse(JSON.stringify(obj)); }
  function redondear(v, dec) { const p = Math.pow(10, dec || 0); return Math.round(v * p) / p; }

  Object.assign(nucleo, {
    estadoNuevo: estadoNuevo, azar: azar, entero: entero, elegir: elegir, probabilidad: probabilidad,
    normal: normal, ponderado: ponderado, mezclar: mezclar, hash: hash, ruido: ruido,
    anio: anio, semana: semana, mes: mes, mesDeSemana: mesDeSemana, tDe: tDe,
    on: on, emit: emit,
    limitar: limitar, mezcla: mezcla, interp: interp, interpLog: interpLog, esc: esc, sigId: sigId,
    suma: suma, copiar: copiar, redondear: redondear,
  });
  return nucleo;
})();

};

    return '';
  }

  // ---------- Era ----------
  function era(anio) {
    let e = D.cronologia[0];
    for (let i = 0; i < D.cronologia.length; i++) if (D.cronologia[i][0] <= anio) e = D.cronologia[i];
    return e[1];
  }
  function decada(anio) { return Math.floor(anio / 10) * 10; }
  function tecnologia(anio) {
    let t = D.tecnologias[0];
    for (let i = 0; i < D.tecnologias.length; i++) if (D.tecnologias[i].anio <= anio) t = D.tecnologias[i];
    return t;
  }

  // ---------- Tendencias de géneros (olas y cansancio) ----------
  function tendenciasIniciales() {
    const t = {};
    D.ORDEN_FAM.forEach(function (f) { t[f] = N.redondear(N.normal(0, 0.25), 3); });
    return t;
  }
  // Cada mes: deriva al azar, vuelve poco a poco a cero y se cansa si se estrena mucho de una familia
  function actualizarTendencias(estrenosPorFamilia, totalEstrenos) {
    const S = N.S;
    D.ORDEN_FAM.forEach(function (f) {
      const parte = totalEstrenos > 0 ? (estrenosPorFamilia[f] || 0) / totalEstrenos : 0.125;
      const cansancio = Math.max(0, parte - 0.2) * 0.8;
      let v = S.mundo.tendencias[f];
      v = v * 0.93 + N.normal(0, 0.09) - cansancio;
      S.mundo.tendencias[f] = N.redondear(N.limitar(v, -1, 1), 3);
    });
  }

  return {
    GRUPOS: GRUPOS, poblacion: poblacion, poblacionMundial: poblacionMundial, edades: edades,
    ipc: ipc, aEpoca: aEpoca, aHoy: aHoy, inflacionAnual: inflacionAnual, IPC_2025: IPC_2025,
    accesoCine: accesoCine, accesoMedio: accesoMedio, frecuenciaCine: frecuenciaCine, precioEntrada: precioEntrada,
    precioEntrada2025: precioEntrada2025, publicoCine: publicoCine, ocioEnCasa: ocioEnCasa,
    temporada: temporada, bonoGenero: bonoGenero, nombreMes: nombreMes, fechaDeSemana: fechaDeSemana,
    era: era, decada: decada, tecnologia: tecnologia,
    tendenciasIniciales: tendenciasIniciales, actualizarTendencias: actualizarTendencias,
  };
})();

/* ==== módulo: economia ==== */
// La nueva economía del cine. El dinero sale de personas que compran entradas, no del tamaño del presupuesto:
//   Público(r) = Población(r) × Acceso(r) × Frecuencia(r)
//   Cuota(i)   = e^U(i) / (e^U0 + e^Uotras + Σ e^U(j))       (competencia real cada semana)
//   Entradas   = Público/52 × Temporada × Cuota;  Taquilla = Entradas × Precio de la entrada
//   U(s+1)     = U(s) − δ + β (Público − Expectativa)          (desgaste y boca a boca)
// Reemplaza la fórmula de la V15 que convertía presupuesto en taquilla (el dinero infinito).
IA.economia = (function () {
  'use strict';
  const N = IA.n, D = IA.datos, M = IA.mundo;

  // ---------- Parámetros (el bot los revisa en cada versión) ----------
  const P = {
    AQ: 0.05,            // utilidad por punto de calidad percibida
    DELTA: 0.30,         // desgaste semanal de la novedad
    BETA: 0.008,         // fuerza del boca a boca por punto de diferencia
    ESTRELLAS: 0.55,     // utilidad por fama media de los protagonistas (0 a 1)
    LOCAL: 0.25,         // ventaja en la región de la sede del estudio
    TENDENCIA: 0.3,      // peso de la tendencia de la familia
    PARTICIPACION: 0.88, // parte del público posible que va al cine con una cartelera típica
    MULT_TIPICO: 2.0,   // bruto medio ÷ costo de una película típica (fija el presupuesto típico)
    U_TIPICA: -0.2,      // atractivo de estreno de una película típica de otras productoras
    CORTE: 0.025,        // la obra sale de cartelera bajo este % de su mejor semana
    MAX_SEMANAS: 30,
    ANIMO: 0.28,         // azar del ánimo del público en cada estreno
    IMPUESTO: 0.25,      // impuesto sobre utilidades
    ANTIMONOPOLIO: 0.35, // cuota que abre investigación
  };
  // Parte de la taquilla que recibe el estudio según la semana en cartelera (más alta al principio)
  function parteEstudio(semanaEnCartelera) {
    if (semanaEnCartelera <= 2) return 0.7;
    if (semanaEnCartelera <= 4) return 0.6;
    if (semanaEnCartelera <= 6) return 0.5;
    return 0.4;
  }
  // Grupos de edad: cuánto va al cine cada uno [niños, adolescentes, jóvenes, adultos, mayores]
  const PROPENSION = [0.9, 1.3, 1.4, 0.8, 0.45];
  // Películas que compiten por año en todo el mundo (las de los estudios simulados más las otras productoras)
  // En los primeros años se hacían miles de cortos; cada uno era una parte pequeña del mercado
  const PELICULAS_ANIO = [[1895, 200], [1900, 450], [1910, 900], [1920, 650], [1930, 480], [1940, 450], [1950, 400], [1960, 300], [1970, 250], [1980, 250], [1990, 280], [2000, 320], [2010, 350], [2020, 300], [2025, 320], [2050, 350], [2150, 350]];

  // ---------- Mercado del año (con caché) ----------
  const cache = { semilla: null, escenario: null, anio: {} };
  function datosAnio(anio) {
    const S = N.S;
    const sem = S ? S.semilla : '', esc = S ? S.escenario : '';
    if (cache.semilla !== sem || cache.escenario !== esc) { cache.semilla = sem; cache.escenario = esc; cache.anio = {}; }
    let d = cache.anio[anio];
    if (d) return d;
    d = { regiones: {}, mercado2025: 0, entradas: 0 };
    D.regiones.forEach(function (r) {
      const pub = M.publicoCine(r.id, anio);
      const precio2025 = M.precioEntrada2025(r.id, anio);
      const ed = M.edades(r.id, anio);
      let base = 0;
      for (let g = 0; g < 5; g++) base += ed[g] * PROPENSION[g];
      d.regiones[r.id] = { publico: pub, precio2025: precio2025, precio: M.aEpoca(precio2025, anio), edades: ed, baseEdad: base };
      d.mercado2025 += pub * precio2025;
      d.entradas += pub;
    });
    d.peliculas = N.interp(PELICULAS_ANIO, anio);
    // Presupuesto típico de la época (dólares de 2025): lo que puede pagar una película típica de ese mercado
    d.tipico2025 = Math.max(2000, d.mercado2025 * P.PARTICIPACION / d.peliculas / P.MULT_TIPICO);
    d.tipico = M.aEpoca(d.tipico2025, anio);
    cache.anio[anio] = d;
    return d;
  }
  function presupuestoTipico(anio) { return datosAnio(anio).tipico; }
  // Presupuesto típico suavizado (promedio de los últimos 6 años, en dólares del año): los sueldos y el
  // mantenimiento no saltan con cada auge o caída del mercado del cine.
  function tipicoSuavizado(anio) {
    let s = 0;
    for (let k = 0; k < 6; k++) s += presupuestoTipico2025(anio - k);
    return IA.mundo.aEpoca(s / 6, anio);
  }
  function presupuestoTipico2025(anio) { return datosAnio(anio).tipico2025; }
  // Reparto de una película típica: 55 % producción, 20 % talento, 25 % marketing
  function produccionTipica(anio, famId) {
    const fam = D.familia(famId);
    return presupuestoTipico(anio) * 0.55 * (fam ? fam.costo : 1);
  }
  function marketingTipico(anio) { return presupuestoTipico(anio) * 0.25; }

  // ---------- Talentos: tarifa de mercado ----------
  // Tarifa = Base(oficio) × IPC × (Habilidad/50)² × (1 + Fama)^1,5 × Demanda. La Demanda incluye el tamaño
  // del mercado de la época; nunca depende del presupuesto de tu obra (fallo 2 de la V15).
  // Demanda: las estrellas famosas y los talentos excepcionales están muy pedidos y cobran mucho más
  function demandaTalento(t) {
    const r = D.rasgos[t.rasgo];
    const excepcional = Math.max(0, (t.hab - 65) / 35);
    return (1 + 1.6 * t.fama * t.fama + 3 * excepcional * excepcional) * (r ? r[2] : 1);
  }
  function tarifa(t, anio) {
    const of = D.oficio(t.of);
    const demanda = demandaTalento(t);
    const v = of.base * presupuestoTipico(anio) * Math.pow(Math.max(5, t.hab) / 50, 2) * Math.pow(1 + t.fama, 1.5) * demanda;
    return Math.max(10, Math.round(v));
  }

  // ---------- Calidad, crítica y público ----------
  // Q = Σ w(familia)·S + 6·log2(Presupuesto/Típico) + Encaje + Rasgos + ε
  function familiaPrincipal(obra) { return D.familiaDe[obra.gen[0]] || 'DR'; }
  function familiasDe(obra) {
    const out = [];
    obra.gen.forEach(function (g) { const f = D.familiaDe[g]; if (f && out.indexOf(f) < 0) out.push(f); });
    return out;
  }
  function encajeObra(obra) {
    const fams = obra.gen.map(function (g) { return D.familiaDe[g]; });
    let s = 0;
    for (let i = 0; i < fams.length; i++) {
      for (let j = i + 1; j < fams.length; j++) if (fams[i] !== fams[j]) s += D.encaje(fams[i], fams[j]);
    }
    return s;
  }
  function habilidadDep(obra, dep, talentos, bonos) {
    const eq = obra.eq;
    let h;
    if (dep === 'interprete') {
      const a = talentos(eq.int[0]), b = talentos(eq.int[1]);
      h = a && b ? a.hab * 0.6 + b.hab * 0.4 : a ? a.hab : 35;
    } else {
      const t = talentos(eq[dep]);
      h = t ? t.hab : 35;
    }
    return Math.min(100, h + (bonos[dep] || 0));
  }
  // Calcula la calidad base sin azar (para mostrar estimaciones) y con azar al terminar la producción
  function calidadBase(obra, talentos, bonos) {
    const fam = D.familia(familiaPrincipal(obra));
    let q = 0;
    Object.keys(fam.pesos).forEach(function (dep) { q += fam.pesos[dep] * habilidadDep(obra, dep, talentos, bonos || {}); });
    // (las claves _crit y _pub de los bonos no son departamentos: se aplican en calificar)
    const tipica = produccionTipica(obra.anioPlan || N.anio(), fam.id) * escalaTono(obra);
    q += N.limitar(6 * Math.log2(Math.max(1, obra.pp) / tipica), -18, 12);
    q += encajeObra(obra);
    // Tres géneros sin un líder de 90 o más es un desastre
    if (obra.gen.length >= 3) {
      let mejor = 0;
      Object.keys(obra.eq).forEach(function (k) {
        const ids = k === 'int' ? obra.eq.int : [obra.eq[k]];
        ids.forEach(function (id) { const t = talentos(id); if (t && t.hab > mejor) mejor = t.hab; });
      });
      if (mejor < 90) q -= 8;
    }
    // Rasgos del equipo (V15 TRA)
    let rq = 0;
    eachTalento(obra, talentos, function (t) { const r = D.rasgos[t.rasgo]; if (r) rq += r[0]; });
    q += rq / 3;
    return q;
  }
  function eachTalento(obra, talentos, fn) {
    Object.keys(obra.eq).forEach(function (k) {
      const ids = k === 'int' ? obra.eq.int : [obra.eq[k]];
      ids.forEach(function (id) { const t = talentos(id); if (t) fn(t, k); });
    });
  }
  function escalaTono(obra) { const to = D.tonos.filter(function (x) { return x.id === obra.tono; })[0]; return to && to.costo ? to.costo : 1; }
  function famaEstrellas(obra, talentos) {
    const a = talentos(obra.eq.int[0]), b = talentos(obra.eq.int[1]);
    return (a ? a.fama * 0.6 : 0) + (b ? b.fama * 0.4 : 0);
  }
  // Notas finales al terminar la posproducción (con el azar acotado de ±4)
  function calificar(obra, talentos, bonos) {
    const fam = D.familia(familiaPrincipal(obra));
    const to = D.tonos.filter(function (x) { return x.id === obra.tono; })[0] || { crit: 0, pub: 0 };
    const q = N.limitar(calidadBase(obra, talentos, bonos) + (N.azar() * 8 - 4), 1, 99);
    const dir = talentos(obra.eq.direccion);
    let crit = q + to.crit + (fam.inclina === 'crit' ? 3 : fam.inclina === 'pub' ? -2 : 0) + (dir && dir.hab >= 85 ? 2 : 0) + (N.azar() * 6 - 3);
    let pub = q + to.pub + (fam.inclina === 'pub' ? 3 : fam.inclina === 'crit' ? -3 : 0) + famaEstrellas(obra, talentos) * 4 + (N.azar() * 6 - 3);
    const esc = obra.pp / produccionTipica(obra.anioPlan || N.anio(), fam.id);
    if ((fam.id === 'AA' || fam.id === 'IM') && esc >= 1.8) pub += esc >= 3.5 ? 3 : 2; // efectos que el público disfruta
    // Visión y público objetivo del estudio (solo el jugador los tiene)
    if (bonos) { crit += bonos._crit || 0; pub += bonos._pub || 0; }
    obra.q = Math.round(q);
    obra.crit = Math.round(N.limitar(crit, 1, 99));
    obra.pub = Math.round(N.limitar(pub, 1, 99));
  }

  // ---------- Expectativa y marketing ----------
  // Conocimiento = 1 − Π(1 − Alcance de cada canal); Expectativa = Conocimiento × Deseo
  function canalesDe(anio) { return D.canales.filter(function (c) { return c.desde <= anio && c.hasta >= anio; }); }
  function alcanceMedio(anio) {
    const cs = canalesDe(anio);
    let p = 0, a = 0;
    cs.forEach(function (c) { p += c.peso; a += c.peso * c.alcance; });
    return p > 0 ? a / p : 0.8;
  }
  function conocimiento(obra, anio, famaEstudio, famaEst, bonoMarketing) {
    const base = N.limitar(0.06 + 0.25 * famaEstudio + 0.2 * famaEst, 0.03, 0.6);
    const gasto = (obra.cm || 0) * (1 + (bonoMarketing || 0));
    const rel = gasto / Math.max(1, marketingTipico(anio));
    const resto = (1 - base) * Math.exp(-alcanceMedio(anio) * rel * 0.9);
    return N.limitar(1 - resto, 0.02, 0.995);
  }
  function deseo(obra, famaEst, tendencia) {
    const promesa = [0, 1, 2, 4, 6][obra.nivM || 0];
    return N.limitar(0.5 * obra.pub + 0.5 * 55 + promesa + famaEst * 8 + tendencia * 4, 1, 99);
  }

  // ---------- Atractivo por región (clasificación, edades, sede) ----------
  function accesoClasificacion(obra, reg, anio) {
    const d = datosAnio(anio).regiones[reg];
    const fam = D.familia(familiaPrincipal(obra));
    const cl = D.clasificacion(obra.clas) || D.clasificacion('PG-13');
    let s = 0;
    for (let g = 0; g < 5; g++) s += d.edades[g] * PROPENSION[g] * fam.edades[g] * cl.acceso[g] * cl.gusto[g];
    return Math.max(0.02, s / d.baseEdad);
  }

  // ---------- Inicio del estreno ----------
  function iniciarCartelera(obra, ctx) {
    const anio = N.anio();
    const tend = N.S.mundo.tendencias[familiaPrincipal(obra)] || 0;
    const fe = famaEstrellas(obra, ctx.talento);
    obra.con = N.redondear(conocimiento(obra, anio, ctx.famaDe(obra.est), fe, ctx.bonoMarketingDe(obra.est)), 3);
    // El tráiler no siempre dice la verdad: la expectativa tiene su propio azar
    obra.des = Math.round(N.limitar(deseo(obra, fe, tend) + N.normal(0, 4), 1, 99));
    obra.exp = N.redondear(obra.con * obra.des / 100, 3);
    // El ánimo del público: algo que nadie controla hace que una obra prenda o no
    obra.animo = N.redondear(N.normal(0, P.ANIMO), 3);
    obra.u = N.redondear(P.AQ * (obra.des - 60) + Math.log(obra.con) + P.ESTRELLAS * fe + obra.animo, 4);
    obra.sc = 0; obra.bruto = obra.bruto || 0; obra.parte = obra.parte || 0; obra.ent = 0; obra.max = 0; obra.hs = [];
    obra.acc = {};
    D.regiones.forEach(function (r) { obra.acc[r.id] = N.redondear(accesoClasificacion(obra, r.id, anio), 4); });
    obra.delta = P.DELTA + (obra.fam === 'AA' ? 0.06 : obra.fam === 'DR' || obra.fam === 'AV' ? -0.06 : obra.fam === 'FJ' ? -0.04 : 0);
  }

  // ---------- Semana de cartelera ----------
  // Reparte el público de cada región entre las obras en cartelera, las otras productoras y quedarse en casa.
  function semanaCartelera(obras, ctx) {
    const S = N.S, anio = N.anio(), sem = N.semana();
    const da = datosAnio(anio);
    const tendencias = S.mundo.tendencias;
    // Otras productoras: las películas del mundo que no simulamos una por una
    const estrenosSim = Math.max(0, S.mercado.estrenos52 || 0);
    const otras = Math.max(da.peliculas * 0.3, da.peliculas - estrenosSim);
    const uTipica = P.U_TIPICA;
    const vidaTipica = 1 / (1 - Math.exp(-P.DELTA));
    const pesoOtras = otras * Math.exp(uTipica) * vidaTipica / 52;
    const pesoTipicoTotal = da.peliculas * Math.exp(uTipica) * vidaTipica / 52;
    const pesoCasa = pesoTipicoTotal * (1 / P.PARTICIPACION - 1) * (1 + 0.3 * M.ocioEnCasa(anio));
    const res = { bruto: 0, brutoOtras: 0, porEstudio: {}, entradas: 0 };
    D.regiones.forEach(function (r) {
      const dr = da.regiones[r.id];
      if (dr.publico <= 0) return;
      const mercado = dr.publico / 52 * M.temporada(r.id, sem);
      const pesos = [];
      let suma = pesoOtras + pesoCasa;
      for (let i = 0; i < obras.length; i++) {
        const o = obras[i];
        let u = o.u + Math.log(o.acc[r.id] || 0.02) + P.TENDENCIA * (tendencias[o.fam] || 0) + Math.log(M.bonoGenero(o.fam, sem));
        if (ctx.regionEstudio(o.est) === r.id) u += P.LOCAL;
        const w = Math.exp(u);
        pesos.push(w);
        suma += w;
      }
      for (let i = 0; i < obras.length; i++) {
        const ent = mercado * pesos[i] / suma;
        const g = ent * dr.precio;
        const o = obras[i];
        o._g = (o._g || 0) + g;
        o._e = (o._e || 0) + ent;
      }
      const gOtras = mercado * pesoOtras / suma * dr.precio;
      res.brutoOtras += gOtras;
    });
    for (let i = 0; i < obras.length; i++) {
      const o = obras[i];
      const g = o._g || 0, e = o._e || 0;
      delete o._g; delete o._e;
      o.sc += 1;
      const parte = g * parteEstudio(o.sc);
      o.bruto += g; o.parte += parte; o.ent += e;
      if (g > o.max) o.max = g;
      o.hs.push(Math.round(g));
      res.bruto += g;
      res.entradas += e;
      res.porEstudio[o.est] = (res.porEstudio[o.est] || 0) + g;
      ctx.cobrar(o, parte, g);
      // Boca a boca: si la obra decepciona frente a lo prometido cae rápido; si sorprende, dura
      o.u = N.redondear(o.u - o.delta + P.BETA * (o.pub - o.des), 4);
      if (o.sc >= P.MAX_SEMANAS || (o.sc >= 2 && g < o.max * P.CORTE) || (o.sc >= 1 && g < 1)) ctx.terminar(o);
    }
    res.bruto += res.brutoOtras;
    return res;
  }

  // ---------- Pronóstico (sin gastar azar): para la interfaz y el bot ----------
  function pronosticoSemana(semanaX, famId) {
    const regs = D.regiones;
    let t = 0;
    regs.forEach(function (r) { t += M.temporada(r.id, semanaX); });
    return (t / regs.length) * M.bonoGenero(famId, semanaX);
  }

  return {
    P: P, PROPENSION: PROPENSION, datosAnio: datosAnio, presupuestoTipico: presupuestoTipico, tipicoSuavizado: tipicoSuavizado,
    presupuestoTipico2025: presupuestoTipico2025, produccionTipica: produccionTipica, marketingTipico: marketingTipico,
    parteEstudio: parteEstudio, tarifa: tarifa, demanda: demandaTalento, familiaPrincipal: familiaPrincipal, familiasDe: familiasDe,
    encajeObra: encajeObra, calidadBase: calidadBase, calificar: calificar, famaEstrellas: famaEstrellas,
    canalesDe: canalesDe, conocimiento: conocimiento, deseo: deseo, accesoClasificacion: accesoClasificacion,
    iniciarCartelera: iniciarCartelera, semanaCartelera: semanaCartelera, pronosticoSemana: pronosticoSemana,
  };
})();

/* ==== módulo: talentos ==== */
// Talentos inventados con edad, habilidad, potencial, fama y rasgo. La tarifa sale del mercado (economia.tarifa).
// Quienes no trabajan se actualizan una vez al año ("talentos dormidos"): 300 años de partida no vuelven lento
// el juego. La V18 amplía a más de 1.000 talentos con biografía, química y academia.
IA.talentos = (function () {
  'use strict';
  const N = IA.n, D = IA.datos;
  const PESO_REGION = { nam: 0.28, eur: 0.25, asi: 0.2, lat: 0.14, afr: 0.08, oce: 0.05 };
  let indice = null; // id -> talento (se reconstruye al cargar)

  function reindexar() {
    indice = {};
    N.S.talentos.forEach(function (t) { indice[t.id] = t; });
  }
  function porId(id) {
    if (id === undefined || id === null) return null;
    if (!indice) reindexar();
    return indice[id] || null;
  }
  function elegirRegion() {
    const ids = Object.keys(PESO_REGION);
    return ids[N.ponderado(ids.map(function (k) { return PESO_REGION[k]; }))];
  }
  function elegirPais(reg) {
    const ps = D.paises.filter(function (p) { return p.region === reg; });
    return ps[N.ponderado(ps.map(function (p) { return p.peso; }))].id;
  }
  function nombreNuevo(reg, sx) {
    const L = D.nombres[reg];
    return N.elegir(sx === 'F' ? L.f : L.m) + ' ' + N.elegir(L.a);
  }
  function edadPico(of) { return of === 'interprete' ? 35 : 40; }

/* ==== módulo: produccion ==== */
// Etapas de la obra: desarrollo, preproducción, rodaje y posproducción, con su costo semana a semana.
// El liderazgo del productor y los rasgos del equipo controlan el sobrecosto. Departamentos con nota,
// locaciones, sets, dilemas y prueba de público llegan en la V19.
IA.produccion = (function () {
  'use strict';
  const N = IA.n, T = IA.talentos, O = IA.obras, E = IA.economia;
  const SIGUIENTE = { desarrollo: 'preproduccion', preproduccion: 'rodaje', rodaje: 'posproduccion', posproduccion: 'lista' };

  // Arranca una obra: paga los contratos, reserva al equipo y fija duraciones y sobrecosto
  function iniciar(b, ctx) {
    const o = O.crear(b);
    o.dur = O.duraciones(o, ctx.rapidez);
    o.sr = o.dur.desarrollo;
    o.semProd = o.dur.preproduccion + o.dur.rodaje + o.dur.posproduccion;
    // Sobrecosto: el productor con buena habilidad lo controla; ciertos rasgos lo empeoran
    const prod = T.porId(o.eq.produccion);
    let riesgo = 0.04 - (prod ? (prod.hab - 50) / 900 : 0);
    O.idsEquipo(o).forEach(function (id) { const t = T.porId(id); const r = t && IA.datos.rasgos[t.rasgo]; if (r) riesgo += r[1] / 3; });
    o.sobre = N.redondear(N.limitar(1 + N.normal(riesgo, 0.05), 0.92, 1.3), 3);
    o.pp = Math.round(o.pp * (1 - (ctx.ahorro || 0)));
    const total = o.dur.desarrollo + o.semProd;
    T.ocupar(O.idsEquipo(o), N.S.t + total);

    N.emit('obraIniciada', o);
    return o;

  // Una semana de producción para todas las obras en marcha

    const lista = O.activas().slice();
    for (let i = 0; i < lista.length; i++) {
      const o = lista[i];

      if (o.et !== 'desarrollo') {
        const costo = o.pp * o.sobre / o.semProd;
        o.gp = (o.gp || 0) + costo;
        ctx.pagar(o.est, 'produccion', costo);
      }
      o.sr--;
      if (o.sr > 0) continue;
      o.et = SIGUIENTE[o.et];
      if (o.et === 'lista') {
        o.gp = Math.round(o.gp);
        E.calificar(o, T.porId, ctx.bonos(o.est, o.fam));
        o.tLista = N.S.t;
        T.liberar(O.idsEquipo(o));
        N.emit('obraLista', o);
      } else {
        o.sr = o.dur[o.et];
      }
    }
  }
  // Progreso total de 0 a 1 (para barras y el edificio)
  function progreso(o) {
    if (!o.dur) return 0;
    const orden = ['desarrollo', 'preproduccion', 'rodaje', 'posproduccion'];
    const k = orden.indexOf(o.et);
    if (k < 0) return 1;
    let hecho = 0, total = 0;
    orden.forEach(function (e, i) {
      total += o.dur[e];
      if (i < k) hecho += o.dur[e];
    });
    hecho += o.dur[o.et] - o.sr;
    return N.limitar(hecho / total, 0, 1);
  }
  function semanasRestantes(o) {
    if (!o.dur) return 0;
    const orden = ['desarrollo', 'preproduccion', 'rodaje', 'posproduccion'];
    const k = orden.indexOf(o.et);
    if (k < 0) return 0;
    let s = o.sr;
    for (let i = k + 1; i < orden.length; i++) s += o.dur[orden[i]];
    return s;
  }

  return { iniciar: iniciar, semana: semana, progreso: progreso, semanasRestantes: semanasRestantes };
})();

/* ==== módulo: lanzamiento ==== */
// Fecha de estreno, marketing, la cartelera de cada semana y el cierre de cada obra con su informe.
// Ventanas (video, TV, streaming), regiones, cadenas de cines y certificaciones llegan en la V20.
IA.lanzamiento = (function () {
  'use strict';
  const N = IA.n, D = IA.datos, E = IA.economia, T = IA.talentos, O = IA.obras;

  // Programa el estreno: la campaña se paga ahora y el estreno ocurre en la semana elegida
  function programar(o, tEstreno, nivM, ctx) {
    o.fe = Math.max(N.S.t, tEstreno);
    o.nivM = nivM;
    o.cm = Math.round(E.marketingTipico(N.anio(o.fe)) * D.nivelesMarketing[nivM].mult);
    if (o.cm > 0) ctx.pagar(o.est, 'marketing', o.cm);
    o.prog = 1;
  }
  // Estrenos de esta semana a la competencia
  function estrenosDeLaSemana(t) {
    return O.activas().filter(function (o) { return o.et === 'lista' && o.prog && o.fe === t; });
  }
  // Carga competitiva prevista para una semana (cuántos estrenos fuertes hay ya anunciados)
  function competenciaPrevista(t, excluirId) {
    let c = 0;
    O.activas().forEach(function (o) {
      if (o.id === excluirId) return;
      if (o.et === 'lista' && o.prog && Math.abs(o.fe - t) <= 1) c += o.fe === t ? 1 : 0.5;
      else if (o.et === 'cartelera' && o.sc <= 2) c += 0.4;
    });
    return c;
  }
  // Mejor semana entre las próximas (temporada y bono del género frente a la competencia anunciada)
  function mejorSemana(o, desde, hasta) {
    let mejor = desde, valor = -1;
    for (let t = desde; t <= hasta; t++) {
      const v = E.pronosticoSemana(N.semana(t), o.fam) / (1 + 0.25 * competenciaPrevista(t, o.id));
      if (v > valor + 1e-9) { valor = v; mejor = t; }
    }
    return mejor;
  }
  function semana(ctx) {
    const lista = estrenosDeLaSemana(N.S.t);
    lista.forEach(function (o) {
      o.et = 'cartelera';
      o.anio = N.anio();
      E.iniciarCartelera(o, ctx);
      N.S.mercado.fe52.push(N.S.t);
      N.emit('estreno', o);
    });
    N.S.mercado.fe52 = N.S.mercado.fe52.filter(function (t) { return t > N.S.t - 52; });
    const cartelera = O.enCartelera();
    const res = E.semanaCartelera(cartelera, ctx);
    const m = N.S.mercado;
    m.semana = { t: N.S.t, bruto: res.bruto, otras: res.brutoOtras, porEstudio: res.porEstudio };
    m.anio.total += res.bruto;
    m.anio.otras += res.brutoOtras;
    Object.keys(res.porEstudio).forEach(function (k) { m.anio.porEstudio[k] = (m.anio.porEstudio[k] || 0) + res.porEstudio[k]; });
    return res;
  }
  // Cierre de una obra: queda su resumen y el informe "por qué funcionó o fracasó" (básico; completo en la V21)
  function terminar(o, ctx) {
    o.et = 'terminada';
    O.tocar();
    o.bruto = Math.round(o.bruto);
    o.parte = Math.round(o.parte);
    o.ent = Math.round(o.ent);
    const mult = O.multiplicador(o);
    T.trasEstreno(o, mult);
    ctx.famaTrasEstreno(o, mult);
    if (o.est === 0) o.inf = informe(o, mult);
    N.emit('obraTerminada', o);
  }
  function informe(o, mult) {
    const r = [];
    const tipico = E.presupuestoTipico(o.anio);
    r.push(mult >= 2.5 ? 'Éxito: recuperó ' + N.redondear(mult, 1) + ' veces su costo.' : mult >= 1.4 ? 'Resultado correcto para su costo.' : 'Fracaso: no recuperó lo invertido.');
    if (o.pub - o.des >= 6) r.push('El boca a boca la sostuvo: el público la disfrutó más de lo prometido.');
    else if (o.des - o.pub >= 6) r.push('Prometió más de lo que cumplió y el boca a boca la hundió.');
    if (o.con < 0.35) r.push('Poca gente se enteró: faltó marketing o fama.');
    else if (o.con > 0.85) r.push('Casi todo el mundo se enteró del estreno.');
    const temp = E.pronosticoSemana(N.semana(o.fe), o.fam);
    if (temp >= 1.2) r.push('La fecha ayudó: estrenó en temporada alta para su género.');
    else if (temp <= 0.9) r.push('La fecha no ayudó: estrenó en temporada baja.');
    if (o.crit >= 80) r.push('La crítica la aplaudió (' + o.crit + ').');
    else if (o.crit <= 40) r.push('La crítica la destrozó (' + o.crit + ').');
    if (O.costoTotal(o) > tipico * 2.5) r.push('Fue muy cara para su época: cuesta más recuperarla.');
    const acc = o.acc ? o.acc.nam : 1;
    if (acc < 0.6) r.push('Su clasificación (' + o.clas + ') dejó fuera a parte del público.');
    return r;
  }

  return {
    programar: programar, competenciaPrevista: competenciaPrevista, mejorSemana: mejorSemana,
    semana: semana, terminar: terminar,
  };
})();

/* ==== módulo: rivales ==== */
// Estudios rivales simples que hacen obras de verdad: contratan talentos del mismo mundo, eligen fechas mirando
// la temporada y la competencia, estrenan en la misma cartelera y ganan o pierden dinero como tú.
// Estrategias, compras, fusiones, quiebras y estudios emergentes llegan en la V26.
IA.rivales = (function () {
  'use strict';
  const N = IA.n, D = IA.datos, E = IA.economia, O = IA.obras, P = IA.produccion, L = IA.lanzamiento;

  function logoDe(n) {
    if (IA.arte && IA.arte.logoAleatorio) return IA.arte.logoAleatorio(n);
    return { s: n % 25, c: (n * 7) % 20, b: (n * 3) % 20, t: (n * 11) % 20, f: n % 20 };
  }
  function crearEstudios() {
    const S = N.S, anio = N.anio();
    const tipico = E.presupuestoTipico(anio);
    D.rivales.forEach(function (r, i) {
      const pais = D.pais(r.pais);
      S.estudios.push({
        id: i + 1, nombre: r.nombre, logo: logoDe(r.logo), pais: r.pais, reg: pais.region, jugador: false,
        caja: Math.round(tipico * r.tam * 6), fama: N.redondear(0.15 + r.tam * 0.12, 3), tam: r.tam,
        calidad: r.calidad, riesgo: r.riesgo, familia: r.familia, util: 0, ingAnio: 0, gasAnio: 0, rescates: 0,
      });
    });
  }
  // Cuántas obras quiere tener en marcha cada rival
  function objetivo(est) {
    const da = E.datosAnio(N.anio());
    return Math.max(1, Math.round(est.tam * 3.2 * Math.sqrt(da.peliculas / 320)));
  }
  function elegirGeneros(est) {
    const S = N.S;
    let famId;
    if (N.probabilidad(0.55)) famId = est.familia;
    else {
      // Persigue la tendencia del momento (con algo de azar)
      const fams = D.ORDEN_FAM.slice();
      famId = fams[N.ponderado(fams.map(function (f) { return Math.exp(2 * (S.mundo.tendencias[f] || 0)); }))];
    }
    const fam = D.familia(famId);
    const gen = [N.elegir(fam.generos)];
    if (N.probabilidad(0.45)) {
      const otra = D.familias[N.entero(0, D.familias.length - 1)];
      const g2 = N.elegir(otra.generos);
      if (gen.indexOf(g2) < 0 && !O.validarGeneros(gen.concat([g2]))) gen.push(g2);
    }
    if (O.validarGeneros(gen)) return [fam.generos[0] === 'Erótico' ? 'Romance' : fam.generos[0]];
    return gen;
  }
  // Proyectos de prestigio: obras pensadas para premios, con lo mejor del talento disponible
  const PRESTIGIO = { DR: 0.35, AV: 0.4, SM: 0.2, RD: 0.15, IM: 0.12, AA: 0.1, HM: 0.1, FJ: 0.1 };
  function nuevaObra(est, ctx) {
    const prestigio = N.probabilidad(PRESTIGIO[est.familia] || 0.1) && est.caja > E.presupuestoTipico(N.anio()) * 3;
    const gen = prestigio ? [N.elegir(D.familia(N.probabilidad(0.6) ? 'DR' : est.familia).generos.filter(function (g) { return g !== 'Erótico'; }))] : elegirGeneros(est);
    const escala = prestigio ? N.entero(2, 3) : N.limitar(Math.round(N.normal(2 + (est.tam - 1) * 0.3, 0.45 + est.riesgo * 0.35)), 0, 3);
    const tono = prestigio ? N.elegir(['Reflexivo', 'Realista', 'Poético', 'Oscuro', 'Épico']) : N.elegir(D.tonos).id;
    const b = O.borrador(est.id, { gen: gen, escala: escala, tono: tono });
    b.prest = prestigio ? 1 : 0;
    // La calidad de su equipo depende de su estilo más que de su tamaño (evita la espiral del más chico)
    O.equipoRecomendado(b, prestigio ? 2.6 : N.limitar(0.95 + (est.tam - 1) * 0.15 + est.calidad / 25, 0.75, 1.4), prestigio ? 2 : 4);
    if (!O.equipoCompleto(b)) return null;
    const costo = O.costoTalento(b) + b.pp;
    if (est.caja < costo * 0.6) return null;
    return P.iniciar(b, ctx);
  }
  // Cada mes: decide qué producir
  function mensual(ctx) {
    const S = N.S;
    for (let i = 1; i < S.estudios.length; i++) {
      const est = S.estudios[i];
      const enMarcha = O.enProduccion(est.id).length;
      const meta = objetivo(est);
      let nuevas = Math.min(2, meta - enMarcha);
      while (nuevas-- > 0) nuevaObra(est, ctx);
    }
  }
  // Cuando una obra rival queda lista, elige su fecha de estreno y su campaña
  function alQuedarLista(o, ctx) {
    const est = N.S.estudios[o.est];
    const t = L.mejorSemana(o, N.S.t + 2, N.S.t + 2 + N.entero(6, 16));
    const nivM = N.limitar(Math.round(N.normal(2 + (o.esc - 2) * 0.4, 0.45)), 1, 3);
    L.programar(o, t, nivM, ctx);
  }
  // Cada año: crecen si ganan, se achican si pierden; si quedan en rojo reciben un rescate (las quiebras, en la V26)
  function anual() {
    const S = N.S, anio = N.anio();
    const tipico = E.presupuestoTipico(anio);
    for (let i = 1; i < S.estudios.length; i++) {
      const est = S.estudios[i];
      const base = D.rivales[i - 1].tam;
      if (est.caja < tipico * 0.5) {
        est.tam = N.redondear(Math.max(base * 0.4, est.tam * 0.85), 3);
        const aporte = Math.round(tipico * 2 * est.tam);
        est.caja += aporte;
        est.rescates++;
        N.emit('noticia', { tipo: 'rival', texto: est.nombre + ' recibe dinero de inversionistas para seguir filmando.' });
      } else if (est.caja > tipico * est.tam * 10) {
        est.tam = N.redondear(Math.min(base * 1.4, est.tam * 1.05), 3);
      } else if (est.util < 0) {
        est.tam = N.redondear(Math.max(base * 0.5, est.tam * 0.96), 3);
      }
      est.tam = N.redondear(est.tam + (base - est.tam) * 0.05, 3);
    }
  }

  return { crearEstudios: crearEstudios, mensual: mensual, alQuedarLista: alQuedarLista, anual: anual, objetivo: objetivo };
})();

/* ==== módulo: premios ==== */
// Premios Quimera básicos: cada año (semana 10) miran las películas estrenadas el año anterior por todos los
// estudios, con nominados reales (nunca de relleno, fallo 17 de la V15). La V22 trae jurados, festivales,
// categorías por cargo, subastas y ceremonias animadas.
IA.premios = (function () {
  'use strict';
  const N = IA.n, D = IA.datos, T = IA.talentos;

  function candidatas(anio) {
    return N.S.obras.filter(function (o) { return o.anio === anio && (o.et === 'terminada' || o.et === 'cartelera') && o.crit; });
  }
  let gustoJurado = null;
  function puntaje(cat, o) {
    const jur = N.normal(0, 5) + (gustoJurado === o.fam ? 5 : 0);
    if (cat === 'pelicula') return o.crit * 0.75 + o.pub * 0.25 + jur;
    if (cat === 'direccion') return o.crit * 0.8 + (o._dir || 50) * 0.2 + jur;
    if (cat === 'guion') return o.crit * 0.8 + (o._gui || 50) * 0.2 + jur;
    return o.crit * 0.5 + (o._int || 50) * 0.5 + jur;
  }
  function ceremonia() {
    const S = N.S, anio = N.anio() - 1;
    const lista = candidatas(anio);
    if (lista.length < 3) return null;
    lista.forEach(function (o) {
      const d = o.eq && T.porId(o.eq.direccion), g = o.eq && T.porId(o.eq.guion);
      o._dir = d ? d.hab : 50; o._gui = g ? g.hab : 50;
    });
    // Cada año el jurado tiene su gusto: una familia de géneros le pesa más
    gustoJurado = N.elegir(D.ORDEN_FAM);
    const res = { anio: anio, categorias: [], gusto: gustoJurado };
    D.premios.categorias.forEach(function (c) {
      let pool = lista;
      let quien = null;
      if (c.id === 'actriz' || c.id === 'actor') {
        const sx = c.id === 'actriz' ? 'F' : 'M';
        pool = [];
        lista.forEach(function (o) {
          const sxs = (o.cr && o.cr.sx) || [];
          for (let k = 0; k < sxs.length; k++) if (sxs[k] === sx) {
            const id = o.eq ? o.eq.int[k] : null;
            const t = id ? T.porId(id) : null;
            pool.push({ o: o, k: k, nombre: o.cr.reparto[k], t: t });
            break;
          }
        });
        pool.forEach(function (p) { p.o._int = p.t ? p.t.hab : 50; p.s = puntaje(c.id, p.o); });
      } else {
        pool = lista.map(function (o) { return { o: o, s: puntaje(c.id, o) }; });
      }
      pool.sort(function (a, b) { return b.s - a.s; });
      const nominados = pool.slice(0, 5);
      if (!nominados.length) return;
      const g = nominados[0];
      quien = g.nombre || (c.id === 'direccion' ? g.o.cr.direccion : c.id === 'guion' ? g.o.cr.guion : '');
      g.o.aw = g.o.aw || [];
      g.o.aw.push(c.id);
      nominados.forEach(function (n) { n.o.nom = (n.o.nom || 0) + 1; });
      const est = S.estudios[g.o.est];
      est.fama = N.redondear(N.limitar(est.fama + (c.id === 'pelicula' ? 0.05 : 0.02), 0, 1), 3);
      // El talento premiado gana fama
      let idT = null;
      if (g.o.eq) idT = c.id === 'direccion' ? g.o.eq.direccion : c.id === 'guion' ? g.o.eq.guion : g.k !== undefined ? g.o.eq.int[g.k] : null;
      const t = idT !== null ? T.porId(idT) : null;
      if (t) { t.fama = N.redondear(N.limitar(t.fama + 0.12, 0, 1), 3); t.premios++; }
      res.categorias.push({
        id: c.id, nombre: c.nombre, ganador: { obra: g.o.id, titulo: g.o.tit, est: g.o.est, quien: quien },
        nominados: nominados.map(function (n) { return { obra: n.o.id, titulo: n.o.tit, est: n.o.est, quien: n.nombre || '' }; }),
      });
    });
    lista.forEach(function (o) { delete o._dir; delete o._gui; delete o._int; });
    S.premios.push(res);
    if (S.premios.length > 400) S.premios.shift();
    N.emit('premios', res);
    return res;
  }
  function semana() {
    if (N.semana() === D.premios.semana) return ceremonia();
    return null;
  }
  // Parte de los premios principales que ganó el jugador (meta: 30 % o menos)
  function parteJugador(desdeAnio) {
    let total = 0, jug = 0;
    N.S.premios.forEach(function (r) {
      if (desdeAnio && r.anio < desdeAnio) return;
      r.categorias.forEach(function (c) { total++; if (c.ganador.est === 0) jug++; });
    });
    return { total: total, jugador: jug, parte: total ? jug / total : 0 };
  }

  return { ceremonia: ceremonia, semana: semana, parteJugador: parteJugador };
})();

/* ==== módulo: negocio ==== */
// Finanzas mes a mes por categoría, gastos fijos que crecen con el tamaño, impuesto del 25 % sobre utilidades
// (no sobre la caja, fallo 18 de la V15), antimonopolio sobre el 35 %, construcciones básicas del estudio,
// cuota de mercado y quiebra. Préstamos, sedes, filiales, inversiones y rescate llegan en la V28.
IA.negocio = (function () {
  'use strict';
  const N = IA.n, D = IA.datos, E = IA.economia, M = IA.mundo, T = IA.talentos;
  const INGRESOS = ['taquilla'];
  const GASTOS = ['talento', 'produccion', 'marketing', 'personal', 'mantenimiento', 'construccion', 'impuestos', 'multas'];
  const NOMBRES = {
    taquilla: 'Taquilla (parte del estudio)', talento: 'Contratos de talento', produccion: 'Producción', marketing: 'Marketing',
    personal: 'Personal', mantenimiento: 'Mantenimiento', construccion: 'Construcciones', impuestos: 'Impuestos', multas: 'Multas',
  };
  function libroVacio() { return { ing: {}, gas: {} }; }

  // ---------- Movimientos de dinero ----------
  function cobrarEn(est, cat, monto) { mover(est, cat, Math.abs(monto)); }
  function pagar(est, cat, monto) { mover(est, cat, -Math.abs(monto)); }
  function mover(estId, cat, monto) {
    if (!monto || !isFinite(monto)) return;
    const S = N.S, est = S.estudios[estId];
    est.caja += monto;
    if (monto > 0) est.ingAnio += monto; else est.gasAnio -= monto;
    if (estId !== 0) return;
    const lado = monto > 0 ? 'ing' : 'gas';
    const v = Math.abs(monto);
    S.fin.mes[lado][cat] = (S.fin.mes[lado][cat] || 0) + v;
    S.fin.anio[lado][cat] = (S.fin.anio[lado][cat] || 0) + v;
  }
  function total(libro, lado) { let s = 0; Object.keys(libro[lado]).forEach(function (k) { s += libro[lado][k]; }); return s; }

  // ---------- Estudio del jugador: construcciones ----------
  function infoPiso(id) { return D.pisos.filter(function (p) { return p.id === id; })[0]; }
  function infoTerreno(id) { return D.terrenos.filter(function (p) { return p.id === id; })[0]; }
  function capacidad(estId) {
    const S = N.S;
    if (estId !== 0) return 99;
    let c = 0;
    S.estudios[0].pisos.forEach(function (p) { c += infoPiso(p).capacidad || 0; });
    S.estudios[0].terrenos.forEach(function (p) { c += infoTerreno(p).capacidad || 0; });
    return c;
  }
  function bonos(estId, famId) {
    const b = {};
    if (estId !== 0) {
      // Los rivales ya tienen sus instalaciones: un bono parejo según su tamaño
      const v = Math.min(4, Math.round(2 * N.S.estudios[estId].tam));
      ['guion', 'direccion', 'produccion', 'fotografia', 'musica', 'edicion', 'arte', 'interprete'].forEach(function (k) { b[k] = v; });
      return b;
    }
    const est = N.S.estudios[0];
    const sumar = function (bono) { Object.keys(bono).forEach(function (k) { b[k] = (b[k] || 0) + bono[k]; }); };
    est.pisos.forEach(function (id) { const p = infoPiso(id); if (p.bono) sumar(p.bono); });
    // Tus tres especialidades: +1 en esos departamentos de tus obras
    ((N.S.avatar && N.S.avatar.esp) || []).forEach(function (of) { b[of] = (b[of] || 0) + 1; });
    // Visión y público objetivo: _crit y _pub ajustan las notas finales
    const vis = D.visiones.filter(function (v) { return v.id === est.vision; })[0];
    if (vis) { if (vis.bono) sumar(vis.bono); b._crit = (b._crit || 0) + (vis.crit || 0); b._pub = (b._pub || 0) + (vis.pub || 0); }
    const pub = D.publicos.filter(function (v) { return v.id === est.publico; })[0];
    if (pub && pub.familias.indexOf(famId) >= 0) { b._crit = (b._crit || 0) + (pub.crit || 0); b._pub = (b._pub || 0) + (pub.pub || 0); }
    est.terrenos.forEach(function (id) {
      const p = infoTerreno(id);
