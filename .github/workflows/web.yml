# Publica gratis la versión web (GitHub Pages) con el HTML más nuevo del juego.
name: Versión web
on:
  push:
    branches: [main]
    paths: ['INDUSTRY_ART_v*.html', 'docs/privacidad.html']
  workflow_dispatch:
permissions: { contents: read, pages: write, id-token: write }
jobs:
  web:
    runs-on: ubuntu-latest
    environment: { name: github-pages }
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p sitio && cp "$(ls INDUSTRY_ART_v*.html | sort -t v -k2 -n | tail -1)" sitio/index.html && cp docs/privacidad.html sitio/privacidad.html
      - uses: actions/upload-pages-artifact@v3
        with: { path: sitio }
      - uses: actions/deploy-pages@v4
