# Publica la versión web (GitHub Pages) con el HTML más nuevo del juego y la política de privacidad.
# Ojo: GitHub Pages no funciona en repositorios privados con la cuenta gratuita (ver docs/publicar_google_play.md).
name: Versión web
on:
  workflow_dispatch:
permissions: { contents: read, pages: write, id-token: write }
jobs:
  web:
    runs-on: ubuntu-latest
    environment: { name: github-pages }
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p sitio && cp INDUSTRY_ART.html sitio/index.html && cp docs/privacidad.html sitio/privacidad.html
      - uses: actions/upload-pages-artifact@v3
        with: { path: sitio }
      - uses: actions/deploy-pages@v4
