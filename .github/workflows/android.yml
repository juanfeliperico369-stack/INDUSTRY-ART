# Arma el .aab firmado de INDUSTRY ART para Google Play cada vez que subes una versión nueva del juego.
# Secretos que tú pones en GitHub (Settings › Secrets and variables › Actions):
#   KEYSTORE_BASE64  la llave de firma (.jks) en base64      KEYSTORE_PASSWORD  su contraseña
#   KEY_ALIAS        el alias de la llave                    KEY_PASSWORD       la contraseña de la llave
#   ADMOB_APP_ID y ADMOB_INTERSTITIAL_ID (opcionales): tus identificadores reales de AdMob para Android
name: App de Android
on:
  push:
    branches: [main, claude/industry-art-v16-analysis-dbf0iv]
    paths: ['INDUSTRY_ART_Definitiva.html', 'INDUSTRY_ART_v*.html', 'app/config.json', 'app/package.json', 'app/android/**', 'tools/preparar_app.py', '.github/workflows/android.yml']
  workflow_dispatch:
    inputs:
      modo:
        description: 'gratis (un anuncio al abrir) o pago (sin anuncios)'
        default: 'gratis'
jobs:
  aab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - uses: actions/setup-java@v4
        with: { distribution: 'temurin', java-version: '21' }
      - uses: android-actions/setup-android@v3
        with: { packages: 'platform-tools platforms;android-36 build-tools;36.0.0' }
      - name: Configuración de la app (modo y AdMob)
        env:
          MODO: ${{ github.event.inputs.modo || 'gratis' }}
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
          ADMOB_INTERSTITIAL_ID: ${{ secrets.ADMOB_INTERSTITIAL_ID }}
        run: |
          python3 - <<'PY'
          import json, os
          c = json.load(open('app/config.json'))
          c['modo'] = os.environ.get('MODO') or 'gratis'
          if os.environ.get('ADMOB_APP_ID') and os.environ.get('ADMOB_INTERSTITIAL_ID'):
              c['admob']['android'] = {'app': os.environ['ADMOB_APP_ID'], 'intersticial': os.environ['ADMOB_INTERSTITIAL_ID']}
              c['admob']['prueba'] = False
          json.dump(c, open('app/config.json', 'w'), indent=2)
          PY
      - name: Preparar la app
        working-directory: app
        run: |
          npm ci || npm install
          python3 ../tools/preparar_app.py
          npx cap sync android
      - name: Llave de firma
        env: { KEYSTORE_BASE64: '${{ secrets.KEYSTORE_BASE64 }}' }
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/industry-art.jks"
          else echo "::warning::Falta el secreto KEYSTORE_BASE64: el .aab sale sin firmar y Google Play no lo acepta."; fi
      - name: Armar el .aab firmado
        working-directory: app/android
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/industry-art.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
        run: |
          [ -s "$KEYSTORE_FILE" ] || unset KEYSTORE_FILE
          ./gradlew --no-daemon bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: industry-art-aab
          path: app/android/app/build/outputs/bundle/release/app-release.aab
