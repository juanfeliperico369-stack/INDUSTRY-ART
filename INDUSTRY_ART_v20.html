      c.lineWidth = 1;
      for (let i = 0; i < 7; i++) trazo(c, x0 + W / 2, cy - ch * 0.1, x0 + W * (0.22 + i * 0.093), cy - ch * 0.55);

    c.fillRect(x0 - m * 0.4, t - p, W + m * 0.8, p + 1);

      const hx = x0 + W * 0.86;
      c.fillStyle = E.muro;
      c.fillRect(hx, t - p - g.piso * 0.6, m * 1.6, g.piso * 0.6);
      c.fillStyle = E.adorno;
      c.fillRect(hx - 1, t - p - g.piso * 0.6, m * 1.6 + 2, 2);
      extra.humoTecho = [hx + m * 0.8, t - p - g.piso * 0.6];
    }
    if (ep === 1 || ep === 2) { // tanque de agua de los estudios clásicos
      const tx = x0 + W * 0.06, th = Math.min(g.piso * 0.9, ch * 1.4), tw = th * 0.7;
      c.fillStyle = '#5a4632';
      c.fillRect(tx + tw * 0.1, t - p - th * 0.45, 1.5, th * 0.45);
      c.fillRect(tx + tw * 0.85, t - p - th * 0.45, 1.5, th * 0.45);
      c.fillStyle = ep === 1 ? '#8a6a44' : '#c9d6df';
      c.fillRect(tx, t - p - th, tw, th * 0.55);
      poligono(c, [tx - 1, t - p - th, tx + tw / 2, t - p - th * 1.25, tx + tw + 1, t - p - th]);
    }
    if (ep >= 3) { // antena con luz
      const ax = x0 + W * (ep === 3 ? 0.1 : 0.92);
      c.fillStyle = '#9aa5b1';
      c.fillRect(ax, t - p - g.piso * 1.2, 1.5, g.piso * 1.2);
      extra.faros.push([ax + 0.75, t - p - g.piso * 1.2, ep === 5 ? '#7ffcff' : '#ff3b3b']);
    }
  }

  function etiquetaPiso(c, s, texto) {
    if (!texto || s.h < 12) return;
    const fs = limitar(s.h * 0.2, 6, 11);
    c.font = `600 ${fs}px sans-serif`;
    const tw = Math.min(c.measureText(texto).width, s.w * 0.45);
    c.fillStyle = 'rgba(8,10,20,.62)';
    rectRedondo(c, s.x + 2, s.y + 2, tw + fs * 0.8, fs * 1.35, fs * 0.4);
    c.fill();
    c.fillStyle = '#fff';
    c.textAlign = 'left';
    c.textBaseline = 'middle';
    c.fillText(texto, s.x + 2 + fs * 0.4, s.y + 2 + fs * 0.7, s.w * 0.45);
  }

  // Cartel del techo con el logo y el nombre (se guarda como imagen y se anima encima).
  function crearCartel(g, E, ep, nombre, L, esc) {
    const w = g.cartelW, h = g.cartel;
    const lz = crearLienzo(w * esc, h * esc);
    const c = lz.getContext('2d');
    c.setTransform(esc, 0, 0, esc, 0, 0);
    c.fillStyle = ['#3a2718', '#141a33', 'rgba(20,8,30,.85)', '#120a24', 'rgba(10,20,35,.92)', 'rgba(53,240,208,.14)'][ep];
    rectRedondo(c, 1, 1, w - 2, h - 2, ep >= 4 ? h * 0.25 : 2);
    c.fill();
    c.strokeStyle = E.adorno;
    c.lineWidth = ep === 0 ? 2 : 1.2;
    c.stroke();
    logo(c, h * 0.6, h / 2, h * 0.3, L);
    const area = w - h * 1.35;
    c.font = `${Math.round(h * 0.66)}px 'Titulos', Impact, sans-serif`;
    c.textAlign = 'center';
    c.textBaseline = 'middle';
    if (ep >= 2) { c.shadowColor = E.adorno; c.shadowBlur = h * 0.3; }
    c.fillStyle = ['#f3e2b8', '#ffd98a', '#fff1f8', '#ffffff', '#ffffff', '#c9fff4'][ep];
    c.fillText(String(nombre || '').toUpperCase(), h * 1.15 + area / 2, h * 0.54, area);
    return lz;
  }

  function crearHalo(color, r, esc) {
    const lz = crearLienzo(r * 2 * esc, r * 2 * esc);
    const c = lz.getContext('2d');
    c.setTransform(esc, 0, 0, esc, 0, 0);
    const g = c.createRadialGradient(r, r, 0, r, r, r);
    g.addColorStop(0, rgba(color, 0.9));
    g.addColorStop(0.35, rgba(color, 0.3));
    g.addColorStop(1, rgba(color, 0));
    c.fillStyle = g;
    c.fillRect(0, 0, r * 2, r * 2);
    return lz;
  }

  /* ---------- cuadro animado ---------- */

  const cacheEstudio = cacheLRU(3);
  let consultaMovimiento = null;
  function sinMovimiento() {
    if (api.menosMovimiento) return true;
    try {
      if (!consultaMovimiento && window.matchMedia) consultaMovimiento = window.matchMedia('(prefers-reduced-motion: reduce)');
      return !!(consultaMovimiento && consultaMovimiento.matches);
    } catch (e) {
      return false;
    }
  }

  function fuentesListas() {
    try { return !document.fonts || document.fonts.check("12px 'Titulos'") ? 1 : 0; } catch (e) { return 1; }
  }

  function capasEstudio(ctx, w, h, datos, pisos, terrenos, ep, est) {
    const m = ctx.getTransform ? ctx.getTransform() : null;
    const esc = limitar(m ? Math.hypot(m.a, m.b) : window.devicePixelRatio || 1, 1, 4);
    const L = datos.logo || { s: 8, c: 6, b: 14, t: 3, f: 1 };
    const clave = [w, h, esc, ep, est, datos.nombre, JSON.stringify(L), fuentesListas(),
      pisos.map((p) => p.tipo + ':' + (p.etiqueta || '')).join(','), terrenos.map((t) => t.tipo + ':' + t.lado).join(',')].join('|');
    let capa = cacheEstudio.tomar(clave);
    if (capa) return capa;
    const g = geometria(w, h, pisos.length, terrenos);
    const E = EPOCAS[ep];
    capa = { g, E, ep, est, humos: [], faros: [], neones: [], humoTecho: null };
    capa.fondo = crearLienzo(w * esc, h * esc);
    const cf = capa.fondo.getContext('2d');
    cf.setTransform(esc, 0, 0, esc, 0, 0);
    pintarFondo(cf, g, E, ep, est, capa);
    capa.frente = crearLienzo(w * esc, h * esc);
    const cr = capa.frente.getContext('2d');
    cr.setTransform(esc, 0, 0, esc, 0, 0);
    pintarFrente(cr, g, E, ep, est, { pisos }, capa);
    capa.cartel = crearCartel(g, E, ep, datos.nombre, L, esc);
    capa.radioHalo = Math.max(10, g.altoFarol * 0.5);
    capa.halo = crearHalo(E.luz, capa.radioHalo, esc);
    cacheEstudio.poner(clave, capa);
    return capa;
  }

  function estudio(ctx, w, h, tMs, datos) {
    if (!ctx || !(w > 20) || !(h > 20)) return;
    datos = datos || {};
    const pisos = (datos.pisos || []).filter(Boolean);
    const terrenos = (datos.terrenos || []).filter(Boolean);
    const rodajes = (datos.rodajes || []).filter(Boolean);
    const ep = epocaEstudio(datos.anio || 1930);
    const est = estacionDe(datos.semana || 20);
    const f = sinMovimiento() ? 12.3 : (tMs || 0) / 1000;
    ctx.save();
    try {
      const capa = capasEstudio(ctx, w, h, datos, pisos, terrenos, ep, est);
      const g = capa.g, E = capa.E;
      ctx.drawImage(capa.fondo, 0, 0, w, h);
      cieloVivo(ctx, capa, f);
      ctx.drawImage(capa.frente, 0, 0, w, h);
      // salas
      let platos = 0;
      pisos.forEach((p, i) => {
        const s = sala(g, i), tipo = SALAS[p.tipo] ? p.tipo : 'oficinas';
        const act = limitar(+p.actividad || 0, 0, 1);
        const rodaje = tipo === 'plato' ? rodajes[platos++] : null;
        ctx.save();
        ctx.beginPath();
        ctx.rect(s.x, s.y, s.w, s.h);
        ctx.clip();
        SALAS[tipo].vivo(ctx, s, ep, f + i * 0.7, act, i, rodaje);
        if (act < 1) { ctx.fillStyle = `rgba(10,8,24,${(1 - act) * 0.4})`; ctx.fillRect(s.x, s.y, s.w, s.h); }
        ctx.restore();
      });
      if (ep === 4 && pisos.length) { // reflejo del vidrio
        ctx.fillStyle = 'rgba(170,215,255,.09)';
        const y0 = g.techo, y1 = g.suelo - g.vestibulo;
        poligono(ctx, [g.x0 + g.ancho * 0.15, y0, g.x0 + g.ancho * 0.35, y0, g.x0 + g.ancho * 0.1, y1, g.x0 - 1 + g.muro, y1]);
        poligono(ctx, [g.x0 + g.ancho * 0.55, y0, g.x0 + g.ancho * 0.62, y0, g.x0 + g.ancho * 0.4, y1, g.x0 + g.ancho * 0.33, y1]);
      }
      g.lotes.forEach((L) => loteVivo(ctx, L, g, E, ep, f, rodajes.length > 0));
      marquesina(ctx, g, E, rodajes.slice(platos), f);
      cartelVivo(ctx, capa, f);
      callesVivas(ctx, capa, f);
    } catch (e) {
      ctx.fillStyle = '#10172e';
      ctx.fillRect(0, 0, w, h);
    }
    ctx.restore();
  }

  function cieloVivo(c, capa, f) {
    const g = capa.g, ep = capa.ep, w = g.w;
    for (let i = 0; i < 12; i++) { // estrellas que titilan
      const a = 0.25 + 0.5 * Math.sin(f * 1.4 + i * 2.3);
      if (a <= 0) continue;
      c.fillStyle = `rgba(255,255,255,${a})`;
      c.fillRect(((i * 97.3) % 1) * w + ((i * 53) % w), ((i * 31.7) % 1) * g.suelo * 0.4 + 4, 1.6, 1.6);
    }
    if (ep === 1 || ep === 2) { // reflectores
      if (!capa.haz || capa.hazCtx !== c) {
        capa.haz = c.createLinearGradient(0, 0, 0, -g.h);
        capa.haz.addColorStop(0, 'rgba(255,255,230,.22)');
        capa.haz.addColorStop(1, 'rgba(255,255,230,0)');
        capa.hazCtx = c;
      }
      c.fillStyle = capa.haz;
      [0.18, 0.82, 0.5].slice(0, ep === 1 ? 3 : 2).forEach((px, i) => {
        c.save();
        c.translate(w * px, g.suelo);
        c.rotate(Math.sin(f * 0.5 + i * 2) * 0.45);
        poligono(c, [-3, 0, 3, 0, g.h * 0.16, -g.h, -g.h * 0.16, -g.h]);
        c.restore();
      });
    }
    capa.humos.forEach((p, i) => humo(c, p[0], p[1], f + i, g.h * 0.12));
    capa.neones.forEach((n, i) => { // letreros de neón que parpadean
      const on = Math.sin(f * 11 + i * 5.1) > -0.85;
      c.fillStyle = 'rgba(10,5,20,.8)';
      c.fillRect(n[0], n[1], n[2], n[3]);
      c.strokeStyle = n[4];
      c.globalAlpha = on ? 1 : 0.25;
      c.lineWidth = 1.2;
      c.strokeRect(n[0] + 1, n[1] + 1, n[2] - 2, n[3] - 2);
      c.fillStyle = n[4];
      c.fillRect(n[0] + n[2] * 0.2, n[1] + n[3] * 0.45, n[2] * 0.6, 1.2);
      c.globalAlpha = 1;
    });
    if (ep === 5) { // autos voladores lejanos
      for (let i = 0; i < 3; i++) {
        const x = ((f * (25 + i * 12) + i * 170) % (w + 60)) - 30, y = g.h * (0.18 + i * 0.09);
        const x2 = i % 2 ? w - x : x;
        c.fillStyle = 'rgba(127,252,255,.25)';
        c.fillRect(x2 - (i % 2 ? -4 : 18), y, 18, 1);
        c.fillStyle = '#d9f6ff';
        elipse(c, x2, y, 4, 1.6);
        c.fill();
      }
    }
  }

  function humo(c, x, y, f, alto) {
    for (let j = 0; j < 3; j++) {
      const p = (f * 0.25 + j / 3) % 1;
      c.fillStyle = `rgba(190,180,175,${(1 - p) * 0.3})`;
      circulo(c, x + p * alto * 0.4, y - p * alto, 1.5 + p * alto * 0.25);
      c.fill();
    }
  }

  function loteVivo(c, L, g, E, ep, f, hayRodaje) {
    const s = g.suelo, x = L.x, w = L.w, alto = L.alto;
    if (L.tipo === 'foso') { // olas y barquito
      c.strokeStyle = 'rgba(200,235,255,.6)';
      c.lineWidth = 1;
      for (let k = 0; k < 2; k++) {
        const y = s - alto * (0.22 - k * 0.08);
        c.beginPath();
        for (let px = x + 4; px <= x + w - 4; px += 3) c.lineTo(px, y + Math.sin(px * 0.3 + f * 3 + k) * 1.2);
        c.stroke();
      }
      const bx = x + w * (0.5 + 0.25 * Math.sin(f * 0.4)), by = s - alto * 0.27 + Math.sin(f * 2) * 1.2, bs = alto * 0.12;
      c.fillStyle = '#5a3a26';
      poligono(c, [bx - bs, by - bs * 0.3, bx + bs, by - bs * 0.3, bx + bs * 0.7, by + bs * 0.2, bx - bs * 0.7, by + bs * 0.2]);
      c.fillStyle = '#f4efe6';
      poligono(c, [bx, by - bs * 0.3, bx, by - bs * 1.6, bx + bs * 0.8, by - bs * 0.4]);
    } else if (L.tipo === 'captura') { // actor con marcadores
      const u = alto * 0.7, px = x + w * (0.5 + 0.15 * Math.sin(f * 0.7));
      persona(c, px, s, u, '#111', '#222', false, f * 4, Math.sin(f * 3) * u * 0.15);
      c.fillStyle = '#7fffd4';
      [[0, 0.62], [0, 0.4], [0.08, 0.5], [-0.03, 0.15], [0.04, 0.1]].forEach((p) => c.fillRect(px + p[0] * u - 1, s - p[1] * u - 1, 2, 2));
      if (Math.sin(f * 6) > 0) {
        c.fillStyle = '#ff3b3b';
        c.fillRect(x + w * 0.14, s - alto * 0.7, 2, 2);
        c.fillRect(x + w * 0.84, s - alto * 0.7, 2, 2);
      }
    } else if (L.tipo === 'cine') { // luces que corren en la marquesina
      const fh = alto * 0.85, y1 = s - fh * 0.62, y2 = s - fh * 0.46, paso = 5, k = Math.floor(f * 8);
      for (let px = x + 2, i = 0; px < x + w - 1; px += paso, i++) {
        c.fillStyle = (i + k) % 3 === 0 ? '#fff6c8' : '#9a7a30';
        c.fillRect(px, y1 - 1, 2, 2);
        c.fillRect(px, y2 - 1, 2, 2);
      }
    } else if (L.tipo === 'backlot' && hayRodaje) { // foco de trabajo y alguien del equipo
      const u = Math.min(alto * 0.6, g.persona), px = x + w * (0.3 + 0.25 * (0.5 + 0.5 * Math.sin(f * 0.6)));
      persona(c, px, s, u, '#2b2b30', PIELES[3], false, f * 5, null);
      c.fillStyle = `rgba(255,240,190,${0.3 + 0.2 * Math.sin(f * 2)})`;
      circulo(c, x + w * 0.9, s - alto * 0.55, 2.5);
      c.fill();
    }
  }

  function marquesina(c, g, E, lista, f) {
    if (!lista.length) return;
    const v = g.vestibulo, bx = g.x0 + g.muro, bw = g.ancho - 2 * g.muro, by = g.suelo - v + v * 0.06 + 1, bh = v * 0.28 - 2;
    if (bh < 4) return;
    const texto = lista.map((r) => 'EN RODAJE: ' + String(r.titulo || '') + ' ' + Math.round(limitar(+r.progreso || 0, 0, 1) * 100) + '%').join('   ·   ');
    c.save();
    c.beginPath();
    c.rect(bx, by, bw, bh);
    c.clip();
    c.font = `${Math.max(5, bh * 0.95)}px 'Titulos', Impact, sans-serif`;
    c.textAlign = 'left';
    c.textBaseline = 'middle';
    c.fillStyle = '#ffd98a';
    const tw = c.measureText(texto).width;
    c.fillText(texto, bx + bw - ((f * 28) % (tw + bw)), by + bh / 2 + 0.5);
    c.restore();
  }

  function cartelVivo(c, capa, f) {
    const g = capa.g, ep = capa.ep;
    let y = g.cartelY;
    if (ep === 5) y += Math.sin(f * 1.6) * 2;
    c.globalAlpha = (ep === 2 || ep === 3) && Math.sin(f * 7.3) < -0.93 ? 0.55 : ep === 5 ? 0.85 + 0.1 * Math.sin(f * 4) : 1;
    c.drawImage(capa.cartel, g.cartelX, y, g.cartelW, g.cartel);
    c.globalAlpha = 1;
    if (ep === 1) { // bombillas que corren
      const k = Math.floor(f * 6);
      for (let px = g.cartelX + 4, i = 0; px < g.cartelX + g.cartelW - 3; px += 6, i++) {
        c.fillStyle = (i + k) % 3 ? '#8a6a20' : '#fff3c4';
        c.fillRect(px, y + 1.5, 1.8, 1.8);
        c.fillRect(px, y + g.cartel - 3.3, 1.8, 1.8);
      }
    } else if (ep === 5) { // líneas de holograma
      c.fillStyle = 'rgba(127,252,255,.12)';
      const k = (f * 12) % 4;
      for (let yy = y + k; yy < y + g.cartel; yy += 4) c.fillRect(g.cartelX, yy, g.cartelW, 1);
    }
  }

  function callesVivas(c, capa, f) {
    const g = capa.g, ep = capa.ep, E = capa.E, w = g.w;
    if (capa.humoTecho) humo(c, capa.humoTecho[0], capa.humoTecho[1], f, g.piso * 1.4);
    capa.faros.forEach((p, i) => {
      if (Math.sin(f * 3 + i * 1.7) > 0.2) {
        c.fillStyle = p[2];
        circulo(c, p[0], p[1], 1.6);
        c.fill();
      }
    });
    // faroles: halo con parpadeo de gas en la primera época
    g.faroles.forEach((x, i) => {
      const y = g.suelo + g.calle * 0.22 - g.altoFarol + (ep === 5 ? Math.sin(f * 2 + i) * 2 : 0);
      const lx = ep >= 2 && ep <= 4 ? x + g.altoFarol * 0.2 : x;
      c.globalAlpha = ep === 0 ? 0.75 + 0.2 * Math.sin(f * 9 + i * 3) * Math.sin(f * 5.3 + i) : 0.85;
      c.drawImage(capa.halo, lx - capa.radioHalo, y - capa.radioHalo + 2, capa.radioHalo * 2, capa.radioHalo * 2);
      c.globalAlpha = 1;
      c.fillStyle = ep === 5 ? E.adorno : '#fff8e0';
      circulo(c, lx, y + 2, ep === 5 ? 2.5 : 1.6);
      c.fill();
    });
    // transeúntes
    const u = g.persona;
    for (let i = 0; i < 2; i++) {
      const vel = 9 + i * 5, x = ((f * vel + i * 211) % (w + 40)) - 20, xx = i ? w - x : x;
      c.save();
      if (i) { c.translate(2 * xx, 0); c.scale(-1, 1); }
      persona(c, xx, g.suelo + g.calle * 0.24, u, i ? '#2d2a3a' : '#3a2d2a', PIELES[(i * 5 + 2) % 8], false, f * 7, null);
      if (ep <= 1) { c.fillStyle = '#111'; c.fillRect(xx - u * 0.08, g.suelo + g.calle * 0.24 - u * 0.78, u * 0.18, u * 0.06); }
      c.restore();
    }
    // vehículos de la época
    const cs = g.calle * 0.36;
    const colores = [['#3b2a20', '#5a2a1a'], ['#1f1f24', '#6b1f2a'], ['#e8a0b0', '#7fd1c7'], ['#e04a6a', '#f5f5f5'], ['#cfd6df', '#c0392b'], ['#e8f2ff', '#35f0d0']][ep];
    for (let i = 0; i < 2; i++) {
      const vel = w * (ep === 0 ? 0.05 : 0.09) * (i ? 1.3 : 1), largo = cs * 3;
      const x = ((f * vel + i * w * 0.6) % (w + largo * 2)) - largo;
      const dir = i ? -1 : 1, px = i ? w - x : x;
      const y = g.suelo + g.calle * (i ? 0.95 : 0.7) - (ep === 5 ? cs * 0.3 + Math.sin(f * 2 + i) : 0);
      vehiculo(c, px, y, cs, ep, colores[i], dir);
    }
    if (capa.est === 0) { // copos de nieve
      c.fillStyle = 'rgba(255,255,255,.8)';
      for (let i = 0; i < 36; i++) {
        const y = ((i * 37.7 + f * (14 + (i % 5) * 4)) % g.h);
        const x = ((i * 61.3) % w) + Math.sin(f + i) * 6;
        c.fillRect(x, y, 1.6, 1.6);
      }
    }
  }

  function vehiculo(c, x, y, s, ep, color, dir) {
    c.save();
    c.translate(x, y);
    c.scale(dir, 1);
    if (ep === 0) { // carruaje con caballo
      c.fillStyle = '#4a3020';
      elipse(c, s * 1.55, -s * 0.78, s * 0.42, s * 0.2);
      c.fill();
      c.fillRect(s * 1.22, -s * 0.65, s * 0.08, s * 0.65);
      c.fillRect(s * 1.8, -s * 0.65, s * 0.08, s * 0.65);
      poligono(c, [s * 1.85, -s * 0.9, s * 2.15, -s * 1.2, s * 2.3, -s * 1.08, s * 2.0, -s * 0.72]);
      c.fillStyle = color;
      c.fillRect(-s * 0.9, -s * 1.3, s * 1.7, s * 0.8);
      c.fillRect(-s, -s * 1.4, s * 1.9, s * 0.12);
      c.strokeStyle = '#1b1210';
      c.lineWidth = Math.max(1, s * 0.08);
      circulo(c, -s * 0.5, -s * 0.36, s * 0.34);
      c.stroke();
      circulo(c, s * 0.45, -s * 0.36, s * 0.34);
      c.stroke();
      trazo(c, s * 0.8, -s * 0.6, s * 1.3, -s * 0.75);
      c.fillStyle = 'rgba(255,200,110,.85)';
      c.fillRect(-s * 0.7, -s * 1.15, s * 0.4, s * 0.3);
    } else if (ep === 5) { // auto flotante
      c.fillStyle = 'rgba(53,240,208,.3)';
      elipse(c, 0, s * 0.35, s * 1.2, s * 0.12);
      c.fill();
      c.fillStyle = color[0];
      elipse(c, 0, -s * 0.2, s * 1.4, s * 0.38);
      c.fill();
      c.fillStyle = 'rgba(127,252,255,.7)';
      elipse(c, s * 0.2, -s * 0.48, s * 0.6, s * 0.25, 0, Math.PI, 0);
      c.fill();
    } else {
      const largo = s * 2.6;
      c.fillStyle = color[0];
      c.fillRect(-largo / 2, -s * 0.75, largo, s * 0.45);
      if (ep === 1) c.fillRect(-largo * 0.25, -s * 1.25, largo * 0.42, s * 0.52);
      else if (ep === 2) {
        c.fillRect(-largo * 0.28, -s * 1.05, largo * 0.5, s * 0.32);
        poligono(c, [-largo / 2, -s * 0.75, -largo / 2 + s * 0.4, -s * 0.75, -largo / 2, -s * 1.0]);
      } else if (ep === 3) poligono(c, [-largo * 0.3, -s * 0.75, -largo * 0.2, -s * 1.12, largo * 0.15, -s * 1.12, largo * 0.32, -s * 0.75]);
      else { elipse(c, -largo * 0.02, -s * 0.75, largo * 0.32, s * 0.38, 0, Math.PI, 0); c.fill(); }
      c.fillStyle = 'rgba(180,215,255,.55)';
      c.fillRect(-largo * 0.12, -s * (ep === 1 ? 1.15 : 0.98), largo * 0.22, s * 0.2);
      c.fillStyle = color[1];
      c.fillRect(-largo / 2, -s * 0.5, largo, s * 0.06);
      c.fillStyle = '#111';
      circulo(c, -largo * 0.3, -s * 0.28, s * 0.22);
      c.fill();
      circulo(c, largo * 0.3, -s * 0.28, s * 0.22);
      c.fill();
      c.fillStyle = '#fff3c4';
      c.fillRect(largo / 2 - 2, -s * 0.66, 2, s * 0.14);
      c.fillStyle = 'rgba(255,240,180,.18)';
      poligono(c, [largo / 2, -s * 0.62, largo / 2 + s * 1.6, -s * 0.85, largo / 2 + s * 1.6, -s * 0.2]);
    }
    c.restore();
  }

  /* =========================================================
     Gráficas
     ========================================================= */

  function barras(canvas, valores, etiquetas, opts) {
    const L = prepararLienzo(canvas);
    if (!L) return;
    const o = opts || {}, T = leerTema(), c = L.c, w = L.w, h = L.h;
    const v = (valores || []).map((x) => +x || 0), n = v.length;
    if (!n) return;
    const fmt = typeof o.formato === 'function' ? o.formato : null;
    const etiq = etiquetas || [];
    const max = Math.max(0, Math.max.apply(null, v)), min = Math.min(0, Math.min.apply(null, v));
    const arriba = fmt ? 14 : 4, abajo = etiq.length ? 15 : 3;
    const alto = Math.max(1, h - arriba - abajo), rango = max - min || 1;
    const cero = arriba + alto * (max / rango), bw = w / n, hueco = Math.min(3, bw * 0.15);
    c.font = '10px sans-serif';
    c.textAlign = 'center';
    let anchoEtiq = 0;
    etiq.forEach((e) => { anchoEtiq = Math.max(anchoEtiq, c.measureText(String(e)).width); });
    const salto = Math.max(1, Math.ceil((anchoEtiq + 6) / bw));
    const conValor = fmt && bw >= 34;
    v.forEach((x, i) => {
      const bh = (Math.abs(x) / rango) * alto, bx = i * bw + hueco;
      c.fillStyle = x < 0 ? T.mal : o.color || T.acento;
      c.fillRect(bx, x < 0 ? cero : cero - bh, bw - 2 * hueco, Math.max(x ? 1 : 0, bh));
      if (conValor) {
        c.fillStyle = T.texto;
        c.textBaseline = x < 0 ? 'top' : 'bottom';
        c.fillText(fmt(x), i * bw + bw / 2, x < 0 ? Math.min(cero + bh + 1, h - abajo - 10) : cero - bh - 1, bw);
      }
      if (i % salto === 0 && etiq[i] != null) {
        c.fillStyle = T.tenue;
        c.textBaseline = 'alphabetic';
        c.fillText(String(etiq[i]), i * bw + bw / 2, h - 3);
      }
    });
    if (min < 0) {
      c.fillStyle = T.tenue;
      c.fillRect(0, Math.round(cero), w, 1);
    }
    if (fmt && !conValor) {
      c.fillStyle = T.tenue;
      c.textAlign = 'left';
      c.textBaseline = 'top';
      c.fillText('máx ' + fmt(max), 2, 1);
    }
  }

  function linea(canvas, series, etiquetas, opts) {
    const L = prepararLienzo(canvas);
    if (!L) return;
    const o = opts || {}, T = leerTema(), c = L.c, w = L.w, h = L.h;
    const lista = (series || []).filter((s) => s && s.valores && s.valores.length);
    if (!lista.length) return;
    const fmt = typeof o.formato === 'function' ? o.formato : (x) => String(Math.round(x * 100) / 100);
    const valido = (x) => x != null && !isNaN(x);
    let min = Infinity, max = -Infinity, n = 0;
    lista.forEach((s) => {
      n = Math.max(n, s.valores.length);
      s.valores.forEach((x) => { if (valido(x)) { min = Math.min(min, +x); max = Math.max(max, +x); } });
    });
    if (!isFinite(min)) return;
    if (min === max) { min -= 1; max += 1; }
    c.font = '10px sans-serif';
    const tMax = fmt(max), tMin = fmt(min);
    const izq = Math.ceil(Math.max(c.measureText(tMax).width, c.measureText(tMin).width)) + 8;
    const arriba = 16, abajo = (etiquetas || []).length ? 15 : 4, der = 6;
    const ancho = Math.max(1, w - izq - der), alto = Math.max(1, h - arriba - abajo);
    const px = (i) => izq + (n > 1 ? (i / (n - 1)) * ancho : ancho / 2);
    const py = (x) => arriba + (1 - (x - min) / (max - min)) * alto;
    c.fillStyle = T.tenue;
    c.globalAlpha = 0.25;
    [0, 0.5, 1].forEach((k) => c.fillRect(izq, Math.round(arriba + k * alto), ancho, 1));
    if (min < 0 && max > 0) { c.globalAlpha = 0.6; c.fillRect(izq, Math.round(py(0)), ancho, 1); }
    c.globalAlpha = 1;
    c.textAlign = 'right';
    c.textBaseline = 'middle';
    c.fillText(tMax, izq - 4, arriba);
    c.fillText(tMin, izq - 4, arriba + alto);
    const etiq = etiquetas || [];
    if (etiq.length) {
      let anchoEtiq = 0;
      etiq.forEach((e) => { anchoEtiq = Math.max(anchoEtiq, c.measureText(String(e)).width); });
      const paso = n > 1 ? ancho / (n - 1) : ancho;
      const salto = Math.max(1, Math.ceil((anchoEtiq + 8) / paso));
      c.textAlign = 'center';
      c.textBaseline = 'alphabetic';
      etiq.forEach((e, i) => { if (i % salto === 0 && i < n) c.fillText(String(e), limitar(px(i), izq + anchoEtiq / 2, w - anchoEtiq / 2), h - 3); });
    }
    const paleta = [T.acento, T.dorado, T.rosa, '#5b8cff', '#c38bff', '#ff8f5a'];
    lista.forEach((s, k) => {
      const color = s.color || paleta[k % paleta.length];
      c.strokeStyle = color;
      c.fillStyle = color;
      c.lineWidth = 2;
      c.lineJoin = 'round';
      c.beginPath();
      let seguido = false, ultimo = -1;
      s.valores.forEach((x, i) => {
        if (!valido(x)) { seguido = false; return; }
        if (seguido) c.lineTo(px(i), py(+x)); else c.moveTo(px(i), py(+x));
        seguido = true;
        ultimo = i;
      });
      c.stroke();
      if (ultimo >= 0) { circulo(c, px(ultimo), py(+s.valores[ultimo]), 2.8); c.fill(); }
    });
    c.textAlign = 'left';
    c.textBaseline = 'middle';
    let lx = izq;
    lista.forEach((s, k) => {
      if (!s.nombre) return;
      c.fillStyle = s.color || paleta[k % paleta.length];
      circulo(c, lx + 4, 7, 3.5);
      c.fill();
      c.fillStyle = T.texto;
      c.fillText(String(s.nombre), lx + 11, 7);
      lx += 22 + c.measureText(String(s.nombre)).width;
    });
  }

  function radar(canvas, valores, etiquetas) {
    const L = prepararLienzo(canvas);
    if (!L) return;
    const T = leerTema(), c = L.c, w = L.w, h = L.h;
    const v = valores || [], n = v.length;
    if (n < 3) return;
    const cx = w / 2, cy = h / 2 + 4, R = Math.max(10, Math.min(w, h) / 2 - 22);
    const punto = (i, r) => [cx + Math.cos(-Math.PI / 2 + (i / n) * TAU) * r, cy + Math.sin(-Math.PI / 2 + (i / n) * TAU) * r];
    c.strokeStyle = T.tenue;
    c.globalAlpha = 0.3;
    c.lineWidth = 1;
    for (let k = 1; k <= 4; k++) {
      c.beginPath();
      for (let i = 0; i <= n; i++) { const p = punto(i % n, (R * k) / 4); c.lineTo(p[0], p[1]); }
      c.stroke();
    }
    c.globalAlpha = 1;
    c.fillStyle = rgba(T.acento.charAt(0) === '#' && T.acento.length === 7 ? T.acento : '#35d0ba', 0.3);
    c.strokeStyle = T.acento;
    c.lineWidth = 2;
    c.beginPath();
    v.forEach((x, i) => { const p = punto(i, (R * limitar(+x || 0, 0, 100)) / 100); c.lineTo(p[0], p[1]); });
    c.closePath();
    c.fill();
    c.stroke();
    c.fillStyle = T.tenue;
    c.font = '9px sans-serif';
    c.textAlign = 'center';
    c.textBaseline = 'middle';
    (etiquetas || []).forEach((e, i) => { const p = punto(i, R + 13); c.fillText(String(e), p[0], p[1]); });
  }

  /* =========================================================
     Sonido (pitidos de WebAudio como la V15)
     ========================================================= */

  let audio = null;
  let sonidoEncendido = true;
  // Cada nota: [frecuencia, inicio s, duración s, forma de onda, volumen]
  const SONIDOS = {
    clic: [[620, 0, 0.04, 'sine', 0.04]],
    avance: [[440, 0, 0.06, 'triangle', 0.04], [587, 0.06, 0.08, 'triangle', 0.04]],
    exito: [[523, 0, 0.1, 'triangle', 0.05], [659, 0.09, 0.1, 'triangle', 0.05], [784, 0.18, 0.18, 'triangle', 0.05]],
    fracaso: [[392, 0, 0.16, 'triangle', 0.05], [330, 0.15, 0.16, 'triangle', 0.05], [262, 0.3, 0.32, 'triangle', 0.05]],
    dinero: [[988, 0, 0.07, 'square', 0.025], [1319, 0.07, 0.2, 'square', 0.025]],
    premio: [[523, 0, 0.18, 'triangle', 0.06], [659, 0.11, 0.18, 'triangle', 0.06], [784, 0.22, 0.18, 'triangle', 0.06], [1047, 0.33, 0.3, 'triangle', 0.06]],
    error: [[196, 0, 0.09, 'square', 0.03], [165, 0.11, 0.14, 'square', 0.03]],
    estreno: [[392, 0, 0.12, 'triangle', 0.05], [523, 0.1, 0.12, 'triangle', 0.05], [659, 0.2, 0.12, 'triangle', 0.05],
      [784, 0.3, 0.4, 'triangle', 0.05], [1047, 0.3, 0.4, 'sine', 0.035]],
  };

  function sonido(tipo) {
    if (!sonidoEncendido) return;
    const notas = SONIDOS[tipo];
    if (!notas) return;
    try {
      const Contexto = window.AudioContext || window.webkitAudioContext;
      if (!Contexto) return;
      audio = audio || new Contexto();
      if (audio.state === 'suspended' && audio.resume) {
        const p = audio.resume();
        if (p && p.catch) p.catch(() => {});
      }
      const t0 = audio.currentTime + 0.01;
      notas.forEach((nota) => {
        const o = audio.createOscillator(), g = audio.createGain();
        o.type = nota[3];
        o.frequency.value = nota[0];
        g.gain.setValueAtTime(nota[4], t0 + nota[1]);
        g.gain.exponentialRampToValueAtTime(0.0001, t0 + nota[1] + nota[2]);
        o.connect(g);
        g.connect(audio.destination);
        o.start(t0 + nota[1]);
        o.stop(t0 + nota[1] + nota[2] + 0.02);
      });
    } catch (e) {
      // sin sonido: nunca interrumpe el juego
    }
  }

  /* =========================================================
     Mapa del mundo (V15 wmap): continentes y puntos por país
     puntos: [{ lon, lat, r (0..1), color, etiqueta }]
     ========================================================= */
  function mapa(canvas, continentes, puntos) {
    const p = prepararLienzo(canvas, 320, 170);
    if (!p) return;
    const c = p.c, w = p.w, h = p.h, T = leerTema();
    const X = (lon) => ((lon + 180) / 360) * w;
    const Y = (lat) => ((82 - lat) / 142) * h;
    c.fillStyle = T.panel;
    c.fillRect(0, 0, w, h);
    c.strokeStyle = rgba(T.tenue, 0.15);
    c.lineWidth = 1;
    for (let lon = -150; lon <= 150; lon += 30) trazo(c, X(lon), 0, X(lon), h);
    for (let lat = -60; lat <= 60; lat += 30) trazo(c, 0, Y(lat), w, Y(lat));
    (continentes || []).forEach((poli) => {
      c.beginPath();
      poli.forEach((q, i) => (i ? c.lineTo(X(q[0]), Y(q[1])) : c.moveTo(X(q[0]), Y(q[1]))));
      c.closePath();
      c.fillStyle = rgba(T.acento, 0.12);
      c.fill();
      c.strokeStyle = rgba(T.acento, 0.35);
      c.stroke();
    });
    const ordenados = (puntos || []).slice().sort((a, b) => (b.r || 0) - (a.r || 0));
    ordenados.forEach((q) => {
      const rr = 2.5 + Math.sqrt(Math.max(0, q.r || 0)) * Math.min(w, h) * 0.09;
      c.beginPath();
      c.arc(X(q.lon), Y(q.lat), rr, 0, TAU);
      c.fillStyle = rgba(q.color || T.tenue, q.destacado ? 0.95 : 0.55);
      c.fill();
      if (q.destacado) { c.lineWidth = 2; c.strokeStyle = T.texto; c.stroke(); }
    });
    c.font = '12px sans-serif';
    c.fillStyle = T.texto;
    c.textAlign = 'center';
    ordenados.filter((q) => q.etiqueta).forEach((q) => c.fillText(q.etiqueta, X(q.lon), Y(q.lat) - 8));
  }

  const api = {
    hash,
    mapa,
    FUENTES,
    logo,
    logoAleatorio,
    colorLogo,
    colorFondoLogo: colorFondo,
    colorTextoLogo: colorTexto,
    poster,
    posterEn,
    aspectoNuevo,
    retrato,
    retratoEn,
    estudio,
    barras,
    linea,
    radar,
    sonido,
    activarSonido(v) { sonidoEncendido = !!v; },
    sonidoActivo() { return sonidoEncendido; },
    menosMovimiento: false,
  };
  return api;
})();

/* ==== módulo: juego ==== */
// Crea la partida y mueve el reloj: la semana es la unidad del juego (producciones, cartelera, ventas, dinero y
// noticias); cada mes, gastos fijos, decisiones de rivales y tendencias; cada año, impuestos, edades, retiros,
// nuevas generaciones y balance. El ritmo lo elige el jugador: +1 semana, +1 mes, hasta el próximo evento o
// automático.
IA.juego = (function () {
  'use strict';
  const N = IA.n, D = IA.datos, M = IA.mundo, E = IA.economia, T = IA.talentos, O = IA.obras;
  const PR = IA.produccion, L = IA.lanzamiento, R = IA.rivales, PM = IA.premios, NG = IA.negocio;
  const ANIO_MIN = 1895, ANIO_MAX = 2100;
  // Los valores de tu documento (de $500 a $1 B) con pasos intermedios para que el recomendado sea justo
  const CAPITALES = [500, 1e3, 2.5e3, 5e3, 1e4, 2.5e4, 5e4, 1e5, 2.5e5, 5e5, 1e6, 2.5e6, 5e6, 1e7, 2.5e7, 5e7, 1e8, 2.5e8, 5e8, 1e9];
  const DIFICULTADES = [
    { id: 'facil', nombre: 'Fácil', rivales: -4 },
    { id: 'normal', nombre: 'Normal', rivales: 0 },
    { id: 'dificil', nombre: 'Difícil', rivales: 4 },
  ];
  let conectado = false;

  // Capital recomendado: el menor de la lista que alcance para unas 2,6 películas típicas de la época
  function capitalRecomendado(anio) {
    const meta = E.presupuestoTipico2025(anio) * 2.6;
    for (let i = 0; i < CAPITALES.length; i++) if (CAPITALES[i] >= meta) return CAPITALES[i];
    return CAPITALES[CAPITALES.length - 1];
  }
  function estadoBase(op) {
    return {
      v: IA.VERSION_GUARDADO, juego: 'INDUSTRY ART', semilla: String(op.semilla), rng: N.estadoNuevo(op.semilla),
      y0: op.anio, t: 0, sigId: 0, escenario: op.escenario || 'medio', dificultad: op.dificultad || 'normal',
      estudios: [], talentos: [], obras: [], premios: [], noticias: [], resumenAnios: {}, encajeVisto: {},
      mundo: { tendencias: {} },
      mercado: { fe52: [], anio: { total: 0, otras: 0, porEstudio: {} }, semana: null, hist: [], famMes: {} },
      fin: { mes: NG.libroVacio(), anio: NG.libroVacio(), meses: [], hist: [] },
      semanasEnRojo: 0, quiebra: null, majorDesde: null, investigaciones: 0,
      guiones: [], guionesPropios: [], usosMaterial: {}, reglaDominio: 70,
      avatar: null, creado: op.creado || '', bot: !!op.bot,
    };
  }
  // op: { semilla, anio, nombre, logo, pais, capital (dólares de hoy), dificultad, escenario, avatar, personalidad, tipo, vision, publico }
  function nuevaPartida(op) {
    const anio = N.limitar(Math.round(op.anio || 1900), ANIO_MIN, ANIO_MAX);
    op.anio = anio;
    if (!op.semilla) op.semilla = String(Date.now() % 1e9);
    const S = estadoBase(op);
    N.S = S;
    conectar();
    S.mundo.tendencias = M.tendenciasIniciales();
    const pais = D.pais(op.pais || 'us') || D.pais('us');
    const capital2025 = op.capital || capitalRecomendado(anio);
    S.estudios.push({
      id: 0, jugador: true, nombre: (op.nombre || 'INDUSTRY ART').slice(0, 40), logo: op.logo || { s: 8, c: 6, b: 14, t: 3, f: 1 },
      pais: pais.id, reg: pais.region, caja: Math.round(M.aEpoca(capital2025, anio)), capital2025: capital2025,
      fama: 0.05, pisos: ['oficinas', 'plato'], terrenos: [], valorObras: 0.9, tam: 1,
      tipo: op.tipo || 'Estudio', industria: 'Cine', vision: op.vision || 'Alcance Comercial', publico: op.publico || 'General',
      personalidad: op.personalidad || 'Normal', ingAnio: 0, gasAnio: 0, util: 0, clase: 'C',
    });
    const dif = DIFICULTADES.filter(function (d) { return d.id === S.dificultad; })[0] || DIFICULTADES[1];
    R.crearEstudios();
    for (let i = 1; i < S.estudios.length; i++) S.estudios[i].calidad += dif.rivales;
    T.generarInicial();
    const av = op.avatar || {};
    const esp = (av.especialidades || ['produccion', 'direccion', 'guion']).filter(function (x, i, a) { return D.oficio(x) && a.indexOf(x) === i; }).slice(0, 3);
    S.avatar = { nom: (av.nombre || 'Felipe').slice(0, 30), sx: av.sexo || 'M', nac: anio - (av.edad || 30), id: 999999, esp: esp };
    const vis = D.visiones.filter(function (v) { return v.id === S.estudios[0].vision; })[0];
    if (vis && vis.fama) S.estudios[0].fama = N.redondear(S.estudios[0].fama + vis.fama, 3);
    O.reindexar();
    noticia({ tipo: 'estudio', texto: 'Nace ' + S.estudios[0].nombre + ' en ' + pais.nombre + '. ' + M.era(anio) + '.', importante: true });
    // El mundo no arranca vacío: los rivales ya tienen obras en marcha y hay guiones en venta
    R.mensual(NG.contextoDe(1));
    IA.ideas.renovarGuiones();
    N.emit('partidaNueva', S);
    return S;
  }
  // Conecta los avisos de los módulos con la partida (una sola vez)
  function conectar() {
    if (conectado) return;
    conectado = true;
    N.on('noticia', noticia);
    N.on('aviso', function (a) { noticia({ tipo: a.tipo, texto: a.texto, importante: true }); });
    N.on('obraLista', function (o) {
      if (o.est !== 0) R.alQuedarLista(o, NG.contextoDe(o.est));
    });
    N.on('estreno', function (o) {
      const m = N.S.mercado;
      m.famMes[o.fam] = (m.famMes[o.fam] || 0) + 1;
      if (o.est === 0) noticia({ tipo: 'estreno', texto: N.S.avatar.nom + ' presenta «' + o.tit + '»: llega a los cines.' });
    });
    N.on('obraTerminada', function (o) {
      if (o.est === 0) noticia({ tipo: 'resultado', texto: '«' + o.tit + '» deja la cartelera con {$} de taquilla.', monto: o.bruto, importante: true });
    });
    N.on('premios', function (r) {
      const p = r.categorias.filter(function (c) { return c.id === 'pelicula'; })[0];
      if (p) noticia({ tipo: 'premios', texto: D.premios.nombre + ' ' + (r.anio + 1) + ': «' + p.ganador.titulo + '» de ' + N.S.estudios[p.ganador.est].nombre + ' gana Mejor película.', importante: p.ganador.est === 0 });
    });
  }
  function noticia(n) {
    const S = N.S;
    if (!S) return;
    S.noticias.unshift({ t: S.t, tipo: n.tipo || 'mundo', texto: n.texto, monto: n.monto, imp: n.importante ? 1 : 0 });
    if (S.noticias.length > 150) S.noticias.length = 150;
  }
  // Inicia una obra del jugador desde un borrador (valida capacidad y caja)
  function puedeIniciar(b) {
    const S = N.S;
    const gen = O.validarGeneros(b.gen);
    if (gen) return gen;
    const idea = IA.ideas.validar(b, N.anio());
    if (idea) return idea;
    if (O.clasificacionesDisponibles(N.anio(), b.gen).indexOf(b.clas) < 0) return 'Esa clasificación no está disponible en ' + N.anio() + '.';
    if (!O.equipoCompleto(b)) return IA.rodaje.necesita(b, 'animacion') && (b.eq.animacion === undefined || b.eq.animacion === null) && !IA.rodaje.esExterno(b, 'animacion') ?
      'Falta quien anime: contrata un animador o encarga la animación a un estudio externo.' : 'Falta completar el equipo.';
    const rod = IA.rodaje.validar(b, N.anio());
    if (rod) return rod;
    const ocupados = O.idsEquipo(b).filter(function (id) { return !T.disponible(T.porId(id), 0); });
    if (ocupados.length) { const t = T.porId(ocupados[0]); return (t ? t.nom : 'Alguien del equipo') + ' ya no está disponible.'; }
    // Negociación (V18): nadie firma si rechaza, si no se cumplen sus exigencias o si pidió un porcentaje
    const neg = O.negociaciones(b).filter(function (n) { return !n.ok; })[0];
    if (neg) {
      const t = T.porId(neg.id), nom = t ? t.nom : 'Alguien';
      if (neg.r.estado === 'contraoferta') return nom + ' ' + neg.r.texto.charAt(0).toLowerCase() + neg.r.texto.slice(1) + ': ponle ese porcentaje en su contrato.';
      if (neg.r.estado === 'exige') return nom + ': ' + neg.r.texto.toLowerCase() + '.';
      return nom + ' no firma: ' + neg.r.texto.toLowerCase() + '.';
    }
    if (O.enProduccion(0).length >= NG.capacidad(0)) return 'No tienes capacidad: construye un plató o espera a que termine un proyecto.';
    const costo = O.costoTalento(b) + (b.derechos || 0);
    if (S.estudios[0].caja < costo) return b.derechos ? 'No alcanza la caja para los contratos y los derechos.' : 'No alcanza la caja para los contratos.';
    return '';
  }
  function iniciarObra(b) {
    const err = puedeIniciar(b);

    IA.ideas.marcarEncaje(b);
    if (b.derechos) NG.pagar(0, 'derechos', b.derechos);
    if (b.mat) IA.ideas.registrarUso(b.mat, N.anio());
    // Un guion propio se usa una sola vez
    if (b.guionId) N.S.guionesPropios = (N.S.guionesPropios || []).filter(function (g) { return g.id !== b.guionId; });
    const o = PR.iniciar(b, NG.contextoDe(0));
    noticia({ tipo: 'estudio', texto: 'Empieza el desarrollo de «' + o.tit + '».' + (b.mat ? ' Basada en «' + IA.taxonomia.material(b.mat).tit + '».' : '') });
    return { obra: o };
  }
  // ---------- Talentos (V18): exclusivos, academia, promesas y contratar en una obra en marcha ----------
  function firmarExclusivo(id, anios) {

        pet.onsuccess = function () { ok(pet.result || null); };
        pet.onerror = function () { mal(pet.error); };

    }).join('');

  // Mapa del mundo: cada país con su público de cine; tu sede en dorado y las de los rivales en rosa
  function mMapa() {
    const anio = N.anio(), da = E.datosAnio(anio), S = N.S;
    const sedes = {};
    S.estudios.forEach(function (e) { sedes[e.pais] = sedes[e.pais] || []; sedes[e.pais].push(e); });
    const filas = D.paises.map(function (p) {
      const pub = da.regiones[p.region].publico * p.peso;
      return { p: p, pub: pub, pob: M.poblacion(p.region, anio) * p.peso };
    });
    const max = Math.max.apply(null, filas.map(function (f) { return f.pub; }).concat([1]));
    const css = getComputedStyle(document.documentElement);
    const g = U.grafica('mapa', function (cv) {
      IA.arte.mapa(cv, D.continentes, filas.map(function (f) {
        const s = sedes[f.p.id];
        const propia = s && s.some(function (e) { return e.id === 0; });
        return { lon: f.p.lon, lat: f.p.lat, r: f.pub / max, color: propia ? css.getPropertyValue('--dorado').trim() : s ? css.getPropertyValue('--rosa').trim() : css.getPropertyValue('--acento').trim(), destacado: !!s, etiqueta: propia ? f.p.nombre : '' };
      }));
    });
    let h = '<p class="nota">El tamaño de cada círculo es su público de cine en ' + anio + '. <span class="oro">Dorado</span>: tu sede · <span class="rosa">Rosa</span>: sedes rivales. Sedes en otros países llegan en la V28; tus cines propios ya existen (Negocio › Estudio › Terrenos).</p>' +
      '<canvas class="lienzo" style="height:auto;aspect-ratio:2/1" data-grafica="' + g + '"></canvas>';
    h += '<div class="desliza"><table class="tabla"><tr><th>País</th><th class="n">Población</th><th class="n">Entradas/año</th><th class="n">Costo de rodaje</th><th>Sede de</th></tr>' + filas.sort(function (a, b) { return b.pub - a.pub; }).map(function (f) {
      return '<tr><td>' + esc(f.p.nombre) + '<br><span class="tenue chico">' + esc(f.p.idioma) + '</span></td><td class="n">' + U.grande(f.pob) + '</td><td class="n">' + U.grande(f.pub) + '</td><td class="n">×' + U.decimal(f.p.costo, 2) + '</td><td>' + esc((sedes[f.p.id] || []).map(function (e) { return e.nombre; }).join(', ')) + '</td></tr>';
    }).join('') + '</table></div><p class="nota">Población y entradas por país son aproximadas: salen de su región y de su peso en ella.</p>';
    return h;
  }

      kpi('Mercado del cine al año', dinero(M.aEpoca(da.mercado2025, anio))) + kpi('Inflación del año', U.pct(M.inflacionAnual(anio))) + '</div>';

    h += '<div class="desliza"><table class="tabla"><tr><th>Región</th><th class="n">Población</th><th class="n">Acceso al cine</th><th class="n">Entradas/año</th><th class="n">Precio</th></tr>' + D.regiones.map(function (r) {
      return '<tr><td>' + esc(r.nombre) + '</td><td class="n">' + U.grande(M.poblacion(r.id, anio)) + '</td><td class="n">' + U.pct(M.accesoCine(r.id, anio), 0) + '</td><td class="n">' + U.grande(da.regiones[r.id].publico) + '</td><td class="n">' + dinero(da.regiones[r.id].precio) + '</td></tr>';
    }).join('') + '</table></div>';
    const g1 = U.grafica('poblacion', function (cv) {
      const anios = [], vals = [];
      for (let y = 1850; y <= 2150; y += 10) { anios.push(String(y)); vals.push(M.poblacionMundial(y) / 1e6); }
      IA.arte.linea(cv, [{ nombre: 'Millones de personas', color: getComputedStyle(document.documentElement).getPropertyValue('--acento').trim(), valores: vals }], anios, { formato: function (v) { return U.grande(v * 1e6); } });
    });
    h += '<h3>Población mundial 1850–2150</h3><canvas class="lienzo" data-grafica="' + g1 + '"></canvas><p class="nota">Real hasta 2024, proyección media de la ONU hasta 2100 y ficción del juego hasta 2150 (escenario ' + esc(N.S.escenario) + ').</p>';
    const reg = N.S.estudios[0].reg;
    const g2 = U.grafica('piramide', function (cv) {
      const ed = M.edades(reg, anio);
      IA.arte.barras(cv, ed.map(function (x) { return Math.round(x * 1000) / 10; }), M.GRUPOS, { formato: function (v) { return U.decimal(v, 1) + ' %'; } });
    });
    h += '<h3>Edades en ' + esc(D.region(reg).nombre) + '</h3><canvas class="lienzo" data-grafica="' + g2 + '"></canvas>';
    return h;
  }

  function negocio() {
    const s = sub('negocio', 'finanzas');
    return titulo(t('sec_negocio'), 'negocio') + pestanas('negocio', [['finanzas', t('neg_finanzas')], ['estudio', t('neg_estudio')], ['distribucion', 'Distribución'], ['mercado', t('neg_mercado')]], s) +
      ({ finanzas: nFinanzas, estudio: nEstudio, distribucion: IA.distribucion.negocioDistribucion, mercado: nMercado }[s] || nFinanzas)();
  }
  function tablaLibro(libro) {
    const filas = [];
    Object.keys(libro.ing).forEach(function (k) { filas.push('<tr><td>' + esc(NG.NOMBRES[k] || k) + '</td><td class="n bien">' + dinero(libro.ing[k]) + '</td></tr>'); });
    Object.keys(libro.gas).forEach(function (k) { filas.push('<tr><td>' + esc(NG.NOMBRES[k] || k) + '</td><td class="n mal">−' + dinero(libro.gas[k]).replace('$', '$') + '</td></tr>'); });
    const r = NG.total(libro, 'ing') - NG.total(libro, 'gas');
    filas.push('<tr><td><b>' + t('utilidad') + '</b></td><td class="n ' + (r >= 0 ? 'bien' : 'mal') + '"><b>' + dinero(r) + '</b></td></tr>');
    return '<table class="tabla">' + filas.join('') + '</table>';
  }

  ac('estLogo', function (v, el) { const est = est0(); est.logo = Object.assign({}, est.logo); moverLogo(est.logo, el, 'estLogo', 'estLogoVista'); });
  ac('estLogoFin', function () { U.refrescar(); });
  ac('desarmarSet', function (v) {
    const est = est0(), id = +v;
    const usa = O.activas().filter(function (o) { return o.est === 0 && o.setR === id && ['lista', 'cartelera', 'terminada'].indexOf(o.et) < 0; })[0];
    if (usa) { U.aviso('Lo está usando «' + usa.tit + '».', 'mal'); return; }

    U.aviso('Set desarmado');
    U.refrescar();
  });

    const est = est0(), k = el.getAttribute('data-k');

    U.aviso('Identidad actualizada');
    U.refrescar();
  });
  ac('construir', function (v) {
    const p = v.split(':');
    const err = NG.construir(p[0], p[1]);

    IA.arte.sonido('exito');

    U.refrescar();

/* ==== módulo: agencia ==== */
// Talentos 2.0 en pantalla (V18): la sección Talento con buscador avanzado (nombre, oficio, sexo, overall, costo,
// activos o retirados, orden), tu avatar con su academia, la búsqueda de promesas, y la ficha completa de cada
// talento (biografía, desempeño por familia, capacidades, medios, otras habilidades, fama por región, relaciones,
// ventajas, historial, premios e ingresos) con sus acciones: contratar para una obra en marcha o nueva, contrato
// exclusivo, comprar la exclusividad a un rival y academia con beca.
IA.agencia = (function () {
  'use strict';
  const N = IA.n, D = IA.datos, X = IA.taxonomia, E = IA.economia, M = IA.mundo, O = IA.obras, T = IA.talentos;
  const J = IA.juego, U = IA.ui, t = IA.t, esc = N.esc;
  const dinero = U.dinero, icono = U.icono, ac = U.accion;

  // ---------- Filtros del buscador (tu documento: nombre, overall, costo, sexo, talento, retirado o activo, orden) ----------
  const ft = { of: '', q: '', sx: '', estado: 'activos', disp: false, ovMin: 0, ovMax: 100, cMin: '', cMax: '', orden: 'valor', dir: 'desc', avanzado: false, n: 40, solo: '' };
  const ORDENES = [['valor', 'Recomendado'], ['overall', 'Overall'], ['fama', 'Popularidad'], ['costo', 'Costo'], ['taquilla', 'Taquilla de su carrera'], ['nombre', 'Nombre'], ['edad', 'Edad'], ['energia', 'Energía']];
  function barra(v, max, clase) { return '<span class="mini" style="width:60px"><i class="' + (clase || '') + '" style="width:' + Math.round(N.limitar(v / (max || 100), 0, 1) * 100) + '%"></i></span>'; }
  function signo(x) { return (x > 0 ? '+' : '') + x; }
  function kpi(nombre, valor, clase) { return '<div class="kpi"><span>' + esc(nombre) + '</span><b class="cifra ' + (clase || '') + '">' + esc(valor) + '</b></div>'; }
  function oficioNombre(t) { return T.nombreOficio(t); }
  function etiquetas(x) {
    const S = N.S, out = [];
    const ex = T.exclusivoDe(x);
    if (ex === 0) out.push('<span class="etiqueta oro">exclusivo tuyo</span>');
    else if (ex !== null) out.push('<span class="etiqueta">exclusivo de ' + esc(S.estudios[ex].nombre) + '</span>');
    if (T.estudiando(x)) out.push('<span class="etiqueta">estudiando</span>');
    if (x.desc) out.push('<span class="etiqueta bien">tu promesa</span>');
    if (x.beca && x.beca > S.t) out.push('<span class="etiqueta bien">becado</span>');
    if (x.mu) out.push('<span class="etiqueta mal">falleció</span>');
    else if (x.ret) out.push('<span class="etiqueta">retirado</span>');
    else if (T.ocupado(x)) out.push('<span class="etiqueta">en ' + x.act + ' proyecto' + (x.act > 1 ? 's' : '') + '</span>');
    return out.join(' ');
  }
  function lista() {
    const S = N.S, q = ft.q.toLowerCase();
    const cMin = ft.cMin === '' ? -Infinity : +ft.cMin, cMax = ft.cMax === '' ? Infinity : +ft.cMax;
    const r = S.talentos.filter(function (x) {
      if (ft.estado === 'activos' && (x.ret || x.mu)) return false;
      if (ft.estado === 'retirados' && !x.ret) return false;
      if (ft.of && x.of !== ft.of) return false;
      if (ft.sx && x.sx !== ft.sx) return false;
      if (ft.disp && !T.disponible(x, 0)) return false;
      if (ft.solo === 'exclusivos' && T.exclusivoDe(x) !== 0) return false;
      if (ft.solo === 'promesas' && !x.desc && !x.beca) return false;
      if (q && x.nom.toLowerCase().indexOf(q) < 0) return false;
      const ov = T.overall(x);
      if (ov < ft.ovMin || ov > ft.ovMax) return false;
      const c = T.tarifa(x);
      if (c < cMin || c > cMax) return false;
      return true;
    });
    const clave = {
      valor: function (x) { return x.hab + x.fama * 12; }, overall: T.overall, fama: function (x) { return x.fama; }, costo: T.tarifa,
      taquilla: function (x) { return x.tq || 0; }, nombre: function (x) { return x.nom; }, edad: function (x) { return -x.nac; }, energia: T.energia,
    }[ft.orden] || function (x) { return x.hab; };
    r.sort(function (a, b) {
      const va = clave(a), vb = clave(b);
      const c = typeof va === 'string' ? va.localeCompare(vb, 'es') : va - vb;
      return ft.dir === 'asc' ? c : -c;
    });
    return r;
  }
  // =====================================================================
  // SECCIÓN TALENTO
  // =====================================================================
  function talento() {
    const S = N.S, av = S.avatar;
    let h = '<div class="titulo-sec"><h2>' + esc(t('sec_talento')) + '</h2><div class="fila"><button class="ayuda-i" data-a="ayuda" data-v="talento" aria-label="' + t('ayuda') + '">i</button></div></div>';
    // Tu avatar y su academia
    const bonos = (av.esp || []).map(function (x) { return D.oficio(x).nombre + ' +' + (1 + ((av.ac && av.ac[x]) || 0)); }).concat(Object.keys(av.ac || {}).filter(function (x) { return (av.esp || []).indexOf(x) < 0; }).map(function (x) { return D.oficio(x).nombre + ' +' + av.ac[x]; }));

      '<span class="chico">En tus obras: ' + esc(bonos.join(' · ')) + '</span>' + (av.es && av.es.fin > S.t ? '<span class="chico oro">Estudiando ' + esc(T.curso(av.es.c).nombre) + ' hasta ' + esc(U.fechaCorta(av.es.fin)) + '</span>' : '') + '</div></div>' +
      '<button class="btn" data-a="agAcademia" data-v="avatar">' + icono('mas') + 'Estudiar (academia)</button><span class="nota"> Puedes ganar hasta +5 en cada oficio estudiando. La vida ligera y la carrera como talento llegan en la V29.</span></div>';

      '<select data-c="agPromesaOf" aria-label="Oficio a buscar"><option value="">Cualquier oficio</option>' + D.oficios.map(function (o) { return '<option value="' + o.id + '"' + (ft.promOf === o.id ? ' selected' : '') + '>' + esc(o.nombre) + '</option>'; }).join('') + '</select>' +
      '<button class="btn primario" data-a="agPromesas"' + (espera ? ' disabled' : '') + '>' + (espera ? 'De nuevo en ' + espera + ' semanas' : 'Buscar · ' + dinero(J.costoPromesas())) + '</button></div></div>';
    // Filtros
    h += '<div class="chips" style="margin:8px 0">' + '<button class="chip' + (!ft.of ? ' on' : '') + '" data-a="agOficio" data-v="">' + t('todos') + '</button>' + D.oficios.map(function (o) {
      return '<button class="chip' + (ft.of === o.id ? ' on' : '') + '" data-a="agOficio" data-v="' + o.id + '">' + esc(o.nombre) + '</button>';
    }).join('') + '</div>';
    h += '<div class="fila"><input type="search" placeholder="' + t('tal_buscar') + '" value="' + esc(ft.q) + '" data-c="agBuscar" style="flex:1"><button class="btn" data-a="agAvanzado" aria-expanded="' + ft.avanzado + '">Filtros</button></div>';
    if (ft.avanzado) {
      const sel = function (k, ops) { return '<select data-c="agFiltro" data-k="' + k + '">' + ops.map(function (o) { return '<option value="' + o[0] + '"' + (String(ft[k]) === String(o[0]) ? ' selected' : '') + '>' + esc(o[1]) + '</option>'; }).join('') + '</select>'; };
      h += '<div class="tarjeta"><div class="fila envolver">' +
        '<label class="campo crece"><span>Sexo</span>' + sel('sx', [['', 'Todos'], ['F', t('mujer')], ['M', t('hombre')]]) + '</label>' +
        '<label class="campo crece"><span>Estado</span>' + sel('estado', [['activos', 'Activos'], ['retirados', 'Retirados'], ['todos', 'Todos']]) + '</label>' +
        '<label class="campo crece"><span>Mostrar</span>' + sel('solo', [['', 'Todos'], ['exclusivos', 'Mis exclusivos'], ['promesas', 'Mis promesas y becados']]) + '</label></div>' +
        '<div class="fila envolver"><label class="campo crece"><span>Overall mínimo</span><input type="number" min="0" max="100" value="' + ft.ovMin + '" data-c="agFiltro" data-k="ovMin"></label>' +
        '<label class="campo crece"><span>Overall máximo</span><input type="number" min="0" max="100" value="' + ft.ovMax + '" data-c="agFiltro" data-k="ovMax"></label></div>' +
        '<div class="fila envolver"><label class="campo crece"><span>Costo mínimo (dólares de ' + N.anio() + ')</span><input type="number" min="0" value="' + esc(ft.cMin) + '" data-c="agFiltro" data-k="cMin" placeholder="sin mínimo"></label>' +
        '<label class="campo crece"><span>Costo máximo</span><input type="number" min="0" value="' + esc(ft.cMax) + '" data-c="agFiltro" data-k="cMax" placeholder="sin máximo"></label></div>' +
        '<div class="fila envolver"><label class="campo crece"><span>Ordenar por</span>' + sel('orden', ORDENES) + '</label><label class="campo crece"><span>Orden</span>' + sel('dir', [['desc', 'De mejor a peor'], ['asc', 'De peor a mejor']]) + '</label></div>' +
        '<label class="interruptor"><span>' + t('tal_disponibles') + '</span><input type="checkbox" data-c="agFiltro" data-k="disp"' + (ft.disp ? ' checked' : '') + '></label></div>';
    }
    const l = lista();
    h += '<p class="nota">' + l.length + ' talentos · ' + T.activos().length + ' activos en el mundo</p><div class="col">' + l.slice(0, ft.n).map(function (x) {
      const en = T.energia(x);
      return '<button class="tarjeta toque fila" style="width:100%;text-align:left" data-a="verTalento" data-v="' + x.id + '"><canvas class="retrato" data-retrato="' + x.id + '"></canvas><div class="col crece"><b>' + esc(x.nom) + '</b><span class="chico">' + esc(oficioNombre(x)) + ' · ' + (N.anio() - x.nac) + ' años · ' + esc(D.pais(x.pais).nombre) + ' · ' + esc(T.personalidad(x).txt) + '</span>' +
        '<span class="chico">Overall ' + T.overall(x) + ' · ' + t('tal_habilidad').toLowerCase() + ' ' + Math.round(x.hab) + ' · ' + t('tal_fama').toLowerCase() + ' ' + Math.round(x.fama * 100) + (x.ret ? '' : ' · energía ' + barra(en, 100, en < 40 ? 'mal' : '')) + '</span>' + (etiquetas(x) ? '<span>' + etiquetas(x) + '</span>' : '') + '</div><b class="cifra">' + dinero(T.tarifaPara(x, 0)) + '</b></button>';
    }).join('') + '</div>' + (l.length > ft.n ? '<button class="btn bloque" data-a="agMas">' + t('ver') + ' más</button>' : '');
    return h;
  }
  function render(mantener) { U.renderVista(mantener); }
  ac('agOficio', function (v) { ft.of = v; ft.n = 40; render(); });
  ac('agBuscar', function (v) { ft.q = v; ft.n = 40; render(true); });
  ac('agAvanzado', function () { ft.avanzado = !ft.avanzado; render(true); });
  ac('agMas', function () { ft.n += 40; render(true); });
  ac('agFiltro', function (v, el) {
    const k = el.getAttribute('data-k');
    if (k === 'disp') ft.disp = !!v;
    else if (k === 'ovMin' || k === 'ovMax') ft[k] = N.limitar(Math.round(+v || 0), 0, 100) || (k === 'ovMax' ? 100 : 0);
    else ft[k] = v;
    ft.n = 40;
    render(true);
  });
  ac('agPromesaOf', function (v) { ft.promOf = v; });
  ac('agPromesas', function () {
    const r = J.buscarPromesas(ft.promOf || '');
    if (r.error) { U.aviso(r.error, 'mal'); return; }
    IA.arte.sonido('exito');
    ft.solo = 'promesas'; ft.avanzado = true; ft.estado = 'activos'; ft.of = ''; ft.q = '';
    U.aviso('Tus cazatalentos encontraron ' + r.talentos.length + ' promesas');
    U.refrescar();
  });

  // =====================================================================
  // FICHA DEL TALENTO
  // =====================================================================
  function fichaTalento(id) {
    const x = T.porId(id);
    if (!x) return '<p class="tenue">Este talento ya no está en el mundo.</p>';
    const S = N.S, anio = N.anio(), e = anio - x.nac;
    const per = T.personalidad(x), ex = T.perfilExtra(x), r = D.rasgos[x.rasgo];
    const exc = T.exclusivoDe(x);
    let h = '<div class="fila" style="align-items:flex-start"><canvas class="retrato grande" data-retrato="' + x.id + '"></canvas><div class="col crece"><h2 style="margin:0">' + esc(x.nom) + '</h2>' +
      '<span>' + esc(oficioNombre(x)) + (x.h2 ? ' · también ' + esc(Object.keys(x.h2).map(function (k) { return T.nombreOficio(x, k).toLowerCase() + ' (' + Math.round(x.h2[k]) + ')'; }).join(', ')) : '') + '</span>' +
      '<span class="tenue">' + e + ' años · ' + esc(D.pais(x.pais).nombre) + ' · ' + (x.sx === 'F' ? t('mujer') : t('hombre')) + (x.idi ? ' · habla ' + esc(x.idi.map(function (i) { return i.toLowerCase(); }).join(', ')) : '') + '</span>' +
      '<span class="oro">' + esc(per.txt) + ' · impulsa ' + per.valor + ' % la popularidad</span><span>' + etiquetas(x) + '</span></div></div>';
    h += '<p>' + esc(T.biografia(x)) + '</p>';
    const pot = T.potencialConocido(x) ? Math.round(x.pot) : '?';
    h += '<div class="kpis" style="margin:10px 0">' + kpi('Overall', T.overall(x)) + kpi(t('tal_habilidad'), Math.round(x.hab)) + kpi('Potencial', pot) + kpi(t('tal_fama'), Math.round(x.fama * 100)) + kpi('Poder de estrella', ex.poder) +
      kpi(t('tal_tarifa'), dinero(T.tarifaPara(x, 0))) + kpi('Energía', x.ret ? '—' : T.energia(x)) + kpi('Moral', x.ret ? '—' : T.moral(x)) + kpi('Proyectos activos', (x.act || 0) + ' de ' + T.MAX_PROYECTOS) +
      kpi(t('tal_obras'), x.obras) + kpi('Éxitos', x.exitos) + kpi(t('tal_premios'), x.premios) + kpi('Taquilla en tu partida (hoy)', U.dinero(x.tq || 0, 2025)) + kpi('Ingresos en tu partida (hoy)', U.dinero(x.gan || 0, 2025)) + '</div>';
    if (pot === '?') h += '<p class="nota">El potencial se conoce de verdad si lo descubriste, si lo becaste o si trabajó contigo.</p>';
    // Acciones
    h += '<div class="fila envolver" style="margin:8px 0">' + (x.ret ? '' :
      '<button class="btn primario" data-a="agContratar" data-v="' + x.id + '">Contratar para…</button>' +
      (exc === 0 ? '<button class="btn" data-a="agCancelarEx" data-v="' + x.id + '">Cancelar exclusivo</button>' : exc !== null ? '<button class="btn" data-a="agComprarEx" data-v="' + x.id + '">Comprar exclusividad · ' + dinero(T.costoLiberar(x)) + '</button>' : '<button class="btn" data-a="agExclusivo" data-v="' + x.id + '">Contrato exclusivo</button>') +
      '<button class="btn" data-a="agAcademia" data-v="' + x.id + '">Academia y beca</button>') + '</div>';
    if (exc !== null) h += '<p class="nota">Contrato exclusivo con ' + esc(S.estudios[exc].nombre) + ' hasta ' + esc(U.fechaCorta(x.exH)) + ' · ' + dinero(x.exS) + ' al año.</p>';
    if (T.estudiando(x)) h += '<p class="nota oro">Estudiando ' + esc(T.curso(x.es.c).nombre) + ' hasta ' + esc(U.fechaCorta(x.es.fin)) + '.</p>';
    if (ui.panel && ui.panel.id === x.id) h += ui.panel.html();
    // Habilidades
    const bar = function (nombre, v, max) { return '<div class="fila entre chico"><span>' + esc(nombre) + '</span><span>' + barra(v, max || 100) + ' <b>' + Math.round(v) + '</b></span></div>'; };
    h += '<div class="dos"><div class="tarjeta"><h3>Desempeño por familia</h3>' + T.EJES.map(function (n, i) { return bar(n + ' (' + signo(x.af ? x.af[i] : 0) + ')', 50 + (x.af ? x.af[i] : 0) * 6); }).join('') + '</div>';
    h += '<div class="tarjeta"><h3>Capacidades</h3>' + T.CAPACIDADES.map(function (n, i) { return bar(n, x.cp ? x.cp[i] : x.hab); }).join('') + '</div></div>';
    const nomMed = { cine: 'Películas', tv: 'TV', musica: 'Música', juegos: 'Videojuegos', teatro: 'Teatro', libros: 'Libros' };
    h += '<div class="dos"><div class="tarjeta"><h3>Especialidades por medio</h3>' + T.MEDIOS.map(function (m) { return bar(nomMed[m] + (x.med === m ? ' ★' : ''), ex.medios[m]); }).join('') + '</div>';
    h += '<div class="tarjeta"><h3>Otras habilidades</h3>' + Object.keys(ex.otras).map(function (k) { return bar(k, ex.otras[k]); }).join('') + '</div></div>';
    if (x.of === 'interprete') h += '<div class="tarjeta"><h3>Actuación</h3>' + bar('Interpretación', x.hab) + bar('Belleza', x.bel || 50) + bar('Aprobación del público', x.apr || 50) + '<p class="chico">Papeles recomendados: ' + esc((x.pap || []).join(', ') || '—') + '</p></div>';
    h += '<div class="dos"><div class="tarjeta"><h3>Fama por región</h3>' + D.regiones.map(function (rg) { return bar(rg.nombre + (rg.id === x.reg ? ' (su tierra)' : ''), T.famaRegion(x, rg.id) * 100); }).join('') + '<p class="nota">Alcance internacional ' + Math.round((x.alc || 0) * 100) + ' %: crece con cada éxito.</p></div>';
    h += '<div class="tarjeta"><h3>Contenido y condiciones</h3><p class="chico">Acepta clasificaciones: <b>' + (x.cmax >= 7 ? 'Cualquiera' : X.ORDEN_CLAS.slice(0, x.cmax + 1).join(', ')) + '</b></p>' +
      (x.rasgo && r ? '<p class="chico">' + t('tal_rasgo') + ': <b>' + esc(x.rasgo) + '</b> (calidad ' + signo(r[0]) + ', sobrecosto ' + Math.round(r[1] * 100) + ' %, tarifa ×' + U.decimal(r[2], 2) + ')</p>' : '') +
      '<p class="chico">Ventajas: ' + (T.ventajas(x).length ? T.ventajas(x).map(function (v) { return '<b>' + esc(v.id) + '</b> (' + esc(v.efecto) + ')'; }).join(', ') : 'todavía ninguna (se ganan con obras, éxitos y premios)') + '</p>' +
      (x.ac && Object.keys(x.ac).length ? '<p class="chico">Academia: ' + Object.keys(x.ac).map(function (k) { return D.oficio(k).nombre + ' +' + x.ac[k]; }).join(', ') + ' (máximo +' + T.MAX_ACADEMIA + ')</p>' : '') + '</div></div>';
    // Relaciones
    const rel = Object.keys(x.rel || {}).map(function (k) { return { o: T.porId(+k), v: x.rel[k] }; }).filter(function (q) { return q.o; }).sort(function (a, b) { return Math.abs(b.v) - Math.abs(a.v); });
    h += '<h3>Relaciones</h3>' + (rel.length ? rel.map(function (q) {
      const tipo = T.tipoRelacion(q.v, x, q.o) || (q.v > 0 ? 'buena relación' : 'roces');
      return '<button class="tarjeta toque fila entre" style="width:100%" data-a="verTalento" data-v="' + q.o.id + '"><span>' + esc(q.o.nom) + ' <span class="tenue chico">' + esc(oficioNombre(q.o)) + '</span></span><span class="' + (q.v > 0 ? 'bien' : 'mal') + '">' + esc(tipo) + ' (' + signo(q.v) + ')</span></button>';
    }).join('') + '<p class="nota">La química del equipo clave (dirección, guion y protagonistas) suma o resta hasta 4 puntos de calidad.</p>' : '<p class="tenue">Las amistades, rivalidades y parejas nacen trabajando juntos.</p>');
    // Historial y premios
    const obras = S.obras.filter(function (o) { return (o.eq && O.idsEquipo(o).indexOf(id) >= 0) || (x.hist && x.hist.indexOf(o.id) >= 0); }).slice(-15).reverse();
    h += '<h3>' + t('tal_obras') + '</h3>' + (obras.length ? obras.map(function (o) {
      const m = O.multiplicador(o);
      return '<button class="tarjeta toque fila entre" style="width:100%" data-a="verObra" data-v="' + o.id + '"><span>«' + esc(o.tit) + '» <span class="tenue chico">' + esc(S.estudios[o.est].nombre) + ' · ' + (o.anio || O.NOMBRE_ETAPA[o.et]) + '</span></span>' + (o.et === 'terminada' ? '<span class="etiqueta ' + (m >= 2.5 ? 'bien' : m < 1.4 ? 'mal' : '') + '">×' + U.decimal(m, 2) + '</span>' : '') + '</button>';
    }).join('') : '<p class="tenue">Sin obras todavía.</p>');
    const premios = [];
    S.premios.forEach(function (p) { p.categorias.forEach(function (c) { if (c.ganador.tid === id) premios.push({ anio: p.anio + 1, cat: c.nombre, tit: c.ganador.titulo }); }); });
    if (premios.length) h += '<h3>Premios</h3>' + premios.reverse().map(function (p) { return '<p style="margin:4px 0">' + esc(D.premios.nombre) + ' ' + p.anio + ' · ' + esc(p.cat) + ' por «' + esc(p.tit) + '»</p>'; }).join('');
    h += '<p class="nota">La tarifa sale del mercado: habilidad, fama, demanda, proyectos en curso y época. Nunca del presupuesto de tu obra.</p>';
    return h;
  }
  // Paneles dentro de la ficha (contratar, exclusivo, academia)
  const ui = { panel: null };
  function abrirPanel(id, fn) { ui.panel = { id: id, html: fn }; U.refrescarFicha(fichaTalento(id)); }
  function cerrarPanel(id) { ui.panel = null; U.refrescarFicha(fichaTalento(id)); }
  ac('verTalento', function (v) { ui.panel = null; U.abrirFicha(fichaTalento(+v), 'talento:' + v); });
  ac('agCerrarPanel', function (v) { cerrarPanel(+v); });
  // ---------- Contratar para una obra en marcha (antes del rodaje) o para una nueva ----------
  ac('agContratar', function (v) {
    const id = +v, x = T.porId(id);
    abrirPanel(id, function () {
      const obras = O.delEstudio(0, ['desarrollo', 'preproduccion']);
      let h = '<div class="tarjeta picker"><div class="fila entre"><b>Contratar a ' + esc(x.nom) + '</b><button class="btn" data-a="agCerrarPanel" data-v="' + id + '">' + t('cerrar') + '</button></div>';
      // Lo que diría hoy (sin contar las condiciones de una obra concreta): si rechaza, se avisa antes
      const r = T.negociar(x, { est: 0, rol: x.of, imp: x.of === 'interprete' ? 'protagonista' : undefined });
      if (r.estado === 'rechaza') h += '<p class="mal">Hoy no firmaría: ' + esc(r.texto.charAt(0).toLowerCase() + r.texto.slice(1)) + '.</p>';
      else if (r.estado === 'contraoferta') h += '<p class="nota oro">' + esc(r.texto) + '.</p>';
      h += '<button class="btn primario bloque" data-a="agNuevaObra" data-v="' + id + '"' + (r.estado === 'rechaza' ? ' disabled' : '') + '>Nueva obra con ' + esc(x.nom.split(' ')[0]) + '</button>';
      h += obras.length ? '<p class="nota">O súmalo a una obra que todavía no empieza el rodaje:</p>' + obras.map(function (o) {
        let botones;
        if (x.of === 'interprete') botones = [['protagonista', 'Protagonista'], ['secundario', 'Secundario'], ['invitado', 'Invitado'], ['cameo', 'Cameo']].map(function (b) { return '<button class="btn" data-a="agSumar" data-v="' + o.id + '|' + id + '|interprete|' + b[0] + '">' + b[1] + '</button>'; }).join('');
        else {
          const actual = T.porId(o.eq[x.of]);
          botones = '<button class="btn" data-a="agSumar" data-v="' + o.id + '|' + id + '|' + x.of + '|">Como ' + esc(D.oficio(x.of).nombre.toLowerCase()) + (actual ? ' (reemplaza a ' + esc(actual.nom) + ')' : '') + '</button>';
        }
        return '<div class="tarjeta"><b>«' + esc(o.tit) + '»</b> <span class="tenue chico">' + O.NOMBRE_ETAPA[o.et] + '</span><div class="fila envolver" style="margin-top:4px">' + botones + '</div></div>';
      }).join('') : '<p class="tenue">No tienes obras antes del rodaje.</p>';
      return h + '</div>';
    });
  });
  ac('agSumar', function (v) {
    const p = v.split('|');
    const err = J.contratarEnObra(+p[0], +p[1], p[2], p[3] || undefined);
    if (err) { U.aviso(err, 'mal'); return; }
    IA.arte.sonido('dinero');
    U.aviso('Contratado');
    ui.panel = null;
    U.renderBarra();
    U.refrescarFicha(fichaTalento(+p[1]));
  });
  ac('agNuevaObra', function (v) {
    ui.panel = null;
    if (IA.creacion.crearCon) IA.creacion.crearCon(+v);
  });
  // ---------- Contratos exclusivos ----------
  ac('agExclusivo', function (v) {
    const id = +v, x = T.porId(id);
    abrirPanel(id, function () {
      const err = T.puedeExclusivo(x, 0);
      const sal = T.salarioExclusivo(x);
      return '<div class="tarjeta picker"><div class="fila entre"><b>Contrato exclusivo</b><button class="btn" data-a="agCerrarPanel" data-v="' + id + '">' + t('cerrar') + '</button></div>' +
        '<p class="nota">Trabaja solo para ti: no cobra por obra (ya cobra su salario), los rivales no pueden contratarlo y su moral sube. Salario: <b>' + dinero(sal) + ' al año</b> (sigue a la época), pagado cada mes.</p>' +
        (err ? '<p class="mal">' + esc(err) + '</p>' : '<div class="fila envolver">' + [1, 2, 3].map(function (a) { return '<button class="btn primario" data-a="agFirmarEx" data-v="' + id + '|' + a + '">' + a + ' año' + (a > 1 ? 's' : '') + ' · ' + dinero(sal * a) + '</button>'; }).join('') + '</div>') + '</div>';
    });
  });
  ac('agFirmarEx', function (v) {
    const p = v.split('|');
    const err = J.firmarExclusivo(+p[0], +p[1]);
    if (err) { U.aviso(err, 'mal'); return; }
    IA.arte.sonido('exito');
    U.aviso('Contrato exclusivo firmado');
    cerrarPanel(+p[0]);
  });
  ac('agComprarEx', function (v) {
    const err = J.comprarExclusividad(+v);
    if (err) { U.aviso(err, 'mal'); return; }
    IA.arte.sonido('dinero');
    U.aviso('Ahora está libre: puedes contratarlo o firmarle un exclusivo');
    U.renderBarra();
    cerrarPanel(+v);
  });

  // ---------- Academia (talentos con beca y tu avatar) ----------

/* ==== módulo: creacion ==== */

IA.creacion = (function () {
  'use strict';
  const N = IA.n, D = IA.datos, X = IA.taxonomia, I = IA.ideas, E = IA.economia, O = IA.obras, T = IA.talentos;

  let azarUI = null;
  function conAzarUI(fn) {
    const S = N.S;

  const BLOQUEO_GUION = ['gen', 'sub', 'tem', 'prob', 'arco', 'sarc'];
  function bloqueado(b, k) { return (b.ideaIA && BLOQUEO_IA.indexOf(k) >= 0) || (b.guionC && BLOQUEO_GUION.indexOf(k) >= 0); }
  function candado(b, k) { return bloqueado(b, k) ? ' <span class="etiqueta">' + (b.ideaIA ? 'fijado por la IA' : 'del guion') + '</span>' : ''; }

  // ---------- Borradores ----------
  function recomendarGenero() {
    const S = N.S;
    let mejor = 'DR', v = -9;
    D.ORDEN_FAM.forEach(function (f) {
      const x = (S.mundo.tendencias[f] || 0) + (E.pronosticoSemana(N.semana(S.t + 25), f) - 1) + (f === 'AV' ? -0.4 : 0);
      if (x > v) { v = x; mejor = f; }

    const gens = D.familia(mejor).generos.filter(function (g) { return g !== 'Erótico'; });
    return gens[N.hash(S.t + mejor) % gens.length];
  }
  function nuevoBorrador(gen, preparar) {

      O.equipoRecomendado(b, 1);
      if (preparar) preparar(b);

      I.generarPersonajes(b);
      O.recalcular(b);

      O.recalcular(b);
      return b;
    });
  }
  // Rehace lo que depende de las decisiones (familia, contenido por defecto, clasificación y costo)
  function ajustar(b) {
    const fam = D.familiaDe[b.gen[0]] || 'DR';
    if (!b.contTocado) b.cont = Object.assign({}, X.contenidoFamilia[fam]);
    if (!b.clasTocada) b.clasN = fam === 'AV';
    // Cómo se filma (V19): sigue la recomendación hasta que el jugador elige
    if (!b.metTocado) b.met = IA.rodaje.metodoRecomendado(b, anio());

  function textoRango(b, k) {

  // =====================================================================
  // V19 · PRODUCCIÓN EN LA FICHA DE LA OBRA Y DECISIONES
  // =====================================================================
  const NOMBRE_ETAPA_CORTO = { preproduccion: 'Preproducción', rodaje: 'Rodaje', posproduccion: 'Posproducción' };
  function barraNota(v) { return '<span class="mini" style="width:70px"><i style="width:' + Math.round(N.limitar(v / 100, 0, 1) * 100) + '%"></i></span>'; }
  function bloqueProduccion(o) {
    const Rr = IA.rodaje;
    if (!o.eq && !o.notas && !o.lp) return '';
    let h = '<h3>Producción</h3>';
    const partes = [];
    if (o.met) partes.push(Rr.metodo(o.met).nombre);
    if (o.met && Rr.usaLocacion(o) && o.ter) partes.push('terreno: ' + Rr.terreno(o.ter).nombre.toLowerCase());
    if (o.pst) partes.push('estilo: ' + Rr.estilo(o.pst).nombre.toLowerCase());
    if (o.rod) partes.push('rodada en ' + D.pais(o.rod).nombre);
    if (o.setR) partes.push('set reutilizado');
    if (o.ext) Object.keys(o.ext).forEach(function (r) { const e = Rr.externo(r, o.ext[r]); if (e) partes.push(e.nombre.toLowerCase()); });
    if (partes.length) h += '<p>' + esc(partes.join(' · ')) + '</p>';
    if (o.est === 0 && o.dil) { const x = Rr.dilemaDe(o); h += '<button class="btn primario bloque" data-a="verDecision" data-v="' + o.id + '">Decidir: ' + esc(x ? x.txt : 'un dilema del rodaje') + '</button>'; }
    else if (o.est === 0 && o.prueba && !o.prueba.ok) h += '<button class="btn primario bloque" data-a="verDecision" data-v="' + o.id + '">Ver la prueba de público (' + o.prueba.p + ' de 100)</button>';
    // Notas por departamento: las finales al terminar; mientras tanto, las esperadas
    const ns = o.notas ? Object.keys(o.notas).map(function (k) { return { nombre: Rr.nombreDep(k), v: o.notas[k], letra: Rr.letra(o.notas[k]) }; }).sort(function (a, b) { return b.v - a.v; }) :
      (o.eq && o.est === 0 && o.et !== 'terminada' && o.et !== 'cartelera' ? Rr.notas(o) : []);
    if (ns.length) h += '<h4>' + (o.notas ? 'Notas por departamento' : 'Notas esperadas por departamento') + '</h4><div class="col">' + ns.map(function (n) { return '<div class="fila entre chico"><span>' + esc(n.nombre) + '</span><span>' + barraNota(n.v) + ' <b style="display:inline-block;min-width:2.2em;text-align:right">' + n.letra + '</b></span></div>'; }).join('') + '</div>';
    const l = Rr.linea(o);
    if (l) {
      const dif = l.plan ? l.real / l.plan - 1 : 0;
      const enMarcha = ['desarrollo', 'preproduccion', 'rodaje', 'posproduccion'].indexOf(o.et) >= 0;
      h += '<h4>Línea de producción</h4><p>' + (enMarcha ? 'Gastado hasta hoy <b>' + dinero(l.real) + '</b> de <b>' + dinero(l.plan) + '</b> acordados (' + Math.round(l.real / Math.max(1, l.plan) * 100) + ' %)' :
        'Presupuesto acordado <b>' + dinero(l.plan) + '</b> · costo real <b class="' + (dif > 0.05 ? 'mal' : dif < -0.02 ? 'bien' : '') + '">' + dinero(l.real) + '</b> (' + (dif >= 0 ? '+' : '') + Math.round(dif * 100) + ' %)') + '</p>';
      h += '<div class="col">' + l.filas.map(function (f) {
        return '<div class="fila entre chico"><span>' + NOMBRE_ETAPA_CORTO[f.et] + '</span><span>plan ' + dinero(f.plan) + ' · real ' + dinero(f.real) + ' · ' + f.sem0 + (f.sem !== f.sem0 ? ' → ' + f.sem : '') + ' sem.</span></div>';
      }).join('') + (l.extra ? '<div class="fila entre chico"><span>Imprevistos y decisiones</span><span>' + dinero(l.extra) + '</span></div>' : '') + '</div>';
      if (l.ev.length) h += '<h4>Lo que pasó en la producción</h4><ul>' + l.ev.slice().reverse().map(function (e) { return '<li>' + esc(e.txt) + (e.c ? ' <span class="tenue">(' + dinero(e.c) + ')</span>' : '') + '</li>'; }).join('') + '</ul>';
    }
    if (o.prueba) {
      const op = o.prueba.ok ? IA.rodaje.OPCIONES_PRUEBA.filter(function (x) { return x.id === o.prueba.ok; })[0] : null;
      h += '<p>Prueba de público: <b>' + o.prueba.p + ' de 100</b>. ' + esc(o.prueba.com.join(' ')) + (op ? ' Decisión: ' + esc(op.t.toLowerCase()) + (o.prueba.dp ? ' (' + (o.prueba.dp > 0 ? '+' : '') + o.prueba.dp + ' al público)' : '') + '.' : '') + '</p>';
    }
    return h;
  }
  // Ventana de decisión: un dilema del rodaje o la prueba de público
  function modalDecision(o) {
    const Rr = IA.rodaje;
    if (o.dil) {
      const x = Rr.dilemaDe(o);
      if (!x) return;
      U.modal('<h2>«' + esc(o.tit) + '»</h2><p><b>' + esc(x.txt) + '</b></p><p class="nota">' + esc(O.NOMBRE_ETAPA[o.et]) + '. Si no decides en 2 semanas, el equipo hará lo más prudente.</p><div class="col">' +
        x.ops.map(function (op) { return '<button class="btn bloque decision" data-a="rdDilema" data-v="' + o.id + '|' + op.i + '"><b>' + esc(op.t) + '</b><span class="tenue chico">' + esc(efectoTxt(op.op, o)) + '</span></button>'; }).join('') + '</div>');
      return;
    }
    if (o.prueba && !o.prueba.ok) {
      U.modal('<h2>Prueba de público</h2><p>«' + esc(o.tit) + '»: <b>' + o.prueba.p + ' de 100</b></p><p>' + esc(o.prueba.com.join(' ')) + '</p><p class="nota">El puntaje anticipa (con algo de azar) lo que dirá el público. Si no decides en 3 semanas, se estrena así.</p><div class="col">' +
        Rr.opcionesPrueba(o).map(function (op) { return '<button class="btn bloque decision"' + (op.no ? ' disabled' : '') + ' data-a="rdPrueba" data-v="' + o.id + '|' + op.id + '"><b>' + esc(op.t) + '</b><span class="tenue chico">' + esc(op.no || op.texto + (op.costo > 0 ? ' Cuesta ' + dinero(o.pp * op.costo) + '.' : '')) + '</span></button>'; }).join('') + '</div>');
    }
  }
  function efectoTxt(op, o) {
    const p = [];
    const sem = function (n) { return Math.max(1, Math.round(n * IA.rodaje.escalaSemanas())); };
    if (op.costo) p.push('cuesta ' + dinero(o.pp * op.costo));
    if (op.sem) p.push((op.sem > 0 ? '+' : '−') + sem(Math.abs(op.sem)) + ' semana' + (sem(Math.abs(op.sem)) > 1 ? 's' : ''));
    if (op.q) p.push((op.q > 0 ? 'mejor' : 'peor') + ' calidad');
    if (op.pub) p.push((op.pub > 0 ? '+' : '') + op.pub + ' al público');
    if (op.crit) p.push((op.crit > 0 ? '+' : '') + op.crit + ' a la crítica');
    if (op.des) p.push('más expectativa');
    if (op.azar !== undefined) p.push('puede salir bien o mal');
    if (op.mo) p.push('cambia la moral');
    if (op.rel) p.push(op.rel[2] > 0 ? 'acerca a dos personas' : 'crea roces');
    return p.length ? p.join(' · ') : 'sin efectos';
  }
  function abrirDecision(id) { const o = O.porId(+id); if (o) modalDecision(o); }
  ac('verDecision', function (v) { if (U.fichaAbierta()) U.cerrarFicha(); abrirDecision(v); });
  ac('rdDilema', function (v) {

  // Si quedan más decisiones pendientes, se abre la siguiente
  function siguienteDecision() { const o = J.decisionesPendientes()[0]; if (o) setTimeout(function () { modalDecision(o); }, 50); }

  return { fichaCrear: fichaCrear, bloqueIdea: bloqueIdea, taxonomia: taxonomia, conAzarUI: conAzarUI, estado: cr, crearCon: crearCon,
    bloqueProduccion: bloqueProduccion, abrirDecision: abrirDecision, siguienteDecision: siguienteDecision };
})();

/* ==== módulo: distribucion ==== */
// V20 · Lanzamiento (pantallas): el plan de estreno de cada obra (vía, fecha con cuenta regresiva, regiones con
// su modo y su doblaje, campaña con la mezcla de canales, promociones, expectativa frente a calidad), las ventanas
// y el dinero en cadena en la ficha de la obra, las acciones del catálogo (reestrenar, remasterizar, bóveda),
// las cadenas de cines y tus cines en Negocio, y el calendario de 12 meses y las tendencias por región en Mundo.
IA.distribucion = (function () {
  'use strict';
  const N = IA.n, D = IA.datos, E = IA.economia, M = IA.mundo, O = IA.obras, T = IA.talentos;
  const L = IA.lanzamiento, ES = IA.estreno, V = IA.ventanas, U = IA.ui, esc = N.esc;
