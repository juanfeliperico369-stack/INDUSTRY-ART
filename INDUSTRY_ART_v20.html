/* INDUSTRY ART V16 · estilos
   Tema Oscuro = la paleta de la V15 (azul noche, turquesa, rosa y dorado). Temas: Claro, Época y Alto contraste.
   Botones de 44 px o más y texto de 14 px o más. Vertical: menú abajo. Horizontal y PC: menú lateral y dos columnas. */
:root {
  --fondo: #0b1020; --panel: #151c33; --panel2: #1e2744; --borde: #2c3760; --texto: #e9edf8; --tenue: #a3aecb;
  --acento: #35d0ba; --acento-tx: #06231f; --rosa: #ff4f81; --dorado: #ffc857; --bien: #4ade80; --mal: #ff6b6b;
  --sombra: 0 8px 24px rgba(0, 0, 0, .35); --radio: 16px; --t: 16px; --barra: 56px; --menu: 64px; --lado: 220px;
  --titulos: 'Titulos', Impact, 'Arial Narrow', sans-serif;
  color-scheme: dark;
}
:root[data-tema="claro"] {
  --fondo: #f3f1ea; --panel: #ffffff; --panel2: #ece8dd; --borde: #d6d0c0; --texto: #1b1f2e; --tenue: #555d73;
  --acento: #0f8f7e; --acento-tx: #ffffff; --rosa: #d6265c; --dorado: #9a6b00; --bien: #15803d; --mal: #c2262e;
  --sombra: 0 6px 18px rgba(30, 30, 50, .15); color-scheme: light;
}
:root[data-tema="contraste"] {
  --fondo: #000; --panel: #0c0c0c; --panel2: #1a1a1a; --borde: #ffffff; --texto: #ffffff; --tenue: #e6e6e6;
  --acento: #00ffd5; --acento-tx: #000; --rosa: #ff5c93; --dorado: #ffe14d; --bien: #7dff7d; --mal: #ff7070;
}
:root[data-tema="epoca"][data-epoca="sepia"] {
  --fondo: #1d150c; --panel: #2a1f12; --panel2: #3a2b19; --borde: #5b452a; --texto: #f4e6cc; --tenue: #cdb48a;
  --acento: #e0a95b; --acento-tx: #241708; --rosa: #d9735b; --dorado: #f1cf7a;
}
:root[data-tema="epoca"][data-epoca="neon"] {
  --fondo: #10061f; --panel: #1b0d33; --panel2: #281448; --borde: #4b2a7a; --texto: #f7ecff; --tenue: #c4a8e6;
  --acento: #ff4fd8; --acento-tx: #23001c; --rosa: #4fe3ff; --dorado: #ffe14f;
}
:root[data-tema="epoca"][data-epoca="vidrio"] {
  --fondo: #071a22; --panel: #0d2833; --panel2: #133746; --borde: #24566a; --texto: #e6fbff; --tenue: #9cc7d4;
  --acento: #4ff0c8; --acento-tx: #032018; --rosa: #ff7aa8; --dorado: #ffd36e;
}
:root[data-texto="1"] { --t: 15px; }
:root[data-texto="3"] { --t: 18px; }
:root[data-texto="4"] { --t: 20px; }

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; }
body { background: var(--fondo); color: var(--texto); font: var(--t)/1.45 'Trebuchet MS', 'Segoe UI', system-ui, sans-serif; overflow: hidden; overflow-wrap: break-word; }
/* Nombres largos sin espacios (títulos y nombres de estudio) se cortan en vez de desbordar */
h1, h2, h3, .tarjeta b, .marca b, .col b { overflow-wrap: anywhere; }
.btn, .chip, .pestana, .tabla th, .tabla td { overflow-wrap: normal; }
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3 { font-family: var(--titulos); font-weight: 400; letter-spacing: .04em; margin: .2em 0 .4em; line-height: 1.1; }
h1 { font-size: 2.3em; } h2 { font-size: 1.6em; } h3 { font-size: 1.25em; }
a { color: var(--acento); }
.oculto { display: none !important; }
.tenue { color: var(--tenue); }
.chico { font-size: .9em; }
.bien { color: var(--bien); } .mal { color: var(--mal); } .oro { color: var(--dorado); } .rosa { color: var(--rosa); }
:focus-visible { outline: 3px solid var(--dorado); outline-offset: 2px; }

/* ---------- Estructura ---------- */
#app { position: fixed; top: 0; right: 0; bottom: 0; left: 0; display: grid; grid-template-rows: var(--barra) 1fr var(--menu); grid-template-columns: 1fr; grid-template-areas: "barra" "vista" "menu"; padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
#barra { grid-area: barra; display: flex; align-items: center; gap: 6px; padding: 0 8px; background: var(--panel); border-bottom: 1px solid var(--borde); min-width: 0; }
#menu { grid-area: menu; display: flex; background: var(--panel); border-top: 1px solid var(--borde); }
#vista { grid-area: vista; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; padding: 10px 10px 24px; outline: none; }
#app.sin-juego { grid-template-rows: 1fr; grid-template-areas: "vista"; }
#app.sin-juego #barra, #app.sin-juego #menu { display: none; }

/* Menú */
.nav { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 48px; background: none; border: 0; color: var(--tenue); cursor: pointer; font-size: 14px; padding: 4px 2px; }
.nav svg { width: 24px; height: 24px; }
.nav.on { color: var(--acento); box-shadow: inset 0 3px 0 var(--acento); }

/* Barra superior */
.marca { display: flex; align-items: center; gap: 6px; min-width: 0; flex: 0 1 auto; }
.marca canvas { width: 34px; height: 34px; flex: none; }
.marca b { font-family: var(--titulos); font-size: 1.15em; letter-spacing: .05em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 22vw; }
.fecha { display: flex; flex-direction: column; line-height: 1.1; min-width: 0; font-size: 14px; }
.fecha b { font-size: 15px; white-space: nowrap; }
.fecha span { white-space: nowrap; }
.dinero { background: var(--panel2); border: 1px solid var(--borde); border-radius: 12px; padding: 4px 10px; min-height: 44px; display: flex; flex-direction: column; justify-content: center; line-height: 1.05; cursor: pointer; min-width: 0; }
.dinero b { font-size: 16px; white-space: nowrap; }
.dinero span { font-size: 14px; color: var(--tenue); white-space: nowrap; }
.dinero.rojo b { color: var(--mal); }
.espacio { flex: 1; }
.ico { width: 44px; height: 44px; min-width: 44px; display: inline-flex; align-items: center; justify-content: center; border-radius: 12px; border: 1px solid var(--borde); background: var(--panel2); cursor: pointer; padding: 0; }
.ico svg { width: 22px; height: 22px; }
.avanzar { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 44px; min-width: 44px; padding: 0 12px; border-radius: 12px; border: 0; background: var(--acento); color: var(--acento-tx); font-weight: 700; cursor: pointer; white-space: nowrap; }
.avanzar svg { width: 20px; height: 20px; }
.avanzar.auto { background: var(--rosa); color: #fff; }

/* ---------- Componentes ---------- */
.tarjeta { background: var(--panel); border: 1px solid var(--borde); border-radius: var(--radio) var(--radio) var(--radio) 4px; padding: 12px; margin: 0 0 10px; }
.tarjeta.toque { cursor: pointer; }
.tarjeta.toque:active { transform: scale(.99); }
.fila { display: flex; align-items: center; gap: 10px; }
.fila.entre { justify-content: space-between; }
.fila.envolver { flex-wrap: wrap; }
.col { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.crece { flex: 1; min-width: 0; }
.rejilla { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
.dos { display: grid; gap: 10px; grid-template-columns: 1fr; }
.kpis { display: grid; gap: 8px; grid-template-columns: repeat(2, 1fr); }
.kpi { background: var(--panel2); border-radius: 12px; padding: 8px 10px; min-width: 0; }
.kpi span { display: block; color: var(--tenue); font-size: 14px; }
.kpi b { font-size: 1.15em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }
.kpi svg { width: 18px; height: 18px; vertical-align: -3px; }
.btn { min-height: 44px; padding: 10px 16px; border-radius: 12px; border: 1px solid var(--borde); background: var(--panel2); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-align: center; }
.btn.primario { background: var(--acento); color: var(--acento-tx); border: 0; font-weight: 700; }
.btn.peligro { background: var(--mal); color: #fff; border: 0; }
.btn.bloque { width: 100%; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn svg { width: 20px; height: 20px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { min-height: 44px; padding: 8px 12px; border-radius: 22px; border: 1px solid var(--borde); background: var(--panel2); cursor: pointer; }
.chip.on { background: var(--rosa); border-color: var(--rosa); color: #fff; }
.chip:disabled { opacity: .4; }
.pestanas { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 8px; scrollbar-width: thin; }

#ficha { position: fixed; left: 0; right: 0; bottom: 0; max-height: 88vh; z-index: 30; background: var(--panel); border-top: 1px solid var(--borde); border-radius: 20px 20px 0 0; box-shadow: var(--sombra); transform: translateY(105%); transition: transform .25s ease; overflow-y: auto; padding: 8px 14px calc(18px + env(safe-area-inset-bottom)); }

/* ---------- Horizontal y PC: menú lateral y dos columnas ---------- */
@media (orientation: landscape) and (min-width: 640px), (min-width: 900px) {
  #app { grid-template-rows: var(--barra) 1fr; grid-template-columns: var(--lado) 1fr; grid-template-areas: "barra barra" "menu vista"; }

  #ficha .tirador { display: none; }
  #avisos { bottom: 16px; }
  .estudio-lienzo { height: 320px; }
}
/* Celular en horizontal: poca altura, menú lateral solo con íconos */
@media (orientation: landscape) and (max-height: 500px) {
  :root { --barra: 52px; --lado: 76px; }
  .nav { flex-direction: column; justify-content: center; gap: 0; padding: 4px; font-size: 14px; }
  .estudio-lienzo { height: 220px; }
  .marca b { display: none; }
  .fecha span { display: none; }

}

/* Forzar orientación de la interfaz si el jugador lo eligió */

:root[data-orientacion="vertical"] #menu { flex-direction: row; border-right: 0; border-top: 1px solid var(--borde); padding: 0; }
:root[data-orientacion="vertical"] .nav { flex: 1; flex-direction: column; }

  .ico.opcional { display: none; }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
:root[data-movimiento="menos"] * { transition: none !important; animation: none !important; }

/* V19: botones de decisión (dilemas y prueba de público): título arriba y efecto abajo */
.btn.decision { flex-direction: column; align-items: flex-start; text-align: left; gap: 2px; }
.btn.decision b { font-weight: 600; }

<script>
/* ==== módulo: nucleo ==== */
// Arranque del espacio de nombres, azar con semilla, reloj semanal, mensajes entre módulos y utilidades.
// La partida vive en IA.n.S: un solo objeto de datos, sin funciones adentro.
var IA = {};
IA.VERSION = '20.0';
IA.VERSION_GUARDADO = 20;
// Banderas de edición en un solo lugar (completa o gratuita). Todas en "completa" hasta la V35.
IA.EDICION = { nombre: 'completa', ranurasManuales: 5, autoguardados: 3, bot: true };

IA.n = (function () {
  'use strict';
  const nucleo = { S: null };

  // ---------- Azar con semilla (sfc32) ----------
  // El estado son 4 enteros de 32 bits guardados en S.rng: la misma semilla y las mismas decisiones
  // dan la misma partida, así se repiten los errores y se comparan versiones.
  function semillaDeTexto(texto) {
    let h = 1779033703 ^ texto.length;
    for (let i = 0; i < texto.length; i++) {
      h = Math.imul(h ^ texto.charCodeAt(i), 3432918353);
      h = (h << 13) | (h >>> 19);
    }
    const sal = [];
    for (let k = 0; k < 4; k++) {
      h = Math.imul(h ^ (h >>> 16), 2246822507);
      h = Math.imul(h ^ (h >>> 13), 3266489909);
      h ^= h >>> 16;
      sal.push(h >>> 0);
    }
    return sal;
  }
  function estadoNuevo(semilla) {
    const st = semillaDeTexto(String(semilla));
    // Calentar el generador
    const tmp = { rng: st };
    for (let i = 0; i < 15; i++) paso(tmp.rng);
    return tmp.rng;
  }
  function paso(r) {
    let a = r[0] >>> 0, b = r[1] >>> 0, c = r[2] >>> 0, d = r[3] >>> 0;
    const t = (((a + b) >>> 0) + d) >>> 0;
    d = (d + 1) >>> 0;
    a = b ^ (b >>> 9);
    b = (c + (c << 3)) >>> 0;
    c = (c << 21) | (c >>> 11);
    c = (c + t) >>> 0;
    r[0] = a >>> 0; r[1] = b >>> 0; r[2] = c >>> 0; r[3] = d;
    return t / 4294967296;
  }
  function azar() { return paso(nucleo.S.rng); }
  function entero(a, b) { return a + Math.floor(azar() * (b - a + 1)); }
  function elegir(lista) { return lista[Math.floor(azar() * lista.length)]; }
  function probabilidad(p) { return azar() < p; }
  function normal(media, desvio) {
    // Box-Muller acotado a ±3 desvíos para que nada sea absurdo
    let u = 0, v = 0;
    while (u === 0) u = azar();
    v = azar();
    const z = Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
    return media + desvio * Math.max(-3, Math.min(3, z));
  }
  function ponderado(pesos) {
    let total = 0;
    for (let i = 0; i < pesos.length; i++) total += Math.max(0, pesos[i]);
    let x = azar() * total;
    for (let i = 0; i < pesos.length; i++) {
      x -= Math.max(0, pesos[i]);
      if (x < 0) return i;
    }
    return pesos.length - 1;
  }
  function mezclar(lista) {
    for (let i = lista.length - 1; i > 0; i--) {
      const j = Math.floor(azar() * (i + 1));
      const t = lista[i]; lista[i] = lista[j]; lista[j] = t;
    }
    return lista;
  }
  // Hash determinista (para arte, nombres estables y ruido sin gastar el generador)
  function hash(texto) {
    let h = 2166136261;
    const s = String(texto);
    for (let i = 0; i < s.length; i++) {
      h ^= s.charCodeAt(i);
      h = Math.imul(h, 16777619);
    }
    return h >>> 0;
  }
  function ruido(texto) { return hash(texto) / 4294967296; }

  // ---------- Reloj ----------
  // S.t = semanas desde el inicio. El año tiene 52 semanas; los meses salen del día real de cada semana.
  const DIAS_MES = [31, 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31];
  function anio(t) { const S = nucleo.S; return S.y0 + Math.floor((t === undefined ? S.t : t) / 52); }
  function semana(t) { const S = nucleo.S; return ((t === undefined ? S.t : t) % 52) + 1; }
  function mesDeSemana(sem) {
    let dia = (sem - 1) * 7 + 4; // día del medio de la semana
    for (let m = 0; m < 12; m++) {
      if (dia <= DIAS_MES[m]) return m;
      dia -= DIAS_MES[m];
    }
    return 11;
  }
  function mes(t) { return mesDeSemana(semana(t)); }
  function tDe(anioX, semanaX) { return (anioX - nucleo.S.y0) * 52 + (semanaX - 1); }

  // ---------- Mensajes entre módulos ----------
  const oyentes = {};
  function on(evento, fn) { (oyentes[evento] = oyentes[evento] || []).push(fn); }
  function emit(evento, datos) {
    const l = oyentes[evento];
    if (!l) return;
    for (let i = 0; i < l.length; i++) l[i](datos);
  }

  // ---------- Utilidades ----------
  function limitar(v, a, b) { return v < a ? a : v > b ? b : v; }
  function mezcla(a, b, f) { return a + (b - a) * f; }
  // Interpola una tabla [[x, y], ...] ordenada por x (lineal; fuera del rango usa el extremo)
  function interp(tabla, x) {
    if (x <= tabla[0][0]) return tabla[0][1];
    const n = tabla.length;
    if (x >= tabla[n - 1][0]) return tabla[n - 1][1];
    let i = 1;
    while (tabla[i][0] < x) i++;
    const a = tabla[i - 1], b = tabla[i];
    return a[1] + (b[1] - a[1]) * (x - a[0]) / (b[0] - a[0]);
  }
  // Interpolación geométrica (para poblaciones y precios que crecen en proporción)
  function interpLog(tabla, x) {
    if (x <= tabla[0][0]) return tabla[0][1];
    const n = tabla.length;
    if (x >= tabla[n - 1][0]) return tabla[n - 1][1];
    let i = 1;
    while (tabla[i][0] < x) i++;
    const a = tabla[i - 1], b = tabla[i];
    if (a[1] <= 0 || b[1] <= 0) return a[1] + (b[1] - a[1]) * (x - a[0]) / (b[0] - a[0]);
    return a[1] * Math.pow(b[1] / a[1], (x - a[0]) / (b[0] - a[0]));
  }
  function esc(s) {
    return String(s === undefined || s === null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function sigId() { return ++nucleo.S.sigId; }
  function suma(lista, fn) {
    let s = 0;
    for (let i = 0; i < lista.length; i++) s += fn ? fn(lista[i], i) : lista[i];
    return s;
  }
  function copiar(obj) { return JSON.parse(JSON.stringify(obj)); }
  function redondear(v, dec) { const p = Math.pow(10, dec || 0); return Math.round(v * p) / p; }

  Object.assign(nucleo, {
    estadoNuevo: estadoNuevo, azar: azar, entero: entero, elegir: elegir, probabilidad: probabilidad,
    normal: normal, ponderado: ponderado, mezclar: mezclar, hash: hash, ruido: ruido,
    anio: anio, semana: semana, mes: mes, mesDeSemana: mesDeSemana, tDe: tDe,
    on: on, emit: emit,
    limitar: limitar, mezcla: mezcla, interp: interp, interpLog: interpLog, esc: esc, sigId: sigId,
    suma: suma, copiar: copiar, redondear: redondear,
  });
  return nucleo;
})();

    ayuda_obras: '<p><b>Crear obra</b> tiene tres caminos: <b>idea nueva</b>, <b>comprar un guion</b> ya escrito o <b>usar material</b> (82 obras de dominio público y derechos que se compran). Desde 2022 también hay <b>idea automática con IA</b>.</p><p>El <b>modo rápido</b> son 5 decisiones (géneros, historia y tono, producción y contenido, equipo, título) con <b>Recomendado</b> y dado. El <b>modo detallado</b> tiene todas las listas y los deslizadores: contenido (que decide la clasificación), duración, complejidad, ritmo, efectos, presupuesto, época e IA, más los personajes. Los totales se ven en vivo y el encaje entre familias se descubre usándolo.</p><p>La producción pasa por desarrollo, preproducción, rodaje y posproducción. Al final eliges la semana de estreno y el marketing.</p><p>La taquilla sale de personas: cada semana el público de cada región se reparte entre todas las obras en cartelera (tuyas, de los rivales y de otras productoras) y la opción de quedarse en casa. Si la obra decepciona frente a lo prometido, el boca a boca la hunde; si sorprende, dura más.</p><p><b>Cine a fondo (V19)</b>: en el modo detallado eliges <b>cómo se filma</b> (locación real, set, efectos prácticos, CGI desde 1973 o mixto), el <b>terreno</b> de la locación (ciudad, pradera, desierto, montaña, bosque, trópico, ártico o mar), el <b>país de rodaje</b> con su costo local e incentivos, si <b>reusas un set</b> guardado y el <b>estilo de producción</b> (cada uno lo aman unas edades y lo rechazan otras). En <b>Departamentos y presupuesto</b> repartes la plata entre arte, vestuario, efectos, cámara, música, edición y logística: cada departamento sale con su <b>nota de F a A+</b>.</p><p>Durante la producción pueden pasar cosas: <b>incidentes</b> (lluvia, una cámara rota, una buena racha) y <b>dilemas</b> que decides tú. Dos semanas antes de terminar se hace la <b>prueba de público</b>: estrenas así, pules, reeditas, regrabas escenas o apuras el estreno. La ficha de la obra muestra la <b>línea de producción</b>: el presupuesto acordado frente al costo real.</p><p><b>Plan de lanzamiento</b> (V20): vía (cines, directo a video desde 1980 o a streaming desde 2010), fecha con cuenta regresiva (anunciar con tiempo suma gente que se entera), modo por región (amplio, limitado, escalonado o retener «0»), doblaje por mercado, nivel de campaña y mezcla de canales con su alcance por edades, promociones (alfombra roja, comida, juguetes, coleccionables, ediciones exclusivas) y la expectativa frente a la calidad.</p><p>Después de los cines llegan las <b>ventanas</b> en orden: video (VHS, DVD, Blu-ray), TV y streaming, con sus certificaciones oro, platino y diamante. En tu <b>catálogo</b> puedes reestrenar, remasterizar o guardar en la bóveda.</p>',

IA.t = function (clave, vars) {
  const dic = IA.textos[IA.textos.idioma] || IA.textos.es;
  let s = dic[clave];
  if (s === undefined) s = IA.textos.es[clave];
  if (s === undefined) return clave;
  if (vars) Object.keys(vars).forEach(function (k) { s = s.split('{' + k + '}').join(String(vars[k])); });
  return s;
};

    if (dep === 'interprete') {
      const a = talentos(eq.int[0]), b = talentos(eq.int[1]);
      h = a && b ? hab(a) * 0.6 + hab(b) * 0.4 : a ? hab(a) : 35;
      // El resto del elenco contratado suma o resta según su nivel (hasta ±3)
      if (a && b && eq.int.length > 2) {
        let s = 0, n = 0;
        for (let i = 2; i < eq.int.length; i++) { const t = talentos(eq.int[i]); if (t) { s += hab(t); n++; } }
        if (n) h += N.limitar((s / n - 50) * 0.1, -3, 3);
      }
    } else {
      const t = talentos(eq[dep]);
      if (dep === 'vestuario' || dep === 'efectos' || dep === 'animacion') {
        // El diseñador de arte y tecnología está a cargo de estas áreas: con especialista o estudio externo,
        // su mano pesa un cuarto; sin ellos, se ocupa él solo y rinde un poco menos (V19-V20)
        const arte = talentos(eq.arte);
        const ha = arte ? IA.talentos.habilidadEn(arte, obra, 'arte') : 35;
        if (t) h = 0.75 * hab(t) + 0.25 * ha;
        else if (IA.rodaje.esExterno(obra, dep)) h = 0.75 * IA.rodaje.nivelExterno(obra, dep) + 0.25 * ha;
        else h = IA.rodaje.habilidadSinTalento(obra, dep, ha);
      } else h = t ? hab(t) : 35;
    }
    // Reparto del presupuesto, método, estilo, set, terreno y país (V19)
    return Math.min(100, h + (bonos[dep] || 0) + IA.rodaje.bonoDep(obra, dep));
  }
  // Calcula la calidad base sin azar (para mostrar estimaciones) y con azar al terminar la producción
  function calidadBase(obra, talentos, bonos) {
    const fam = D.familia(familiaPrincipal(obra));
    const anio = obra.anioPlan || N.anio();
    let q = 0;
    const pesos = IA.ideas.pesos(obra, fam); // prioridad y tipo de obra reparten el peso de los departamentos
    Object.keys(pesos).forEach(function (dep) { q += pesos[dep] * habilidadDep(obra, dep, talentos, bonos || {}); });
    // (las claves _crit y _pub de los bonos no son departamentos: se aplican en calificar)
    // Lo que cuesta la época, el formato o la animación no sube la calidad: solo el tamaño del presupuesto
    const tipica = produccionTipica(anio, fam.id) * escalaTono(obra) * IA.ideas.factorCosto(obra, anio);
    q += N.limitar(6 * Math.log2(Math.max(1, obra.pp) / tipica), -18, 12);
    q += encajeObra(obra);
    q += IA.ideas.ajusteCalidad(obra); // encaje de la idea, material, guion comprado, IA y personajes
    q += IA.talentos.quimica(obra); // amistades y rivalidades del equipo clave (V18)
    eachTalento(obra, talentos, function (t) { if (IA.talentos.ventajas(t).some(function (v) { return v.id === 'Mentor'; })) q += 0.5; });
    // Tres géneros sin un líder de 90 o más es un desastre
    if (obra.gen.length >= 3) {
      let mejor = 0;
      Object.keys(obra.eq).forEach(function (k) {
        const ids = Array.isArray(obra.eq[k]) ? obra.eq[k] : [obra.eq[k]];
        ids.forEach(function (id) { const t = talentos(id); if (t && t.hab > mejor) mejor = t.hab; });
      });
      if (mejor < 90) q -= 8;
    }
    // Rasgos del equipo (V15 TRA)
    let rq = 0;
    eachTalento(obra, talentos, function (t) { const r = D.rasgos[t.rasgo]; if (r) rq += r[0]; });
    q += rq / 3;
    return q;
  }
  function eachTalento(obra, talentos, fn) {
    Object.keys(obra.eq).forEach(function (k) {
      const ids = Array.isArray(obra.eq[k]) ? obra.eq[k] : [obra.eq[k]];
      ids.forEach(function (id) { const t = talentos(id); if (t) fn(t, k); });
    });
  }
  function escalaTono(obra) { const to = D.tonos.filter(function (x) { return x.id === obra.tono; })[0]; return to && to.costo ? to.costo : 1; }
  function famaEstrellas(obra, talentos) {
    const a = talentos(obra.eq.int[0]), b = talentos(obra.eq.int[1]);
    // La personalidad empuja la popularidad (Normal = 50 % es la referencia): Rockstar suma, Pretencioso resta
    const fp = function (t) { return t.fama * (1 + 0.3 * IA.talentos.impulso(t)); };
    let f = (a ? fp(a) * 0.6 : 0) + (b ? fp(b) * 0.4 : 0);
    // Invitados especiales y cameos (V17): su fama atrae público
    (obra.eq.inv || []).forEach(function (id) { const t = talentos(id); if (t) f += t.fama * 0.25; });
    (obra.eq.cam || []).forEach(function (id) { const t = talentos(id); if (t) f += t.fama * 0.1; });
    return Math.min(1.2, f);
  }
  function famaEstrellasRegion(obra, talentos, reg) {
    const a = talentos(obra.eq.int[0]), b = talentos(obra.eq.int[1]);
    const fp = function (t) { return IA.talentos.famaRegion(t, reg) * (1 + 0.3 * IA.talentos.impulso(t)); };
    let f = (a ? fp(a) * 0.6 : 0) + (b ? fp(b) * 0.4 : 0);
    (obra.eq.inv || []).forEach(function (id) { const t = talentos(id); if (t) f += IA.talentos.famaRegion(t, reg) * 0.25; });
    (obra.eq.cam || []).forEach(function (id) { const t = talentos(id); if (t) f += IA.talentos.famaRegion(t, reg) * 0.1; });
    return Math.min(1.2, f);
  }
  // Notas finales al terminar la posproducción (con el azar acotado de ±4)
  function calificar(obra, talentos, bonos) {
    const fam = D.familia(familiaPrincipal(obra));
    const to = D.tonos.filter(function (x) { return x.id === obra.tono; })[0] || { crit: 0, pub: 0 };
    let q = calidadBase(obra, talentos, bonos) + (N.azar() * 8 - 4);
    const r = IA.ideas.resultado(obra); // efectos aplaudidos o repudiados y el resultado de la IA (V17)
    q = N.limitar(q + r.q, 1, 99);
    const dir = talentos(obra.eq.direccion);
    const ex = IA.ideas.ajusteNotas(obra, obra.anioPlan || N.anio());
    // Ventajas ganadas con la experiencia: taquilleros y laureados (hasta +2 cada una)
    let vPub = 0, vCrit = 0;
    eachTalento(obra, talentos, function (t) { IA.talentos.ventajas(t).forEach(function (v) { if (v.id === 'Taquillero' || v.id === 'Regreso triunfal') vPub++; if (v.id === 'Laureado') vCrit++; }); });
    ex.pub += Math.min(2, vPub); ex.crit += Math.min(2, vCrit);
    // La belleza de los protagonistas pesa en el romance y la comedia
    const l1 = talentos(obra.eq.int[0]);
    if (l1 && l1.bel >= 80 && (fam.id === 'RD' || fam.id === 'HM')) ex.pub += 1;
    let crit = q + to.crit + (fam.inclina === 'crit' ? 3 : fam.inclina === 'pub' ? -2 : 0) + (dir && dir.hab >= 85 ? 2 : 0) + (N.azar() * 6 - 3) + ex.crit + r.crit;
    let pub = q + to.pub + (fam.inclina === 'pub' ? 3 : fam.inclina === 'crit' ? -3 : 0) + famaEstrellas(obra, talentos) * 4 + (N.azar() * 6 - 3) + ex.pub + r.pub;
    const esc = obra.pp / produccionTipica(obra.anioPlan || N.anio(), fam.id);
    if ((fam.id === 'AA' || fam.id === 'IM') && esc >= 1.8) pub += esc >= 3.5 ? 3 : 2; // efectos que el público disfruta
    // Visión y público objetivo del estudio (solo el jugador los tiene)
    if (bonos) { crit += bonos._crit || 0; pub += bonos._pub || 0; }
    // Lo que dejaron los dilemas e incidentes del rodaje (V19)
    q += obra.dq || 0; crit += (obra.dq || 0) + (obra.dcrit || 0); pub += (obra.dq || 0) + (obra.dpub || 0);
    obra.q = Math.round(q);
    obra.crit = Math.round(N.limitar(crit, 1, 99));
    obra.pub = Math.round(N.limitar(pub, 1, 99));
  }

  // ---------- Expectativa y marketing ----------
  // Conocimiento = 1 − Π(1 − Alcance de cada canal); Expectativa = Conocimiento × Deseo
  function canalesDe(anio) { return D.canales.filter(function (c) { return c.desde <= anio && c.hasta >= anio; }); }
  function alcanceMedio(anio) {
    const cs = canalesDe(anio);
    let p = 0, a = 0;
    cs.forEach(function (c) { p += c.peso; a += c.peso * c.alcance; });
    return p > 0 ? a / p : 0.8;
  }
  function conocimiento(obra, anio, famaEstudio, famaEst, bonoMarketing) {
    // V20: la cuenta regresiva y las promociones suman; la mezcla de canales hace rendir más (o menos) la campaña
    const base = N.limitar(0.06 + 0.25 * famaEstudio + 0.2 * famaEst + IA.ideas.bonoConocimiento(obra) + IA.estreno.bonoConocimiento(obra), 0.03, 0.65);
    const gasto = (obra.campana !== undefined ? obra.campana : obra.cm || 0) * (1 + (bonoMarketing || 0)) * IA.estreno.factorCampana(obra);
    const rel = gasto / Math.max(1, marketingTipico(anio));
    const resto = (1 - base) * Math.exp(-alcanceMedio(anio) * rel * 0.9);
    return N.limitar(1 - resto, 0.02, 0.995);
  }
  function deseo(obra, famaEst, tendencia) {
    const promesa = [0, 1, 2, 4, 6][obra.nivM || 0];
    return N.limitar(0.5 * obra.pub + 0.5 * 55 + promesa + famaEst * 8 + tendencia * 4, 1, 99);
  }

  // ---------- Atractivo por región (clasificación, edades, sede) ----------
  function accesoClasificacion(obra, reg, anio) {
    const d = datosAnio(anio).regiones[reg];
    const fam = D.familia(familiaPrincipal(obra));
    const cl = D.clasificacion(obra.clas) || D.clasificacion('PG-13');
    const ex = IA.ideas.edadesExtra(obra); // tipo de obra y público objetivo (V17)
    let s = 0;
    for (let g = 0; g < 5; g++) s += d.edades[g] * PROPENSION[g] * fam.edades[g] * cl.acceso[g] * cl.gusto[g] * (ex ? ex[g] : 1);
    return Math.max(0.02, s / d.baseEdad * IA.ideas.regionExtra(obra, reg, anio));
  }

  // ---------- Inicio del estreno ----------
  function iniciarCartelera(obra, ctx) {
    const anio = N.anio();
    const tend = N.S.mundo.tendencias[familiaPrincipal(obra)] || 0;
    const fe = famaEstrellas(obra, ctx.talento);
    obra.con = N.redondear(conocimiento(obra, anio, ctx.famaDe(obra.est), fe, ctx.bonoMarketingDe(obra.est)), 3);
    // El tráiler no siempre dice la verdad: la expectativa tiene su propio azar
    // La aprobación del público por la estrella principal (V18) también vende entradas
    const lider = ctx.talento(obra.eq.int[0]);
    const apr = lider && lider.apr !== undefined ? (lider.apr - 50) / 10 : 0;
    obra.des = Math.round(N.limitar(deseo(obra, fe, tend) + apr + (obra.ddes || 0) + IA.estreno.bonoDeseo(obra) + N.normal(0, 4), 1, 99));
    obra.crit = Math.round(N.limitar((obra.crit || 0) + IA.estreno.ajusteCritica(obra), 1, 99));
    // Parte de lo que gana esta obra que llegará por las ventanas (video, TV, streaming) y no por la taquilla
    obra.fv = N.redondear(IA.ventanas.parteVentanas(anio), 3);
    obra.exp = N.redondear(obra.con * obra.des / 100, 3);
    // El ánimo del público: algo que nadie controla hace que una obra prenda o no
    obra.animo = N.redondear(N.normal(0, P.ANIMO), 3);
    obra.u = N.redondear(P.AQ * (obra.des - 60) + Math.log(obra.con) + P.ESTRELLAS * fe + obra.animo, 4);
    // Fama por región (V18): las estrellas pesan más en su tierra y afuera según su alcance
    obra.feR = {};
    D.regiones.forEach(function (r) { obra.feR[r.id] = N.redondear(famaEstrellasRegion(obra, ctx.talento, r.id) - fe, 3); });
    obra.sc = 0; obra.bruto = obra.bruto || 0; obra.parte = obra.parte || 0; obra.ent = 0; obra.max = 0; obra.hs = [];
    obra.acc = {};
    D.regiones.forEach(function (r) { obra.acc[r.id] = N.redondear(accesoClasificacion(obra, r.id, anio), 4); });
    obra.delta = P.DELTA + (obra.fam === 'AA' ? 0.06 : obra.fam === 'DR' || obra.fam === 'AV' ? -0.06 : obra.fam === 'FJ' ? -0.04 : 0);
  }

  // ---------- Semana de cartelera ----------
  // Reparte el público de cada región entre las obras en cartelera, las otras productoras y quedarse en casa.
  function semanaCartelera(obras, ctx) {
    const S = N.S, anio = N.anio(), sem = N.semana();
    const da = datosAnio(anio);
    const tendencias = S.mundo.tendencias;
    // Otras productoras: las películas del mundo que no simulamos una por una
    const estrenosSim = Math.max(0, S.mercado.estrenos52 || 0);
    const otras = Math.max(da.peliculas * 0.3, da.peliculas - estrenosSim);
    const uTipica = P.U_TIPICA;
    const vidaTipica = 1 / (1 - Math.exp(-P.DELTA));
    const pesoOtras = otras * Math.exp(uTipica) * vidaTipica / 52;
    const pesoTipicoTotal = da.peliculas * Math.exp(uTipica) * vidaTipica / 52;
    const pesoCasa = pesoTipicoTotal * (1 / P.PARTICIPACION - 1) * (1 + 0.3 * M.ocioEnCasa(anio));
    const res = { bruto: 0, brutoOtras: 0, porEstudio: {}, entradas: 0 };
    D.regiones.forEach(function (r) {
      const dr = da.regiones[r.id];
      if (dr.publico <= 0) return;
      const mercado = dr.publico / 52 * M.temporada(r.id, sem);
      const pesos = [];
      let suma = pesoOtras + pesoCasa;
      // Las festividades reparten el público entre familias (cuánta gente va al cine ya lo da la temporada)
      let mediaFest = 0;
      D.familias.forEach(function (f) { mediaFest += M.bonoRegion(f.id, r.id, sem, anio); });
      mediaFest /= D.familias.length;
      for (let i = 0; i < obras.length; i++) {
        const o = obras[i];
        let u = o.u + Math.log(o.acc[r.id] || 0.02) + P.TENDENCIA * (tendencias[o.fam] || 0) + Math.log(M.bonoGenero(o.fam, sem));
        // Festividades y olas de la región (V20)
        u += Math.log(M.bonoRegion(o.fam, r.id, sem, anio) / mediaFest) + P.TENDENCIA * 0.6 * M.tendenciaRegion(r.id, o.fam);

        if (o.feR) u += P.ESTRELLAS * (o.feR[r.id] || 0);
        // Plan de estreno (V20): modo en la región, doblaje, cadenas con contrato y cines propios
        const w = Math.exp(u) * IA.estreno.factorRegion(o, r.id, o.sc);
        pesos.push(w);
        suma += w;
      }
      for (let i = 0; i < obras.length; i++) {
        const ent = mercado * pesos[i] / suma;
        const g = ent * dr.precio;
        const o = obras[i];
        o._g = (o._g || 0) + g;
        o._e = (o._e || 0) + ent;
        o._p = (o._p || 0) + g * Math.min(0.95, parteEstudio(o.sc + 1) + IA.estreno.parteExtra(o, r.id));
      }
      const gOtras = mercado * pesoOtras / suma * dr.precio;
      res.brutoOtras += gOtras;
    });
    for (let i = 0; i < obras.length; i++) {
      const o = obras[i];
      const g = o._g || 0, e = o._e || 0;
      // Desde que hay ventanas, una parte de lo que gana el estudio llega después (video, TV, streaming)
      const parte = (o._p || 0) * (1 - (o.fv || 0));
      delete o._g; delete o._e; delete o._p;
      o.sc += 1;
      o.bruto += g; o.parte += parte; o.ent += e;

      o.hs.push(Math.round(g));

      res.entradas += e;
      res.porEstudio[o.est] = (res.porEstudio[o.est] || 0) + g;
      ctx.cobrar(o, parte, g);
      // Boca a boca: si la obra decepciona frente a lo prometido cae rápido; si sorprende, dura
      o.u = N.redondear(o.u - o.delta + P.BETA * (o.pub - o.des), 4);
      const minimo = IA.estreno.semanasMinimas(o);
      if (o.sc >= P.MAX_SEMANAS || (o.sc >= Math.max(2, minimo) && g < o.max * P.CORTE) || (o.sc >= Math.max(1, minimo) && g < 1 && !esperaRegion(o))) ctx.terminar(o);
    }
    res.bruto += res.brutoOtras;

  }

  // Una obra con estreno escalonado no se baja mientras espera llegar a alguna región
  function esperaRegion(o) {
    if (!o.plan || !o.plan.reg) return false;

  // ---------- Pronóstico (sin gastar azar): para la interfaz y el bot ----------
  // Con la región de la sede, sus temporadas y festividades pesan el doble (V20)
  function pronosticoSemana(semanaX, famId, regCasa) {
    const regs = D.regiones, anio = N.S ? N.anio() : 2000;
    let t = 0, w = 0;
    regs.forEach(function (r) { const k = r.id === regCasa ? 2 : 1; t += k * M.temporada(r.id, semanaX) * M.bonoRegion(famId, r.id, semanaX, anio); w += k; });
    return (t / w) * M.bonoGenero(famId, semanaX);
  }

  return {
    P: P, PROPENSION: PROPENSION, datosAnio: datosAnio, presupuestoTipico: presupuestoTipico, tipicoSuavizado: tipicoSuavizado,
    presupuestoTipico2025: presupuestoTipico2025, produccionTipica: produccionTipica, marketingTipico: marketingTipico,
    parteEstudio: parteEstudio, tarifa: tarifa, demanda: demandaTalento, familiaPrincipal: familiaPrincipal, familiasDe: familiasDe,
    encajeObra: encajeObra, calidadBase: calidadBase, calificar: calificar, famaEstrellas: famaEstrellas, habilidadDep: habilidadDep,
    canalesDe: canalesDe, conocimiento: conocimiento, deseo: deseo, accesoClasificacion: accesoClasificacion,

})();

/* ==== módulo: talentos ==== */
// Talentos 2.0 (V18): más de 1.000 personas inventadas con biografía, país, idiomas, edad y sexo; habilidad por
// oficio y oficios secundarios, desempeño por familia de géneros, capacidades (excelencia, creatividad,
// inteligencia, liderazgo y paciencia), especialidad por medio, belleza, aprobación del público y papeles
// recomendados, clasificaciones que aceptan, rasgo de personalidad, fama por región, energía (−20 por cargo,
// +10 al mes) y moral, relaciones (amistad, rivalidad, pareja), negociación, contratos exclusivos, academia,
// promesas que se descubren y ciclo de vida (niños actores, retiro entre 70 y 100 con regresos, muerte poco
// probable). La tarifa sale del mercado (economia.tarifa). Los que no trabajan se actualizan una vez al año.
IA.talentos = (function () {
  'use strict';
  const N = IA.n, D = IA.datos;
  const PESO_REGION = { nam: 0.28, eur: 0.25, asi: 0.2, lat: 0.14, afr: 0.08, oce: 0.05 };
  const CAPACIDADES = ['Excelencia', 'Creatividad', 'Inteligencia', 'Liderazgo', 'Paciencia'];
  const EJES = ['Acción', 'Imaginación', 'Suspenso', 'Drama', 'Humor', 'Familia', 'Arte', 'Romance']; // = D.ORDEN_FAM
  const MEDIOS = ['cine', 'tv', 'musica', 'juegos', 'teatro', 'libros'];
  const ENERGIA_CARGO = 20, ENERGIA_MES = 10, MAX_PROYECTOS = 2; // tu documento: casi siempre en 2 proyectos a la vez
  const MAX_ACADEMIA = 5; // hasta +5 de experiencia por estudios en cada oficio (tu documento)
  let indice = null; // id -> talento (se reconstruye al cargar)
  let porOficio = null; // oficio -> talentos en el mismo orden de la lista (para buscar rápido)

  function reindexar() {
    indice = {};

  }

  }
  function elegirPais(reg) {

  function nombreNuevo(reg, sx) {

  }
  // Crecen hasta su pico y después cambian según el oficio (los directores y guionistas maduran más tarde)
  const CURVA = {
    interprete: [35, 55, 0.8], guion: [45, 70, 0.6], direccion: [45, 70, 0.6], produccion: [48, 72, 0.5],
    fotografia: [42, 66, 0.7], musica: [40, 70, 0.6], edicion: [40, 66, 0.7], arte: [40, 66, 0.7],
    vestuario: [40, 68, 0.6], efectos: [36, 60, 0.9], animacion: [34, 62, 0.8],

  function curva(of) { return CURVA[of] || [40, 66, 0.8]; }

  function habilidadPorEdad(pot, edad, of) {
    const c = curva(of);

    if (edad < c[0]) return pot * (0.55 + 0.45 * N.limitar((edad - inicio) / (c[0] - inicio), 0, 1));

  }
  // Idiomas: el de su país (y a veces el inglés o un tercero)

  // ---------- Después del estreno: fama, moral, alcance, relaciones e historial ----------

  // ---------- Encaje: suma o resta, y el jugador lo descubre usando cada combinación ----------

  // ---------- Costo y semanas ----------

  // ---------- Derechos de material y guiones ----------
  function reglaDominio() { return N.S && N.S.reglaDominio ? N.S.reglaDominio : X.REGLA_DOMINIO; }

  // ---------- Ideas automáticas (recomendado, dado e IA) ----------

/* ==== módulo: produccion ==== */
// Etapas de la obra: desarrollo, preproducción, rodaje y posproducción, con su costo semana a semana.
// El productor, el liderazgo y la excelencia del director y del diseñador (tu documento), la experiencia y los
// rasgos del equipo controlan el sobrecosto. V19: cada semana puede pasar algo (incidentes) o surgir un dilema que
// decides tú; dos semanas antes de terminar se hace la prueba de público; la línea de producción compara el
// presupuesto acordado con el costo real y el set nuevo se guarda para otras obras (todo en IA.rodaje).
IA.produccion = (function () {
  'use strict';
  const N = IA.n, T = IA.talentos, O = IA.obras, E = IA.economia;
  const SIGUIENTE = { desarrollo: 'preproduccion', preproduccion: 'rodaje', rodaje: 'posproduccion', posproduccion: 'lista' };

  // Arranca una obra: paga los contratos, reserva al equipo y fija duraciones y sobrecosto
  function iniciar(b, ctx) {
    const o = O.crear(b);
    o.dur = O.duraciones(o, ctx.rapidez);
    o.sr = o.dur.desarrollo;
    o.semProd = o.dur.preproduccion + o.dur.rodaje + o.dur.posproduccion;
    // Sobrecosto: el productor con buena habilidad lo controla; ciertos rasgos lo empeoran
    const prod = T.porId(o.eq.produccion);
    let riesgo = 0.04 - (prod ? (prod.hab - 50) / 900 : 0);
    // Director y diseñador: con liderazgo y excelencia altos el presupuesto se mantiene o sale más barato
    const lid = [o.eq.direccion, o.eq.arte].map(T.porId).filter(Boolean).map(function (t) { return (T.capacidad(t, 'Liderazgo') + T.capacidad(t, 'Excelencia')) / 2; });
    if (lid.length) riesgo -= (lid.reduce(function (a, x) { return a + x; }, 0) / lid.length - 60) / 1500;
    let veteranos = 0;
    O.idsEquipo(o).forEach(function (id) {
      const t = T.porId(id);
      const r = t && IA.datos.rasgos[t.rasgo];
      if (r) riesgo += r[1] / 3;
      if (t && t.obras >= 15) veteranos++;
    });
    riesgo -= Math.min(0.02, veteranos * 0.005);
    o.sobre = N.redondear(N.limitar(1 + N.normal(riesgo, 0.05), 0.92, 1.3), 3);
    o.pp = Math.round(o.pp * (1 - (ctx.ahorro || 0)));
    const total = o.dur.desarrollo + o.semProd;
    if (o.est === 0) IA.rodaje.iniciarLinea(o);
    const ids = O.idsEquipo(o);
    // Cada cargo cobra 20 de energía; quien llega cansado rinde menos en esta obra
    T.ocupar(ids, N.S.t + total);
    const fat = T.cansancio(ids);
    if (fat) o.fat = fat;
    ctx.pagar(o.est, 'talento', o.cf);
    ids.forEach(function (id) {
      const t = T.porId(id);
      if (!t) return;
      const parte = (o.eq.cam || []).indexOf(id) >= 0 ? O.PARTE_CAMEO : (o.eq.inv || []).indexOf(id) >= 0 ? O.PARTE_INVITADO : (o.pj || []).some(function (p) { return p.t === id && p.i === 'secundario'; }) ? O.PARTE_SECUNDARIO : 1;
      T.pagarA(id, T.salarioCon(T.tarifaPara(t, o.est), o.pctT && o.pctT[id] || 0) * parte);
    });
    N.emit('obraIniciada', o);
    return o;
  }
  // Una semana de producción para todas las obras en marcha
  function semana(ctx) {
    const R = IA.rodaje;
    const lista = O.activas().slice();
    for (let i = 0; i < lista.length; i++) {
      const o = lista[i];
      if (!SIGUIENTE[o.et]) continue;
      // Una decisión pendiente detiene la obra (sin gastar); sin respuesta, el equipo hace lo más prudente
      if (o.dil) {
        if (!R.vencido(o)) continue;
        const x = R.dilemaDe(o);
        const def = x ? Math.max(0, x.d.ops.map(function (op) { return !!op.def; }).indexOf(true)) : 0;
        R.decidir(o, def, ctx);
        N.emit('noticia', { tipo: 'estudio', texto: '«' + o.tit + '»: como no decidiste, el equipo eligió «' + (x ? x.d.ops[def].t.toLowerCase() : 'lo prudente') + '».' });
      }
      if (o.prueba && !o.prueba.ok) {
        if (!R.pruebaVencida(o)) continue;
        R.decidirPrueba(o, 'estrenar', ctx);
      }
      if (o.et !== 'desarrollo') {
        const costo = R.costoSemana(o);
        o.gp = (o.gp || 0) + costo;
        ctx.pagar(o.est, 'produccion', costo);
        R.sumarGasto(o, costo);
        R.semanaObra(o, ctx);
        if (o.dil) continue; // el dilema se decide antes de seguir
      }
      o.sr--;
      // Prueba de público: dos semanas antes del final de la posproducción (solo tus obras)
      if (o.et === 'posproduccion' && o.est === 0 && !o.prueba && (o.sr === 2 || (o.sr === 1 && o.dur.posproduccion <= 2))) {
        E.calificar(o, T.porId, ctx.bonos(o.est, o.fam));
        o.calif = 1;
        R.hacerPrueba(o);
        continue;
      }
      if (o.sr > 0) continue;
      o.et = SIGUIENTE[o.et];
      if (o.et === 'lista') {
        o.gp = Math.round(o.gp);
        if (!o.calif) E.calificar(o, T.porId, ctx.bonos(o.est, o.fam));
        delete o.calif;
        if (o.est === 0) {
          const ns = R.notas(o);
          o.notas = {};
          ns.forEach(function (n) { o.notas[n.dep] = n.v; });
        }
        R.guardarSet(o); // también los rivales guardan sus sets (V20)
        o.tLista = N.S.t;
        T.liberar(O.idsEquipo(o));
        N.emit('obraLista', o);
      } else {
        o.sr = o.dur[o.et];
      }
    }
  }
  // Progreso total de 0 a 1 (para barras y el edificio)
  function progreso(o) {
    if (!o.dur) return 0;
    const orden = ['desarrollo', 'preproduccion', 'rodaje', 'posproduccion'];
    const k = orden.indexOf(o.et);
    if (k < 0) return 1;
    let hecho = 0, total = 0;
    orden.forEach(function (e, i) {
      total += o.dur[e];
      if (i < k) hecho += o.dur[e];
    });
    hecho += o.dur[o.et] - o.sr;
    return N.limitar(hecho / total, 0, 1);
  }
  function semanasRestantes(o) {
    if (!o.dur) return 0;
    const orden = ['desarrollo', 'preproduccion', 'rodaje', 'posproduccion'];
    const k = orden.indexOf(o.et);
    if (k < 0) return 0;
    let s = o.sr;
    for (let i = k + 1; i < orden.length; i++) s += o.dur[orden[i]];
    return s;
  }

  return { iniciar: iniciar, semana: semana, progreso: progreso, semanasRestantes: semanasRestantes };
})();

    { id: 'visita', etapa: 'rodaje', quien: [], txt: 'Una estrella visita el set y ofrece un cameo gratis.', ops: [

    { id: 'censura', etapa: 'posproduccion', quien: [], cond: function (o) { return X.ORDEN_CLAS.indexOf(o.clas) >= 3; }, txt: 'Los censores de algunas regiones piden cortar escenas.', ops: [
      { t: 'Cortarlas', crit: -1, def: 1 },

    { id: 'improvisa', etapa: 'rodaje', quien: ['a'], txt: '{a} improvisa una escena que no está en el guion.', ops: [
      { t: 'Dejarla en la película', azar: 0.55, bien: { q: 2 }, mal: { q: -1 } },
      { t: 'Filmar lo escrito', def: 1 }] },
  ];
  const INCIDENTES = [
    { id: 'lluvia', txt: 'La lluvia arruina varios días de rodaje: una semana más.', sem: 1, costo: 0.005, cond: function (o) { return o.met !== 'set' && o.met !== 'cgi'; } },
    { id: 'camara', txt: 'Se daña equipo de cámara: una semana perdida.', sem: 1, costo: 0.005 },
    { id: 'accidente', txt: 'Un accidente leve en el set detiene todo unos días.', sem: 1, costo: 0.015, moral: -4 },
    { id: 'incendio', txt: 'Un incendio en el set obliga a reconstruir una parte.', costo: 0.04, sem: 1, cond: function (o) { return o.met === 'set' || o.met === 'mixto' || !o.met; } },
    { id: 'huelga', txt: 'Huelga del equipo técnico: dos semanas perdidas.', sem: 2, costo: 0.01, cond: function () { return N.anio() >= 1933; } },
    { id: 'racha', txt: 'Todo sale mejor de lo pensado: terminan una semana antes.', sem: -1 },
    { id: 'magia', txt: 'El elenco tiene una química especial: las escenas brillan.', q: 1 },
  ];
  const OPCIONES_PRUEBA = [
    { id: 'estrenar', t: 'Estrenar así', texto: 'Sin cambios.' },
    { id: 'pulir', t: 'Pulir dos semanas', texto: '+1 al público y a la crítica (más con un buen editor); cuesta 2 semanas.', sem: 2, costo: 0.015 },
    { id: 'reeditar', t: 'Reeditar', texto: 'Un nuevo montaje: de −1 a +4 al público según el editor; 2 semanas.', sem: 2, costo: 0.025 },
    { id: 'regrabar', t: 'Regrabar escenas', texto: 'Vuelve el elenco: de +2 a +6 al público según dirección y reparto; 4 semanas y un 8 % más.', sem: 4, costo: 0.08 },
    { id: 'apurar', t: 'Estreno apurado', texto: 'Una semana menos (y su costo): −1 al público y a la crítica.', sem: -1 },
  ];

  // =====================================================================
  // REGLAS
  // =====================================================================
  function anio() { return N.anio(); }
  function porId(lista, id) { return lista.filter(function (x) { return x.id === id; })[0]; }
  function metodo(id) { return porId(METODOS, id) || METODOS[0]; }
  function terreno(id) { return porId(TERRENOS, id) || TERRENOS[0]; }
  function estilo(id) { return porId(ESTILOS, id) || ESTILOS[0]; }
  function externo(r, id) { return EXTERNOS[r] ? porId(EXTERNOS[r], id) : null; }
  function letra(v) { for (let i = 0; i < LETRAS.length; i++) if (v >= LETRAS[i][0]) return LETRAS[i][1]; return 'F'; }
  function fam(o) { return o.fam || D.familiaDe[o.gen[0]] || 'DR'; }
  function animada(o) { return o.tipo === 'animacion' || o.tipo === 'hibrido'; }

  // ---------- Roles nuevos: quién los necesita ----------
  // Vestuario siempre ayuda; efectos cuando hay efectos de verdad; animación en las obras animadas (sin
  // supervisor de efectos o diseñador de vestuario, el diseñador de arte se ocupa y rinde un poco menos)
  function necesita(o, r) {
    if (r === 'vestuario') return o.tipo !== 'animacion' && o.tipo !== 'documental';
    if (r === 'efectos') return IA.ideas.nivelEfectos(o) >= 3 || o.met === 'cgi' || o.met === 'practicos' || o.pst === 'espectaculo' || o.pst === 'virtual';
    if (r === 'animacion') return animada(o);
    return true;
  }
  function esExterno(o, r) { return !!(o.ext && o.ext[r] && externo(r, o.ext[r])); }
  function nivelExterno(o, r) {
    const e = externo(r, o.ext[r]);
    // Los estudios externos mejoran con los años (técnica y herramientas)
    return e ? e.nivel + N.limitar((anio() - e.desde) / 25, 0, 6) : 35;
  }
  function externosDisponibles(r, a) { return (EXTERNOS[r] || []).filter(function (e) { return e.desde <= a; }); }

  // ---------- Pesos de los departamentos en la calidad ----------
  // Recibe el reparto de los 8 departamentos clásicos (ya normalizado) y suma vestuario, efectos y animación
  function pesosDep(o, r) {
    const p = Object.assign({}, r);
    const f = fam(o);
    const quitar = function (k, x) { const v = Math.min(p[k] || 0, x); p[k] = (p[k] || 0) - v; return v; };
    // Vestuario: más en las épocas pasadas o futuras
    if (o.tipo !== 'documental') {
      let wv = PESO_VESTUARIO[f] * (o.epo && o.epo !== 'actualidad' ? 1.6 : 1) * (o.tipo === 'animacion' ? 0.3 : 1);
      p.vestuario = quitar('arte', wv / 2) + quitar('interprete', wv / 2);
    }
    // Efectos: una parte del arte, según cuántos efectos lleve y cómo se filme
    let pe = PARTE_EFECTOS[N.limitar(IA.ideas.nivelEfectos(o), 0, 4)] * (o.met === 'cgi' || o.met === 'practicos' ? 1.3 : 1);
    p.efectos = quitar('arte', (p.arte || 0) * Math.min(0.7, pe));
    // Animación: reemplaza parte de la actuación y la imagen
    if (o.tipo === 'animacion') p.animacion = quitar('interprete', (p.interprete || 0) * 0.55) + quitar('fotografia', (p.fotografia || 0) * 0.6) + quitar('arte', (p.arte || 0) * 0.3);
    else if (o.tipo === 'hibrido') p.animacion = quitar('interprete', (p.interprete || 0) * 0.2) + quitar('fotografia', (p.fotografia || 0) * 0.2) + quitar('arte', (p.arte || 0) * 0.25);
    let s = 0;
    Object.keys(p).forEach(function (k) { s += p[k]; });
    Object.keys(p).forEach(function (k) { p[k] = p[k] / s; });
    return p;
  }
  // Habilidad del departamento cuando no hay talento propio: estudio externo o el diseñador de arte
  function habilidadSinTalento(o, dep, habArte) {
    if (esExterno(o, dep)) return nivelExterno(o, dep);
    if (dep === 'vestuario') return habArte * 0.85;
    if (dep === 'efectos') return habArte * 0.8;
    if (dep === 'animacion') return 25;
    return 35;
  }

  // ---------- Reparto del presupuesto ----------
  function depsDe(o) {
    return DEPS.filter(function (d) { return d.id !== 'animacion' || animada(o); }).map(function (d) { return d.id; });
  }
  function ideal(o) {
    const base = IDEAL[fam(o)] || IDEAL.DR;
    const r = {};
    depsDe(o).forEach(function (k) { r[k] = base[k] || 0; });
    const fx = IA.ideas.nivelEfectos(o);
    r.efectos *= [0.2, 0.5, 1, 1.7, 2.4][N.limitar(fx, 0, 4)];
    if (o.epo && o.epo !== 'actualidad') { r.vestuario *= 1.6; r.arte *= 1.25; }
    if (o.tipo === 'animacion') { r.animacion = 0.45; r.fotografia *= 0.4; r.vestuario *= 0.3; r.produccion *= 0.5; }
    else if (o.tipo === 'hibrido') r.animacion = 0.2;
    if (o.tipo === 'documental') { r.arte *= 0.5; r.efectos *= 0.3; r.edicion *= 1.5; }
    if (o.met === 'cgi') { r.efectos *= 1.4; r.arte *= 0.8; }
    if (o.met === 'locacion') { r.produccion *= 1.2; r.arte *= 0.8; }
    if (o.met === 'set') r.arte *= 1.2;
    if (o.met === 'practicos') r.efectos *= 1.2;
    let s = 0;
    Object.keys(r).forEach(function (k) { s += r[k]; });
    Object.keys(r).forEach(function (k) { r[k] = N.redondear(r[k] / s, 4); });
    return r;
  }
  // El reparto que eligió el jugador (normalizado); si no lo tocó, el ideal
  function reparto(o) {
    const id = ideal(o);
    if (!o.rep) return id;
    const r = {};
    let s = 0;
    Object.keys(id).forEach(function (k) { r[k] = Math.max(0, o.rep[k] !== undefined ? o.rep[k] : id[k]); s += r[k]; });
    Object.keys(r).forEach(function (k) { r[k] = s > 0 ? r[k] / s : id[k]; });
    return r;
  }
  function efectoReparto(o, dep) {
    if (!o.rep) return 0;
    const id = ideal(o), r = reparto(o);
    if (id[dep] === undefined || id[dep] < 0.005) return 0;
    return N.limitar(5 * Math.log2(Math.max(0.05, r[dep]) / id[dep]), -10, 3);
  }

  // ---------- Bonos por departamento (método, estilo, set, terreno, país) ----------
  function setDe(o) {
    const est = N.S && N.S.estudios[o.est || 0];
    return o.setR && est && est.sets ? est.sets.filter(function (s) { return s.id === o.setR; })[0] : null;
  }
  function bonoDep(o, dep) {
    let b = efectoReparto(o, dep);
    const m = metodo(o.met);
    if (m.dep && m.dep[dep]) b += m.dep[dep];
    const es = estilo(o.pst);
    if (es.dep && es.dep[dep]) b += es.dep[dep];
    if (dep === 'direccion' && es.min) {
      const d = IA.talentos.porId(o.eq && o.eq.direccion);
      if (!d || d.hab < es.min) b -= 4;
    }
    if (dep === 'efectos' && o.met === 'cgi' && (o.anioPlan || anio()) < 1993) b -= 3;
    if (dep === 'arte') {
      const s = setDe(o);
      if (s) b += N.limitar((s.q - 60) / 8, -3, 3);
    }
    if (dep === 'fotografia' && usaLocacion(o) && terrenoPropio(o)) b += 1;
    if ((dep === 'produccion' || dep === 'fotografia') && o.rod && INDUSTRIA.indexOf(o.rod) < 0) b -= dep === 'produccion' ? 2 : 1;
    return b;
  }
  function usaLocacion(o) { return o.met === 'locacion' || o.met === 'mixto' || !o.met; }
  function usaSet(o) { return (o.met === 'set' || o.met === 'mixto' || !o.met) && o.tipo !== 'animacion' && o.tipo !== 'documental'; }
  function terrenoPropio(o) {
    const est = N.S && N.S.estudios[o.est || 0];
    if (!est || !est.terrenos || !o.ter) return false;
    return est.terrenos.some(function (id) { const t = D.terrenos.filter(function (x) { return x.id === id; })[0]; return t && t.terreno === o.ter; });
  }

  // ---------- Costo y semanas ----------
  function costoCGI(a) { return a < 1993 ? 1.25 : a < 2006 ? 1.12 : a < 2020 ? 1 : 0.95; }
  function incentivo(o, a) {
    const i = o.rod && INCENTIVOS[o.rod];
    return i && a >= i[0] ? i[1] : 0;
  }
  function viaje(o) {
    if (!o.rod) return false;
    const est = N.S && N.S.estudios[o.est || 0];
    const p = D.pais(o.rod), casa = est ? D.pais(est.pais) : null;
    return !!(p && casa && p.region !== casa.region);
  }
  function factorCosto(o, a) {
    let f = 1;
    const m = metodo(o.met);
    f *= o.met === 'cgi' ? m.costo * costoCGI(a) : m.costo;
    if (usaLocacion(o) && o.ter) {
      const tr = terreno(o.ter);
      let x = o.met === 'locacion' ? tr.costo : 1 + (tr.costo - 1) / 2;
      if (terrenoPropio(o)) x *= o.met === 'locacion' ? 0.9 : 0.95;
      f *= x;
    }
    f *= estilo(o.pst).costo;
    if (usaSet(o) && o.met) f *= setDe(o) ? 0.93 : 1; // reusar un set guardado ahorra
    if (viaje(o)) f *= 1.03;
    f *= 1 - incentivo(o, a);
    ['efectos', 'animacion'].forEach(function (r) { if (esExterno(o, r) && necesita(o, r)) f *= 1 + externo(r, o.ext[r]).costo; });
    return f;
  }
  function ajusteSemanas(o) {
    const r = { pre: 0, rodaje: 0, pos: 0 };
    if (usaSet(o) && o.met) { if (setDe(o)) r.pre -= 1; else if (o.met === 'set') r.pre += 1; }
    if (viaje(o)) r.pre += 1;
    if (o.pst === 'plano') r.rodaje += 1;
    if (o.met === 'practicos') r.rodaje += 1;
    if (o.met === 'locacion' && terrenoPropio(o)) r.rodaje -= 1;
    if (o.met === 'locacion' && (o.ter === 'artico' || o.ter === 'mar')) r.rodaje += 1;
    if (o.met === 'cgi') r.pos += 1;
    if (o.pst === 'virtual') r.pos -= 1;
    return r;
  }

  // ---------- Crítica, público y edades ----------
  function ajusteNotas(o, a) {
    let crit = 0, pub = 0;
    const es = estilo(o.pst);
    crit += es.crit; pub += es.pub;
    if (es.familias) pub += es.familias.indexOf(fam(o)) >= 0 ? 2 : -1;
    const f = fam(o);
    if (o.met === 'locacion' && (f === 'DR' || f === 'AV' || o.nat === 'r')) crit += 1;
    if (o.met === 'practicos' && a >= 2000) crit += 1;
    if (o.met === 'cgi' && a < 1993) pub -= 2;
    if (o.met === 'cgi' && a >= 2015 && IA.ideas.nivelEfectos(o) >= 3) crit -= 1;
    if (usaLocacion(o) && o.ter && terreno(o.ter).generos.some(function (g) { return o.gen.indexOf(g) >= 0; })) pub += 1;
    const s = setDe(o);
    if (s && s.usos >= 3) pub -= 1; // el público ya reconoce el set
    return { crit: crit, pub: pub };
  }
  function edades(o) {
    const es = estilo(o.pst);
    if (!es.ama.length && !es.rechaza.length) return null;
    const r = [1, 1, 1, 1, 1];
    es.ama.forEach(function (i) { r[i] *= 1.08; });
    es.rechaza.forEach(function (i) { r[i] *= 0.9; });
    return r;
  }

  // ---------- Notas de los departamentos ----------
  function notas(o, bonos) {
    const famObj = D.familia(fam(o));
    const p = IA.ideas.pesos(o, famObj);
    const b = bonos || (IA.negocio ? IA.negocio.bonos(o.est || 0, fam(o)) : {});
    return Object.keys(p).filter(function (k) { return p[k] >= 0.01; }).sort(function (x, y) { return p[y] - p[x]; }).map(function (k) {
      const v = Math.round(IA.economia.habilidadDep(o, k, IA.talentos.porId, b));
      return { dep: k, nombre: nombreDep(k), peso: p[k], v: v, letra: letra(v) };
    });
  }
  function nombreDep(k) {
    if (k === 'interprete') return 'Actuación';
    if (k === 'guion') return 'Guion';
    if (k === 'direccion') return 'Dirección';
    if (k === 'produccion') return 'Producción';
    const d = porId(DEPS, k);
    return d ? d.nombre : D.oficio(k).dep;
  }

  // ---------- Recomendaciones ----------
  function metodoRecomendado(o, a) {
    const f = fam(o), fx = IA.ideas.nivelEfectos(o);
    if (o.tipo === 'animacion') return 'set';
    if ((f === 'AA' || f === 'IM') && fx >= 3) return a >= 1995 ? 'cgi' : 'practicos';
    if (f === 'DR' || f === 'AV' || f === 'RD' || o.nat === 'r') return 'locacion';
    if (f === 'SM' || f === 'HM' || f === 'FJ') return 'set';
    return 'mixto';
  }
  function terrenoRecomendado(o) {
    const t = TERRENOS.filter(function (x) { return x.generos.some(function (g) { return o.gen.indexOf(g) >= 0; }); })[0];
    return t ? t.id : 'ciudad';
  }
  function metodosDisponibles(a) { return METODOS.filter(function (m) { return m.desde <= a; }); }
  function estilosDisponibles(a) { return ESTILOS.filter(function (e) { return e.desde <= a; }); }

  // ---------- Sets reutilizables ----------
  function tipoSet(o) { return SETS.filter(function (s) { return s.si(o); })[0]; }
  function setsQueSirven(o) {
    const est = N.S.estudios[o.est || 0];
    const tp = tipoSet(o);
    return (est.sets || []).filter(function (s) { return s.tipo === tp.id; }).sort(function (a, b) { return b.q - a.q; });
  }
  function capacidadSets(estId) {
    const est = N.S.estudios[estId || 0];
    if (estId) return 2 + Math.round(2 * (est.tam || 1)); // los rivales ya tienen sus backlots
    const c = function (id) { return est.pisos.concat(est.terrenos).filter(function (x) { return x === id; }).length; };
    return 1 + c('plato') + 3 * c('backlot');
  }
  // Al quedar lista la obra: el set nuevo se guarda (con la nota del arte) y el reutilizado se gasta un poco
  function guardarSet(o) {
    if (!usaSet(o) || !o.met) return;
    const est = N.S.estudios[o.est || 0];
    est.sets = est.sets || [];
    const usado = setDe(o);
    if (usado) { usado.usos++; usado.q = Math.max(30, usado.q - 2); usado.ult = anio(); return; }
    const tp = tipoSet(o);
    const arte = notas(o).filter(function (n) { return n.dep === 'arte'; })[0];
    est.sets.push({ id: N.sigId(), tipo: tp.id, nombre: tp.nombre, q: arte ? arte.v : 55, anio: anio(), usos: 0, obra: o.tit });
    while (est.sets.length > capacidadSets(o.est || 0)) {
      const viejo = est.sets.slice().sort(function (a, b) { return (a.q - (anio() - a.anio)) - (b.q - (anio() - b.anio)); })[0];
      est.sets = est.sets.filter(function (s) { return s !== viejo; });
      if (!o.est) N.emit('noticia', { tipo: 'estudio', texto: 'Desarmas el set «' + viejo.nombre + '» (de «' + viejo.obra + '») para hacer lugar.' });
    }
  }

  // =====================================================================
  // ETAPAS VIVAS: incidentes, dilemas, prueba de público y línea de producción
  // =====================================================================
  // Personas que pueden aparecer en un dilema
  function personas(o) {
    const T = IA.talentos;
    return { a: T.porId(o.eq.int && o.eq.int[0]), b: T.porId(o.eq.int && o.eq.int[1]), d: T.porId(o.eq.direccion), p: T.porId(o.eq.produccion), g: T.porId(o.eq.guion) };
  }
  function riesgo(o) {
    let r = metodo(o.met).riesgo;
    if (usaLocacion(o) && o.ter) r *= o.met === 'locacion' ? terreno(o.ter).riesgo : 1 + (terreno(o.ter).riesgo - 1) / 2;
    if (terrenoPropio(o)) r *= 0.7;
    const p = IA.talentos.porId(o.eq.produccion);
    if (p) r *= N.limitar(1 - (p.hab - 50) / 200, 0.7, 1.25);
    IA.obras.idsEquipo(o).forEach(function (id) { const t = IA.talentos.porId(id); if (t && (t.rasgo === 'Diva' || t.rasgo === 'Temperamental')) r *= 1.12; });
    return r;
  }
  function registrar(o, txt, costo, sem) {
    o.lp = o.lp || {};
    o.lp.ev = o.lp.ev || [];
    o.lp.ev.push({ t: N.S.t, txt: txt, c: Math.round(costo || 0), s: sem || 0 });
    if (o.lp.ev.length > 10) o.lp.ev.shift();
  }
  // Aplica los efectos de un incidente o de una opción
  function aplicar(o, ef, ctx, n, txt) {
    const T = IA.talentos;
    let costo = 0;
    if (ef.costo) {
      costo = Math.max(0, Math.round(o.pp * ef.costo));
      if (costo > 0) ctx.pagar(o.est, 'produccion', costo);

    let s = 0;
    cs.forEach(function (c) { s += Math.max(0, mix && mix[c.id] !== undefined ? mix[c.id] : c.peso); });
    if (s <= 0) return { alcance: 0.5, afinidad: 0, porEdad: [0, 0, 0, 0, 0], ef: 0.01 };
    const porEdad = [0, 0, 0, 0, 0];
    let alc = 0;
    cs.forEach(function (c) {
      const w = Math.max(0, mix && mix[c.id] !== undefined ? mix[c.id] : c.peso) / s;
      const k = Math.sqrt(w) * c.alcance;
      alc += k;
      for (let g = 0; g < 5; g++) porEdad[g] += k * c.edades[g];
    });
    const n = Math.sqrt(cs.length);
    let ef = 0;
    for (let g = 0; g < 5; g++) { porEdad[g] /= n; ef += t[g] * porEdad[g]; }
    const tot = porEdad.reduce(function (a, b) { return a + b; }, 0) || 1;
    return { alcance: alc / n, afinidad: N.limitar(ef / (tot / 5), 0, 2) / 2, porEdad: porEdad, ef: Math.max(0.01, ef) };
  }

  // ---------- El plan ----------
  // Plan de los rivales: amplio en todas partes, doblado y con la mezcla de siempre
  function planRival(o, anio) {
    const p = { reg: {}, dob: {}, mix: null, promo: [], via: 'cines', rival: 1 };
    D.regiones.forEach(function (r) { p.reg[r.id] = 'amplio'; if (necesitaDoblaje(o, r.id, anio)) p.dob[r.id] = 1; });
    return p;
  }
  function planPorDefecto(o, anio) {
    const p = { reg: {}, dob: {}, mix: mixRecomendado(o, anio), promo: [], via: 'cines' };
    D.regiones.forEach(function (r) { p.reg[r.id] = 'amplio'; if (necesitaDoblaje(o, r.id, anio)) p.dob[r.id] = 1; });
    return p;
  }
  function normalizar(o, plan, anio) {
    const p = plan || planPorDefecto(o, anio);
    p.reg = p.reg || {}; p.dob = p.dob || {}; p.promo = (p.promo || []).filter(function (id) { const x = promo(id); return x && x.desde <= anio; });
    D.regiones.forEach(function (r) { if (!p.reg[r.id]) p.reg[r.id] = 'amplio'; if (!necesitaDoblaje(o, r.id, anio)) delete p.dob[r.id]; });
    if (!p.mix && !p.rival) p.mix = mixRecomendado(o, anio);
    if (!p.via) p.via = 'cines';
    return p;
  }
  // Costo del plan: campaña repartida por región según su modo, doblajes y promociones
  function costos(o, plan, nivM, anio) {
    const p = normalizar(o, plan, anio);
    const base = E.marketingTipico(anio) * D.nivelesMarketing[nivM].mult;
    if (p.via !== 'cines') return { campana: Math.round(base * 0.3), doblaje: 0, promos: 0, total: Math.round(base * 0.3) };
    const pr = pesoRegiones(anio);
    let f = 0;
    D.regiones.forEach(function (r) { f += pr[r.id] * modo(p.reg[r.id]).mkt; });
    const campana = Math.round(base * f);
    const doblaje = Object.keys(p.dob).filter(function (k) { return p.reg[k] !== 'retener'; }).length * costoDoblaje(anio);
    const promos = Math.round(p.promo.reduce(function (s, id) { return s + promo(id).costo; }, 0) * E.marketingTipico(anio));
    return { campana: campana, doblaje: doblaje, promos: promos, total: campana + doblaje + promos };
  }

  // ---------- Efectos al estrenar (los usa la economía) ----------
  // Conocimiento extra por la cuenta regresiva (anunciar con tiempo arma expectativa) y por las promociones
  function bonoConocimiento(o) {
    const p = o.plan;
    if (!p) return 0;
    let b = Math.min(8, p.anuncio || 0) * 0.012 * (o.cm > 0 ? 1 : 0.3);
    if (p.promo && p.promo.indexOf('comida') >= 0) b += 0.05;
    return b;
  }
  // Frente a la mezcla de siempre (la de los rivales): apuntar a las edades de la obra rinde más
  function factorCampana(o) {
    const p = o.plan;
    if (!p || !p.mix) return 1;
    const a = o.anio || N.anio();
    const ev = evaluarMix(o, p.mix, a), ref = evaluarMix(o, null, a);
    return N.limitar(Math.pow(ev.ef / ref.ef, 4), 0.6, 1.25);
  }
  function bonoDeseo(o) {
    const p = o.plan;
    if (!p || !p.promo) return 0;
    let d = 0;
    p.promo.forEach(function (id) {
      const x = promo(id);
      if (!x || !x.des) return;
      if (id === 'juguetes') d += ['FJ', 'IM', 'AA'].indexOf(o.fam) >= 0 ? 3 : x.des;
      else if (id === 'coleccionables') d += ['IM', 'AA', 'SM'].indexOf(o.fam) >= 0 ? x.des : 0;
      else d += x.des;
    });
    return d;
  }
  // La crítica también reacciona a las promociones
  function ajusteCritica(o) {
    const p = o.plan;
    if (!p || !p.promo) return 0;
    let c = 0;
    if (p.promo.indexOf('alfombra') >= 0 && o.pub >= 70) c += 1;
    if (p.promo.indexOf('comida') >= 0 && (o.fam === 'AV' || o.fam === 'DR')) c -= 1;
    return c;
  }
  // Peso de la obra en una región esa semana: modo de estreno, doblaje, cadenas con contrato y cines propios
  function factorRegion(o, reg, sc) {
    let f = 1;
    const p = o.plan;
    if (p) {
      const m = modo(p.reg && p.reg[reg]);
      if (m.id === 'retener') return 0;
      if (m.espera && sc < m.espera) return 0;
      if (m.id === 'limitado') f *= Math.min(1, m.salas + (o.pub >= 70 ? 0.08 * sc : 0));
      if (necesitaDoblaje(o, reg, o.anio || N.anio())) f *= p.dob && p.dob[reg] ? 1 : 0.9;
    }
    const est = N.S.estudios[o.est];
    const c = est && est.cad && est.cad[reg] && est.cad[reg].hasta > N.S.t ? cadena(est.cad[reg].id) : null;
    if (c) f *= 1 + 0.3 * c.salas;
    if (o.est === 0 && reg === est.reg) f *= 1 + 0.12 * cinesPropios();
    return f;
  }
  // Punto extra de lo que recibe el estudio en esa región (contrato con una cadena y cines propios)
  function parteExtra(o, reg) {
    const est = N.S.estudios[o.est];
    let x = 0;
    const c = est && est.cad && est.cad[reg] && est.cad[reg].hasta > N.S.t ? cadena(est.cad[reg].id) : null;
    if (c) x += c.parte;
    if (o.est === 0 && reg === est.reg) x += 0.12 * cinesPropios();
    return x;
  }
  // Semanas mínimas garantizadas por los contratos (la obra no sale antes de cartelera)
  function semanasMinimas(o) {
    const est = N.S.estudios[o.est];
    let m = 0;
    if (est && est.cad) Object.keys(est.cad).forEach(function (r) { const k = est.cad[r]; if (k.hasta > N.S.t) { const c = cadena(k.id); if (c && (!o.plan || o.plan.reg[r] !== 'retener')) m = Math.max(m, c.minimo); } });
    return m;
  }

  // ---------- Cadenas de cines con contrato y cines propios ----------
  function cinesPropios() { return Math.min(3, N.S.estudios[0].terrenos.filter(function (x) { return x === 'cine'; }).length); }
  function puedeFirmar(id, anios) {
    const c = cadena(id), est = N.S.estudios[0];
    if (!c) return 'Esa cadena no existe.';
    if (c.desde > N.anio()) return c.nombre + ' abre en ' + c.desde + '.';
    if (est.fama < c.fama) return c.nombre + ' solo firma con estudios más famosos (fama ' + Math.round(c.fama * 100) + ').';
    if (est.cad && est.cad[c.reg] && est.cad[c.reg].hasta > N.S.t) return 'Ya tienes contrato en esa región.';
    if (est.caja < costoCadena(c) * (anios || 1) / 4) return 'No alcanza la caja para el primer pago.';
    return '';
  }
  function costoCadena(c) { return Math.round(E.presupuestoTipico(N.anio()) * c.cuota); }
  function firmar(id, anios) {
    const err = puedeFirmar(id, anios);
    if (err) return err;
    const c = cadena(id), est = N.S.estudios[0];
    est.cad = est.cad || {};
    est.cad[c.reg] = { id: c.id, hasta: N.S.t + 52 * (anios || 1) };
    N.emit('noticia', { tipo: 'estudio', texto: 'Firmas con ' + c.nombre + ' (' + D.region(c.reg).nombre + ') por ' + (anios || 1) + ' año' + ((anios || 1) > 1 ? 's' : '') + '.' });
    return '';
  }
  function cancelar(reg) {
    const est = N.S.estudios[0];
    if (!est.cad || !est.cad[reg]) return 'No hay contrato en esa región.';
    delete est.cad[reg];
    return '';
  }
  // Cada mes: cuotas de los contratos y lo que dejan tus cines con las obras ajenas
  function mensual(ctx) {
    const S = N.S, est = S.estudios[0];
    if (est.cad) Object.keys(est.cad).forEach(function (r) {
      const k = est.cad[r], c = cadena(k.id);
      if (!c || k.hasta <= S.t) { if (c) N.emit('noticia', { tipo: 'estudio', texto: 'Termina tu contrato con ' + c.nombre + '.' }); delete est.cad[r]; return; }
      ctx.pagar(0, 'distribucion', costoCadena(c) / 12);
    });
    const n = cinesPropios();
    if (n && S.mercado.semana) {
      const da = E.datosAnio(N.anio()), tot = Object.keys(da.regiones).reduce(function (s, k) { return s + da.regiones[k].publico * da.regiones[k].precio; }, 0);
      const casa = da.regiones[est.reg] ? da.regiones[est.reg].publico * da.regiones[est.reg].precio : 0;
      // Tus salas cobran una parte de las entradas de las obras ajenas en tu región
      const g = (S.mercado.semana.bruto || 0) * (tot > 0 ? casa / tot : 0) * 0.012 * n * 4.33;
      if (g > 0) IA.negocio.cobrarEn(0, 'exhibicion', g);

  return {
    MODOS: MODOS, PROMOS: PROMOS, modo: modo, promo: promo, promosDisponibles: promosDisponibles, pesoRegiones: pesoRegiones,
    necesitaDoblaje: necesitaDoblaje, costoDoblaje: costoDoblaje, edadesObra: edadesObra, mixRecomendado: mixRecomendado,
    evaluarMix: evaluarMix, planPorDefecto: planPorDefecto, planRival: planRival, normalizar: normalizar, costos: costos, bonoConocimiento: bonoConocimiento,
    factorCampana: factorCampana, bonoDeseo: bonoDeseo, ajusteCritica: ajusteCritica, factorRegion: factorRegion, parteExtra: parteExtra,
    semanasMinimas: semanasMinimas, cadenas: cadenas, cadena: cadena, cinesPropios: cinesPropios, puedeFirmar: puedeFirmar,
    costoCadena: costoCadena, firmar: firmar, cancelar: cancelar, mensual: mensual, ANIO_SONORO: ANIO_SONORO,
